<style>
:root{
  --bg:#0E1013;
  --surface:#161A20;
  --surface2:#1D222A;
  --line:#2A313C;
  --ink:#EAEEF3;
  --muted:#8B95A3;
  --signal:#FF5A1F;
  --pos:#37C98A;
  --neg:#FF5B5B;
  --paper:#F1ECE2;
  --paper-ink:#171412;
  --paper-line:#C9C0B1;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.4;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.02em}
a{color:var(--signal)}

/* ---------- Topbar ---------- */
#topbar{
  position:sticky;top:0;z-index:40;
  padding:calc(var(--safe-top) + 10px) 16px 10px;
  background:rgba(14,16,19,.86);
  backdrop-filter:saturate(160%) blur(14px);
  -webkit-backdrop-filter:saturate(160%) blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
#viewTitle{font-size:26px}
.icon-btn{
  width:36px;height:36px;border-radius:10px;color:var(--muted);
  display:grid;place-items:center;font-size:15px;background:var(--surface2);
}
.icon-btn:active{background:var(--line)}
.searchwrap{margin-top:10px}
#search{
  width:100%;background:var(--surface2);border:1px solid var(--line);
  border-radius:11px;padding:9px 12px;font-size:15px;
  -webkit-appearance:none;appearance:none;
}
#search::placeholder{color:var(--muted)}
#search:focus{outline:2px solid var(--signal);outline-offset:-1px}

/* ---------- Layout ---------- */
#main{padding:14px 16px calc(96px + var(--safe-bottom))}
.view{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin:22px 0 8px;
}
.eyebrow:first-child{margin-top:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:8px}

.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pos{color:var(--pos)}
.neg{color:var(--neg)}
.dim{color:var(--muted)}

.btn{
  background:var(--signal);color:#12100E;font-weight:680;
  border-radius:12px;padding:13px 16px;width:100%;text-align:center;
  letter-spacing:-.01em;
}
.btn:active{filter:brightness(.9)}
.btn-ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line);font-weight:560}
.btn-danger{background:transparent;color:var(--neg);border:1px solid var(--neg)}
.btn-row{display:flex;gap:8px;margin-top:12px}

.empty{
  border:1px dashed var(--line);border-radius:var(--r);padding:26px 18px;
  text-align:center;color:var(--muted);font-size:14px;
}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px;font-weight:600}

/* ---------- Kennzahlen ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px}
.kpi .lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:var(--mono)}
.kpi .val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:20px;margin-top:5px;letter-spacing:-.03em}
.kpi.wide{grid-column:1/-1}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;background:var(--surface2);border:1px solid var(--line);
  border-radius:999px;padding:7px 13px;font-size:13.5px;color:var(--muted);
}
.chip.is-active{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}

/* ---------- Produktliste ---------- */
.row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;
}
.row:active{background:var(--surface2)}
.thumb{
  width:46px;height:46px;border-radius:10px;flex:0 0 auto;object-fit:cover;
  background:var(--surface2);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--muted);font-size:16px;
}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-end{text-align:right;flex:0 0 auto}
.row-end .big{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:16px}
.row-end .small{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.low{color:var(--neg)!important}
.badge{
  display:inline-block;font-size:10.5px;font-family:var(--mono);letter-spacing:.08em;
  text-transform:uppercase;padding:2px 6px;border-radius:5px;
  background:var(--surface2);border:1px solid var(--line);color:var(--muted);
}
.badge.warn{color:var(--signal);border-color:rgba(255,90,31,.4)}

/* ---------- Rang-Liste ---------- */
.rank{display:flex;align-items:center;gap:12px;padding:11px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.rank-no{
  font-family:var(--mono);font-size:13px;width:26px;flex:0 0 auto;text-align:center;
  color:var(--muted);border-right:1px solid var(--line);padding-right:8px;
}
.rank:nth-child(1) .rank-no{color:var(--signal);font-weight:700}

/* ---------- Beleg (Erfassung) ---------- */
.receipt{
  background:var(--paper);color:var(--paper-ink);
  border-radius:12px 12px 0 0;padding:18px 18px 10px;
  font-family:var(--mono);position:relative;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}
.receipt-foot{
  height:11px;background:var(--paper);
  clip-path:polygon(0 0,100% 0,100% 0,96% 100%,92% 0,88% 100%,84% 0,80% 100%,76% 0,72% 100%,68% 0,64% 100%,60% 0,56% 100%,52% 0,48% 100%,44% 0,40% 100%,36% 0,32% 100%,28% 0,24% 100%,20% 0,16% 100%,12% 0,8% 100%,4% 0,0 100%);
}
.receipt-head{text-align:center;border-bottom:1px dashed var(--paper-line);padding-bottom:10px;margin-bottom:6px}
.receipt-head .t{font-size:13px;letter-spacing:.22em;text-transform:uppercase;font-weight:700}
.receipt-head .d{font-size:11px;color:#6C645A;margin-top:2px;letter-spacing:.06em}
.rline{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dotted var(--paper-line)}
.rline label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#6C645A;flex:0 0 82px}
.rline input,.rline select{
  flex:1;min-width:0;background:transparent;border:0;color:var(--paper-ink);
  font-family:var(--mono);font-size:15px;text-align:right;padding:2px 0;
  -webkit-appearance:none;appearance:none;
}
.rline select{text-align:right;text-align-last:right;padding-right:2px}
.rline input:focus,.rline select:focus{outline:0;box-shadow:0 2px 0 var(--signal)}
.rtotal{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0 2px;border-top:2px solid var(--paper-ink);margin-top:8px}
.rtotal .l{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.rtotal .v{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums}
.rprofit{display:flex;justify-content:space-between;font-size:12.5px;color:#6C645A;padding-bottom:8px}
.rprofit .g{color:#1E7A4F;font-weight:700}
.rprofit .r{color:#B0342F;font-weight:700}

.seg{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:13px;color:var(--muted);font-weight:560}
.seg button.is-active{background:var(--signal);color:#12100E;font-weight:680}

/* ---------- Chart ---------- */
.chart{width:100%;height:auto;display:block}
.chart .bar-r{fill:var(--surface2)}
.chart .bar-p{fill:var(--signal)}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:9px}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);font-family:var(--mono);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ---------- Tabbar ---------- */
#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(14,16,19,.9);
  backdrop-filter:saturate(160%) blur(16px);
  -webkit-backdrop-filter:saturate(160%) blur(16px);
  border-top:1px solid var(--line);
  padding-bottom:var(--safe-bottom);
}
.tab{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 2px 8px;font-size:10.5px;color:var(--muted);letter-spacing:.01em;
}
.tab-ico{font-size:16px;line-height:1}
.tab.is-active{color:var(--signal)}

/* ---------- Sheet ---------- */
.sheet{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sheet-panel{
  position:relative;width:100%;max-height:92vh;overflow-y:auto;
  background:var(--bg);border-top:1px solid var(--line);
  border-radius:20px 20px 0 0;
  padding:0 16px calc(20px + var(--safe-bottom));
  animation:up .22s cubic-bezier(.2,.8,.2,1);
  -webkit-overflow-scrolling:touch;
}
@keyframes up{from{transform:translateY(14%)}to{transform:none}}
.sheet-head{
  position:sticky;top:0;background:var(--bg);z-index:2;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 0 12px;border-bottom:1px solid var(--line);margin-bottom:14px;
}
.sheet-head h2{font-size:19px}

.field{margin-bottom:11px}
.field label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:var(--mono);margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:11px 12px;font-size:16px;-webkit-appearance:none;appearance:none;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--signal);outline-offset:-1px}
.field-2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.photo-pick{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.photo-pick img,.photo-pick .ph{
  width:64px;height:64px;border-radius:12px;object-fit:cover;
  background:var(--surface2);border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:20px;
}
.photo-pick .acts{display:flex;flex-direction:column;gap:6px;flex:1}
.photo-pick .acts button{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:13px}

.ledger{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.ledger:last-child{border-bottom:0}
.ledger .lm{min-width:0}
.ledger .ld{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.ledger .lv{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

.toast{
  position:fixed;left:50%;bottom:calc(84px + var(--safe-bottom));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;
  font-size:14px;font-weight:600;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.4);
}

</style>
</head>
<body>

<header id="topbar">
  <div class="topbar-row">
    <h1 id="viewTitle">Lager</h1>
    <button id="menuBtn" class="icon-btn" aria-label="Menü">•••</button>
  </div>
  <div class="searchwrap">
    <input id="search" type="search" placeholder="Suchen" autocomplete="off" autocorrect="off" spellcheck="false">
  </div>
</header>

<main id="main">
  <section class="view" id="view-stock"></section>
  <section class="view" id="view-entry" hidden></section>
  <section class="view" id="view-finance" hidden></section>
  <section class="view" id="view-partners" hidden></section>
  <section class="view" id="view-stats" hidden></section>
</main>

<nav id="tabbar">
  <button class="tab is-active" data-tab="stock"><span class="tab-ico">▤</span>Lager</button>
  <button class="tab" data-tab="entry"><span class="tab-ico">✚</span>Erfassung</button>
  <button class="tab" data-tab="finance"><span class="tab-ico">€</span>Finanzen</button>
  <button class="tab" data-tab="partners"><span class="tab-ico">⇄</span>Partner</button>
  <button class="tab" data-tab="stats"><span class="tab-ico">▮</span>Statistik</button>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button class="icon-btn" data-close aria-label="Schließen">✕</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script>
/* =========================================================
   Lager — Offline-Warenwirtschaft (PWA)
   Alle Daten bleiben lokal im Browser (IndexedDB).
   ========================================================= */

/* ---------- Datenbank ---------- */
const STORES = ['products', 'movements', 'partners', 'payments'];
let db = null;

function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('lagerdb', 1);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      STORES.forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); });
    };
    r.onsuccess = e => res(e.target.result);
    r.onerror = e => rej(e.target.error);
  });
}
function getAll(store) {
  return new Promise((res, rej) => {
    const q = db.transaction(store, 'readonly').objectStore(store).getAll();
    q.onsuccess = () => res(q.result || []);
    q.onerror = () => rej(q.error);
  });
}
function dbPut(store, obj) {
  return new Promise((res, rej) => {
    const q = db.transaction(store, 'readwrite').objectStore(store).put(obj);
    q.onsuccess = () => res(obj);
    q.onerror = () => rej(q.error);
  });
}
function dbDel(store, id) {
  return new Promise((res, rej) => {
    const q = db.transaction(store, 'readwrite').objectStore(store).delete(id);
    q.onsuccess = () => res();
    q.onerror = () => rej(q.error);
  });
}
function dbClear(store) {
  return new Promise(res => {
    const q = db.transaction(store, 'readwrite').objectStore(store).clear();
    q.onsuccess = () => res();
  });
}

/* ---------- Zustand ---------- */
const S = { products: [], movements: [], partners: [], payments: [] };
let tab = 'stock';
const query = { stock: '', entry: '', finance: '', partners: '', stats: '' };
let period = 'month';
let statsYear = new Date().getFullYear();
let entryType = 'sale';
const entryDraft = { productId: '', qty: '', unitPrice: '', date: today(), partnerId: '' };

/* ---------- Helfer ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const eur = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' });
const num = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 2 });
const money = v => eur.format(v || 0);
function today() { const d = new Date(); return d.toISOString().slice(0, 10); }
function deDate(iso) { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}.${m}.${y}`; }
const MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const MON3 = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').toLowerCase();
const byId = (arr, id) => arr.find(x => x.id === id);
const num2 = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };

const TYPE_LABEL = { purchase: 'Einkauf', sale: 'Verkauf', consign: 'Ausgabe', return: 'Rückgabe' };
const OUT = ['sale', 'consign'];          // verlässt das Lager
const IN = ['purchase', 'return'];        // kommt ins Lager

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.hidden = true; }, 1800);
}

/* ---------- Berechnungen ---------- */
function stockOf(pid) {
  let n = 0;
  for (const m of S.movements) {
    if (m.productId !== pid) continue;
    if (IN.includes(m.type)) n += m.qty; else n -= m.qty;
  }
  return n;
}
function profitOf(m) {
  const gross = (m.unitPrice - m.costPrice) * m.qty;
  if (m.type === 'sale' || m.type === 'consign') return gross;
  if (m.type === 'return') return -gross;
  return 0;
}
function revenueOf(m) {
  if (m.type === 'sale' || m.type === 'consign') return m.unitPrice * m.qty;
  if (m.type === 'return') return -(m.unitPrice * m.qty);
  return 0;
}
function cogsOf(m) {
  if (m.type === 'sale' || m.type === 'consign') return m.costPrice * m.qty;
  if (m.type === 'return') return -(m.costPrice * m.qty);
  return 0;
}
function unitsOf(m) {
  if (m.type === 'sale' || m.type === 'consign') return m.qty;
  if (m.type === 'return') return -m.qty;
  return 0;
}
function periodRange(p) {
  const now = new Date(); const y = now.getFullYear(), mo = now.getMonth(), d = now.getDate();
  const iso = dt => dt.toISOString().slice(0, 10);
  if (p === 'today') return [iso(new Date(y, mo, d)), iso(new Date(y, mo, d))];
  if (p === 'week') { const dow = (now.getDay() + 6) % 7; return [iso(new Date(y, mo, d - dow)), iso(new Date(y, mo, d - dow + 6))]; }
  if (p === 'month') return [iso(new Date(y, mo, 1)), iso(new Date(y, mo + 1, 0))];
  if (p === 'year') return [`${y}-01-01`, `${y}-12-31`];
  return ['0000-01-01', '9999-12-31'];
}
function inPeriod(m, p) { const [a, b] = periodRange(p); return m.date >= a && m.date <= b; }

function partnerBalance(pid) {
  let credit = 0, debt = 0;                       // credit: Partner schuldet mir · debt: ich schulde Partner
  for (const m of S.movements) {
    if (m.partnerId !== pid) continue;
    const val = m.unitPrice * m.qty;
    if (m.type === 'consign') credit += val;
    else if (m.type === 'return') credit -= val;
    else if (m.type === 'purchase') debt += val;
  }
  for (const p of S.payments) {
    if (p.partnerId !== pid) continue;
    if (p.direction === 'in') credit -= p.amount; else debt -= p.amount;
  }
  return { credit, debt, net: credit - debt };
}
function stockValue() {
  return S.products.reduce((s, p) => s + stockOf(p.id) * (p.buyPrice || 0), 0);
}
function openReceivables() {
  return S.partners.reduce((s, p) => { const n = partnerBalance(p.id).net; return s + (n > 0 ? n : 0); }, 0);
}

/* ---------- Rendering ---------- */
const V = {
  stock: document.getElementById('view-stock'),
  entry: document.getElementById('view-entry'),
  finance: document.getElementById('view-finance'),
  partners: document.getElementById('view-partners'),
  stats: document.getElementById('view-stats'),
};
const TITLES = { stock: 'Lager', entry: 'Erfassung', finance: 'Finanzen', partners: 'Partner', stats: 'Statistik' };
const PLACEHOLDER = { stock: 'Produkt, Marke, Kategorie', entry: 'Buchungen durchsuchen', finance: 'Produkt suchen', partners: 'Partner suchen', stats: 'Produkt oder Partner' };

function render() {
  document.getElementById('viewTitle').textContent = TITLES[tab];
  const s = document.getElementById('search');
  s.placeholder = PLACEHOLDER[tab];
  if (s.value !== query[tab]) s.value = query[tab];
  Object.keys(V).forEach(k => { V[k].hidden = k !== tab; });
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('is-active', b.dataset.tab === tab));
  ({ stock: renderStock, entry: renderEntry, finance: renderFinance, partners: renderPartners, stats: renderStats })[tab]();
}

/* ===== Lager ===== */
function renderStock() {
  const q = norm(query.stock);
  let list = S.products.slice();
  if (q) list = list.filter(p => norm(p.name).includes(q) || norm(p.brand).includes(q) || norm(p.category).includes(q));
  list.sort((a, b) => a.name.localeCompare(b.name, 'de'));

  const units = S.products.reduce((s, p) => s + Math.max(0, stockOf(p.id)), 0);
  const low = S.products.filter(p => stockOf(p.id) <= (p.minStock || 0)).length;

  V.stock.innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="lab">Artikel im Lager</div><div class="val">${num.format(units)}</div></div>
      <div class="kpi"><div class="lab">Lagerwert</div><div class="val">${money(stockValue())}</div></div>
    </div>
    <button class="btn" id="newProduct" style="margin-top:10px">Neues Produkt anlegen</button>
    ${low ? `<p class="dim" style="font-size:13px;margin:12px 0 0">${low} Produkt(e) unter Mindestbestand.</p>` : ''}
    <div class="eyebrow">${q ? `Treffer · ${list.length}` : `Produkte · ${S.products.length}`}</div>
    <div class="stack" id="plist">
      ${list.length ? list.map(p => productRow(p)).join('') : emptyBox(
        S.products.length ? 'Keine Treffer' : 'Noch keine Produkte',
        S.products.length ? 'Andere Suche versuchen.' : 'Leg dein erstes Produkt an — Name, Foto, Preise und Anfangsbestand.')}
    </div>`;
  document.getElementById('newProduct').onclick = () => productSheet(null);
  V.stock.querySelectorAll('[data-pid]').forEach(el => el.onclick = () => productSheet(byId(S.products, el.dataset.pid)));
}
function productRow(p) {
  const st = stockOf(p.id), isLow = st <= (p.minStock || 0);
  return `<button class="row" data-pid="${p.id}">
    ${p.photo ? `<img class="thumb" src="${p.photo}" alt="">` : `<div class="thumb">▤</div>`}
    <div class="row-main">
      <div class="row-title">${esc(p.name)}</div>
      <div class="row-sub">${[p.brand, p.category].filter(Boolean).map(esc).join(' · ') || 'Ohne Marke'} · VK ${money(p.sellPrice)}</div>
    </div>
    <div class="row-end">
      <div class="big ${isLow ? 'low' : ''}">${num.format(st)}</div>
      <div class="small">Stück</div>
    </div></button>`;
}
function emptyBox(title, text) { return `<div class="empty"><b>${esc(title)}</b>${esc(text)}</div>`; }

/* ===== Erfassung (Beleg) ===== */
function renderEntry() {
  const q = norm(query.entry);
  let last = S.movements.slice().sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id));
  if (q) last = last.filter(m => {
    const p = byId(S.products, m.productId), pa = byId(S.partners, m.partnerId);
    return norm(p && p.name).includes(q) || norm(pa && pa.name).includes(q) || norm(TYPE_LABEL[m.type]).includes(q);
  });
  last = last.slice(0, 40);

  const opts = S.products.slice().sort((a, b) => a.name.localeCompare(b.name, 'de'))
    .map(p => `<option value="${p.id}" ${p.id === entryDraft.productId ? 'selected' : ''}>${esc(p.name)}${p.brand ? ' · ' + esc(p.brand) : ''}</option>`).join('');
  const partnerRole = entryType === 'purchase' ? 'supplier' : 'buyer';
  const pOpts = S.partners.filter(p => p.type === partnerRole || entryType === 'return')
    .map(p => `<option value="${p.id}" ${p.id === entryDraft.partnerId ? 'selected' : ''}>${esc(p.name)}</option>`).join('');

  V.entry.innerHTML = `
    <div class="seg" id="segType">
      ${Object.entries(TYPE_LABEL).map(([k, v]) => `<button data-t="${k}" class="${k === entryType ? 'is-active' : ''}">${v}</button>`).join('')}
    </div>

    <div class="receipt">
      <div class="receipt-head">
        <div class="t">${TYPE_LABEL[entryType]}</div>
        <div class="d">Beleg-Entwurf · ${deDate(entryDraft.date)}</div>
      </div>
      <div class="rline"><label>Produkt</label>
        <select id="fProd">${S.products.length ? `<option value="">— wählen —</option>${opts}` : `<option value="">Erst Produkt anlegen</option>`}</select></div>
      <div class="rline"><label>Menge</label>
        <input id="fQty" type="number" inputmode="decimal" min="0" step="1" placeholder="0" value="${esc(entryDraft.qty)}"></div>
      <div class="rline"><label>Stückpreis</label>
        <input id="fPrice" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0,00" value="${esc(entryDraft.unitPrice)}"></div>
      <div class="rline"><label>Datum</label>
        <input id="fDate" type="date" value="${entryDraft.date}"></div>
      <div class="rline"><label>${entryType === 'purchase' ? 'Lieferant' : 'Abnehmer'}</label>
        <select id="fPartner"><option value="">— ohne —</option>${pOpts}</select></div>

      <div id="rTotals">${totalsHTML()}</div>
    </div>
    <div class="receipt-foot"></div>

    <button class="btn" id="saveMove" style="margin-top:14px">Buchung speichern</button>

    <div class="eyebrow">Letzte Buchungen</div>
    <div class="stack">
      ${last.length ? last.map(moveRow).join('') : emptyBox('Noch nichts gebucht', 'Trag oben deine erste Bewegung ein.')}
    </div>`;

  document.getElementById('segType').onclick = e => {
    const b = e.target.closest('[data-t]'); if (!b) return;
    entryType = b.dataset.t; entryDraft.partnerId = ''; syncPrice(); renderEntry();
  };
  const bind = (id, key) => {
    const el = document.getElementById(id); if (!el) return;
    const h = () => { entryDraft[key] = el.value; updateTotals(); };
    el.oninput = h; el.onchange = h;
  };
  bind('fQty', 'qty'); bind('fPrice', 'unitPrice'); bind('fDate', 'date'); bind('fPartner', 'partnerId');
  const fp = document.getElementById('fProd');
  if (fp) fp.onchange = () => {
    entryDraft.productId = fp.value; syncPrice();
    const pr = document.getElementById('fPrice'); if (pr) pr.value = entryDraft.unitPrice;
    updateTotals();
  };
  document.getElementById('saveMove').onclick = saveMovement;
  V.entry.querySelectorAll('[data-mid]').forEach(el => el.onclick = () => movementSheet(byId(S.movements, el.dataset.mid)));
}

/* Summen im Beleg aktualisieren, ohne das Formular neu zu bauen */
function totalsHTML() {
  const prod = byId(S.products, entryDraft.productId);
  const qty = num2(entryDraft.qty), price = num2(entryDraft.unitPrice);
  const cost = prod ? prod.buyPrice || 0 : 0;
  const profit = (price - cost) * qty;
  const isOut = OUT.includes(entryType);
  const cur = prod ? stockOf(prod.id) : 0;
  return `
    <div class="rtotal"><span class="l">Summe</span><span class="v">${money(qty * price)}</span></div>
    <div class="rprofit">
      <span>${isOut ? 'Gewinn dieser Buchung' : entryType === 'purchase' ? 'Erhöht den Lagerwert' : 'Storniert eine Ausgabe'}</span>
      <span class="${profit >= 0 ? 'g' : 'r'}">${isOut ? money(profit) : '—'}</span>
    </div>
    <div class="rprofit" style="border-top:1px dashed var(--paper-line);padding-top:8px">
      <span>Bestand ${prod ? esc(prod.name) : '—'}</span>
      <span>${prod ? num.format(cur) + ' → ' + num.format(cur + (IN.includes(entryType) ? qty : -qty)) : '—'}</span>
    </div>`;
}
function updateTotals() {
  const t = document.getElementById('rTotals'); if (t) t.innerHTML = totalsHTML();
  const d = document.querySelector('.receipt-head .d');
  if (d) d.textContent = 'Beleg-Entwurf · ' + deDate(entryDraft.date);
}
function syncPrice() {
  const p = byId(S.products, entryDraft.productId);
  if (!p) return;
  entryDraft.unitPrice = String(entryType === 'purchase' ? (p.buyPrice || '') : (p.sellPrice || ''));
}
function moveRow(m) {
  const p = byId(S.products, m.productId), pa = byId(S.partners, m.partnerId);
  const val = m.unitPrice * m.qty;
  const sign = IN.includes(m.type) ? '+' : '−';
  return `<button class="row" data-mid="${m.id}">
    <div class="row-main">
      <div class="row-title">${esc(p ? p.name : 'Gelöschtes Produkt')}</div>
      <div class="row-sub">${TYPE_LABEL[m.type]} · ${deDate(m.date)}${pa ? ' · ' + esc(pa.name) : ''}</div>
    </div>
    <div class="row-end">
      <div class="big">${money(val)}</div>
      <div class="small">${sign}${num.format(m.qty)} Stk</div>
    </div></button>`;
}
async function saveMovement() {
  const p = byId(S.products, entryDraft.productId);
  if (!p) return toast('Produkt wählen');
  const qty = num2(entryDraft.qty);
  if (qty <= 0) return toast('Menge eintragen');
  const price = num2(entryDraft.unitPrice);
  const m = {
    id: uid(), type: entryType, productId: p.id, qty,
    unitPrice: price, costPrice: p.buyPrice || 0,
    date: entryDraft.date || today(), partnerId: entryDraft.partnerId || '', note: ''
  };
  await dbPut('movements', m); S.movements.push(m);
  entryDraft.qty = '';
  toast(TYPE_LABEL[entryType] + ' gespeichert');
  renderEntry();
}

/* ===== Finanzen ===== */
function renderFinance() {
  const q = norm(query.finance);
  const inP = S.movements.filter(m => inPeriod(m, period));
  const rev = inP.reduce((s, m) => s + revenueOf(m), 0);
  const cogs = inP.reduce((s, m) => s + cogsOf(m), 0);
  const profit = rev - cogs;
  const buys = inP.filter(m => m.type === 'purchase').reduce((s, m) => s + m.unitPrice * m.qty, 0);
  const margin = rev ? (profit / rev) * 100 : 0;

  // Bestseller im Zeitraum
  const agg = {};
  inP.forEach(m => {
    if (!OUT.includes(m.type) && m.type !== 'return') return;
    const a = agg[m.productId] || (agg[m.productId] = { units: 0, rev: 0, profit: 0 });
    a.units += unitsOf(m); a.rev += revenueOf(m); a.profit += profitOf(m);
  });
  let best = Object.entries(agg).map(([pid, a]) => ({ p: byId(S.products, pid), ...a }))
    .filter(x => x.p && x.units > 0).sort((a, b) => b.units - a.units);
  const soldIds = new Set(best.map(x => x.p.id));
  let slow = S.products.filter(p => !soldIds.has(p.id));
  if (q) { best = best.filter(x => norm(x.p.name).includes(q) || norm(x.p.brand).includes(q)); slow = slow.filter(p => norm(p.name).includes(q)); }

  V.finance.innerHTML = `
    <div class="chips" id="periodChips">
      ${[['today', 'Heute'], ['week', 'Woche'], ['month', 'Monat'], ['year', 'Jahr'], ['all', 'Gesamt']]
      .map(([k, l]) => `<button class="chip ${k === period ? 'is-active' : ''}" data-p="${k}">${l}</button>`).join('')}
    </div>
    <div class="kpis" style="margin-top:12px">
      <div class="kpi"><div class="lab">Umsatz</div><div class="val">${money(rev)}</div></div>
      <div class="kpi"><div class="lab">Gewinn</div><div class="val ${profit >= 0 ? 'pos' : 'neg'}">${money(profit)}</div></div>
      <div class="kpi"><div class="lab">Marge</div><div class="val">${num.format(margin.toFixed(1))} %</div></div>
      <div class="kpi"><div class="lab">Wareneinsatz</div><div class="val">${money(cogs)}</div></div>
      <div class="kpi"><div class="lab">Einkäufe</div><div class="val">${money(buys)}</div></div>
      <div class="kpi"><div class="lab">Lagerwert</div><div class="val">${money(stockValue())}</div></div>
      <div class="kpi wide"><div class="lab">Offene Forderungen</div><div class="val ${openReceivables() > 0 ? 'neg' : ''}">${money(openReceivables())}</div></div>
    </div>

    <div class="eyebrow">Verlauf ${new Date().getFullYear()}</div>
    <div class="card">${monthChart(new Date().getFullYear())}
      <div class="legend"><span><i style="background:var(--surface2);border:1px solid var(--line)"></i>Umsatz</span><span><i style="background:var(--signal)"></i>Gewinn</span></div>
    </div>

    <div class="eyebrow">Meistverkauft im Zeitraum</div>
    <div class="stack">
      ${best.length ? best.slice(0, 12).map((x, i) => `
        <div class="rank"><div class="rank-no">${i + 1}</div>
          <div class="row-main"><div class="row-title">${esc(x.p.name)}</div>
            <div class="row-sub">${num.format(x.units)} Stück · Umsatz ${money(x.rev)}</div></div>
          <div class="row-end"><div class="big ${x.profit >= 0 ? 'pos' : 'neg'}">${money(x.profit)}</div><div class="small">Gewinn</div></div>
        </div>`).join('') : emptyBox('Keine Verkäufe im Zeitraum', 'Wähle oben einen anderen Zeitraum.')}
    </div>

    <div class="eyebrow">Ladenhüter · ohne Verkauf im Zeitraum</div>
    <div class="stack">
      ${slow.length ? slow.slice(0, 12).map(p => `
        <div class="row"><div class="row-main"><div class="row-title">${esc(p.name)}</div>
          <div class="row-sub">Bestand ${num.format(stockOf(p.id))} · gebunden ${money(stockOf(p.id) * (p.buyPrice || 0))}</div></div>
        </div>`).join('') : emptyBox('Alles bewegt sich', 'Jedes Produkt wurde im Zeitraum verkauft.')}
    </div>`;

  document.getElementById('periodChips').onclick = e => {
    const b = e.target.closest('[data-p]'); if (!b) return; period = b.dataset.p; renderFinance();
  };
}
function monthChart(year) {
  const rev = Array(12).fill(0), pro = Array(12).fill(0);
  S.movements.forEach(m => {
    const [y, mo] = m.date.split('-').map(Number);
    if (y !== year) return;
    rev[mo - 1] += revenueOf(m); pro[mo - 1] += profitOf(m);
  });
  const max = Math.max(1, ...rev, ...pro);
  const W = 340, H = 150, pad = 16, bw = (W - pad * 2) / 12;
  let bars = '';
  for (let i = 0; i < 12; i++) {
    const hr = Math.max(0, rev[i] / max) * (H - 34), hp = Math.max(0, pro[i] / max) * (H - 34);
    const x = pad + i * bw;
    bars += `<rect class="bar-r" x="${x + 2}" y="${H - 20 - hr}" width="${bw - 8}" height="${hr}" rx="2"/>`;
    bars += `<rect class="bar-p" x="${x + 2}" y="${H - 20 - hp}" width="${bw - 8}" height="${hp}" rx="2"/>`;
    bars += `<text x="${x + (bw - 6) / 2}" y="${H - 7}" text-anchor="middle">${MON3[i][0]}</text>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${bars}</svg>`;
}

/* ===== Partner ===== */
function renderPartners() {
  const q = norm(query.partners);
  let list = S.partners.slice();
  if (q) list = list.filter(p => norm(p.name).includes(q) || norm(p.contact).includes(q));
  list.sort((a, b) => partnerBalance(b.id).net - partnerBalance(a.id).net);

  const owed = openReceivables();
  const iOwe = S.partners.reduce((s, p) => { const n = partnerBalance(p.id).net; return s + (n < 0 ? -n : 0); }, 0);

  V.partners.innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="lab">Mir wird geschuldet</div><div class="val ${owed ? 'pos' : ''}">${money(owed)}</div></div>
      <div class="kpi"><div class="lab">Ich schulde</div><div class="val ${iOwe ? 'neg' : ''}">${money(iOwe)}</div></div>
    </div>

/* ===== Statistik ===== */
function renderStats() {
  const q = norm(query.stats);
  const years = [...new Set(S.movements.map(m => +m.date.slice(0, 4)))].sort((a, b) => b - a);
  if (years.length && !years.includes(statsYear)) statsYear = years[0];
  const yMoves = S.movements.filter(m => +m.date.slice(0, 4) === statsYear);

  /* Top 10 Produkte */
  const pa = {};
  yMoves.forEach(m => {
    if (!OUT.includes(m.type) && m.type !== 'return') return;
    const a = pa[m.productId] || (pa[m.productId] = { units: 0, rev: 0, profit: 0 });
    a.units += unitsOf(m); a.rev += revenueOf(m); a.profit += profitOf(m);
  });
  let topP = Object.entries(pa).map(([id, a]) => ({ p: byId(S.products, id), ...a }))
    .filter(x => x.p && x.units > 0).sort((a, b) => b.units - a.units);
  if (q) topP = topP.filter(x => norm(x.p.name).includes(q) || norm(x.p.brand).includes(q));
  topP = topP.slice(0, 10);

  /* Top 3 Partner */
  const ta = {};
  yMoves.forEach(m => {
    if (!m.partnerId || (!OUT.includes(m.type) && m.type !== 'return')) return;
    const a = ta[m.partnerId] || (ta[m.partnerId] = { units: 0, profit: 0, rev: 0 });
    a.units += unitsOf(m); a.profit += profitOf(m); a.rev += revenueOf(m);
  });
  let topT = Object.entries(ta).map(([id, a]) => ({ pa: byId(S.partners, id), ...a }))
    .filter(x => x.pa && x.units > 0).sort((a, b) => b.units - a.units);
  if (q) topT = topT.filter(x => norm(x.pa.name).includes(q));
  topT = topT.slice(0, 3);

  /* Top 3 Monate */
  const ma = Array.from({ length: 12 }, () => ({ units: 0, profit: 0, rev: 0 }));
  yMoves.forEach(m => {
    const i = +m.date.slice(5, 7) - 1;
    ma[i].units += unitsOf(m); ma[i].profit += profitOf(m); ma[i].rev += revenueOf(m);
  });
  const topM = ma.map((a, i) => ({ i, ...a })).filter(x => x.units > 0).sort((a, b) => b.profit - a.profit).slice(0, 3);

  V.stats.innerHTML = `
    <div class="chips" id="yearChips">
      ${(years.length ? years : [statsYear]).map(y => `<button class="chip ${y === statsYear ? 'is-active' : ''}" data-y="${y}">${y}</button>`).join('')}
    </div>

    <div class="eyebrow">Top 10 Produkte · ${statsYear}</div>
    <div class="stack">
      ${topP.length ? topP.map((x, i) => `
        <div class="rank"><div class="rank-no">${String(i + 1).padStart(2, '0')}</div>
          ${x.p.photo ? `<img class="thumb" src="${x.p.photo}" alt="">` : `<div class="thumb">▤</div>`}
          <div class="row-main"><div class="row-title">${esc(x.p.name)}</div>
            <div class="row-sub">${esc(x.p.brand || 'ohne Marke')} · ${num.format(x.units)} Stück · ${money(x.rev)}</div></div>
          <div class="row-end"><div class="big ${x.profit >= 0 ? 'pos' : 'neg'}">${money(x.profit)}</div><div class="small">Gewinn</div></div>
        </div>`).join('') : emptyBox('Keine Daten für ' + statsYear, 'Sobald du Verkäufe buchst, erscheint hier deine Rangliste.')}
    </div>

    <div class="eyebrow">Top 3 Partner · ${statsYear}</div>
    <div class="stack">
      ${topT.length ? topT.map((x, i) => `
        <div class="rank"><div class="rank-no">${i + 1}</div>
          <div class="row-main"><div class="row-title">${esc(x.pa.name)}</div>
            <div class="row-sub">${num.format(x.units)} Stück · Umsatz ${money(x.rev)}</div></div>
          <div class="row-end"><div class="big ${x.profit >= 0 ? 'pos' : 'neg'}">${money(x.profit)}</div><div class="small">Gewinn</div></div>
        </div>`).join('') : emptyBox('Keine Partnerdaten', 'Ordne Buchungen einem Partner zu, dann zählt es hier mit.')}
    </div>

    <div class="eyebrow">Top 3 Monate · ${statsYear}</div>
    <div class="stack">
      ${topM.length ? topM.map((x, i) => `
        <div class="rank"><div class="rank-no">${i + 1}</div>
          <div class="row-main"><div class="row-title">${MONTHS[x.i]}</div>
            <div class="row-sub">${num.format(x.units)} Stück · Umsatz ${money(x.rev)}</div></div>
          <div class="row-end"><div class="big ${x.profit >= 0 ? 'pos' : 'neg'}">${money(x.profit)}</div><div class="small">Gewinn</div></div>
        </div>`).join('') : emptyBox('Noch kein Monat mit Umsatz', 'Buche Verkäufe, um die besten Monate zu sehen.')}
    </div>`;

  document.getElementById('yearChips').onclick = e => {
    const b = e.target.closest('[data-y]'); if (!b) return; statsYear = +b.dataset.y; renderStats();
  };
}

function shrink(file) {
  return new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const max = 900, sc = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.72));
      };
      im.onerror = () => res('');
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

      <div class="ledger"><div class="lm">Buchungen</div><div class="lv">${S.movements.length}</div></div>
      <div class="ledger"><div class="lm">Partner</div><div class="lv">${S.partners.length}</div></div>
      <div class="ledger"><div class="lm">Zahlungen</div><div class="lv">${S.payments.length}</div></div></div>
    <div class="btn-row"><button class="btn btn-danger" id="wipe">Alle Daten löschen</button></div>
  `, () => {
    document.getElementById('expJson').onclick = () => {
      download('lager-sicherung-' + today() + '.json', JSON.stringify({ v: 1, exported: new Date().toISOString(), ...S }, null, 2), 'application/json');
    };
    document.getElementById('expCsv').onclick = () => {
      const head = 'Datum;Typ;Produkt;Marke;Menge;Stueckpreis;Summe;Einkaufspreis;Gewinn;Partner\n';
      const rows = S.movements.slice().sort((a, b) => a.date.localeCompare(b.date)).map(m => {
        const p = byId(S.products, m.productId) || {}, pa = byId(S.partners, m.partnerId) || {};
        return [m.date, TYPE_LABEL[m.type], p.name || '', p.brand || '', m.qty,
        f2(m.unitPrice), f2(m.unitPrice * m.qty), f2(m.costPrice), f2(profitOf(m)), pa.name || '']
          .map(x => String(x).replace(/;/g, ',')).join(';');
      }).join('\n');
      download('buchungen-' + today() + '.csv', '\uFEFF' + head + rows, 'text/csv');
    };
    const imp = document.getElementById('impFile');
    document.getElementById('impBtn').onclick = () => imp.click();
    imp.onchange = async () => {
      const f = imp.files[0]; if (!f) return;
      try {
        const data = JSON.parse(await f.text());
        if (!confirm('Sicherung einlesen? Die aktuellen Daten werden ersetzt.')) return;
        for (const s of STORES) await dbClear(s);
        for (const s of STORES) { S[s] = Array.isArray(data[s]) ? data[s] : []; for (const rec of S[s]) await dbPut(s, rec); }
        closeSheet(); toast('Sicherung eingelesen'); render();
      } catch (e) { toast('Datei nicht lesbar'); }
    };
    document.getElementById('wipe').onclick = async () => {
      if (!confirm('Wirklich alle Produkte, Buchungen und Partner löschen?')) return;
      if (!confirm('Das lässt sich nicht rückgängig machen. Sicher?')) return;
      for (const s of STORES) { await dbClear(s); S[s] = []; }
      closeSheet(); toast('Alles gelöscht'); render();
    };
  });
}
const f2 = v => (Math.round((v || 0) * 100) / 100).toFixed(2).replace('.', ',');
function download(name, text, mime) {
  const b = new Blob([text], { type: mime });
  const u = URL.createObjectURL(b);
  const a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(u); a.remove(); }, 500);
}

/* ---------- Events & Start ---------- */
document.getElementById('tabbar').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  tab = b.dataset.tab; window.scrollTo(0, 0); render();
});
document.getElementById('search').addEventListener('input', e => { query[tab] = e.target.value; render(); });
document.getElementById('menuBtn').addEventListener('click', menuSheet);

(async function start() {
  try {
    db = await openDB();
    for (const s of STORES) S[s] = await getAll(s);
  } catch (e) {
    document.getElementById('main').innerHTML =
      '<div class="empty"><b>Speicher nicht verfügbar</b>Der private Modus von Safari blockiert die Datenbank. Öffne die App in einem normalen Tab.</div>';
    return;
  }
  render();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
})();

</script>

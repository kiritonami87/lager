/* ----- Schulden-Vorschau ----- */
function debtBox(jetzt, wert, du) {
  const danach = jetzt + wert;
  return `<div class="debt">
    <div class="ledger"><div class="lm">${du ? 'Du schuldest gerade' : 'Schulden jetzt'}</div>
      <div class="lv">${jetzt < -0.005 ? money(-jetzt) + ' Guthaben' : money(jetzt)}</div></div>
    <div class="ledger"><div class="lm">${du ? 'Diese Bestellung' : 'Noch zu übergeben'}</div><div class="lv">+ ${money(wert)}</div></div>
    <div class="ledger total"><div class="lm"><b>${du ? 'Danach schuldest du' : 'Danach schuldet er'}</b></div>
      <div class="lv ${danach > 0.005 ? 'neg' : 'pos'}">${danach < -0.005 ? money(-danach) + ' Guthaben' : money(danach)}</div></div>
  </div><p class="sub">${du ? 'Gerechnet mit deinem Läufer-Preis. Fest steht der Betrag, wenn dein Chef die Ware übergibt.' : 'Gerechnet mit dem Läufer-Preis der Produkte.'}</p>`;
}

/* ----- Zeiten auswählen (Warenkorb + Bestellung ändern) ----- */
function slotPicker(list, selId, exceptId) {
  const byDay = {};
  list.forEach(sl => (byDay[sl.day] = byDay[sl.day] || []).push(sl));
  return `<div class="slotbox">${Object.keys(byDay).sort().map(d => `<div class="slotday">${dayLabel(d)}${d === today() ? ' · heute' : ''}</div>
    <div class="slots">${byDay[d].map(sl => {
      const cap = +sl.capacity, rest = cap ? cap - slotTaken(sl, exceptId) : 0;
      const sub = [cap === 0 ? '' : rest > 1 ? rest + ' frei' : '', sl.place ? esc(sl.place) : ''].filter(Boolean).join(' · ');
      return `<button class="slot ${sl.id === selId ? 'is-active' : ''}" data-pick="${sl.id}">${slotText(sl)}${sub ? `<small>${sub}</small>` : ''}</button>`;
    }).join('')}</div>`).join('')}</div>`;
}
function wSlotPicker(onPick) {
  const all = document.querySelectorAll('[data-pick]');
  all.forEach(el => el.onclick = () => {
    all.forEach(x => x.classList.toggle('is-active', x === el));
    onPick(el.dataset.pick);
  });
  const act = document.querySelector('[data-pick].is-active');
  if (act) act.scrollIntoView({ block: 'nearest' });
}
// Server lehnt eine Zeit ab (inzwischen vergeben, vorbei, Urlaub) → frisch laden und nochmal
const isSlotError = e => /vergeben|vorbei|Urlaub|Zeiten vom Chef|gibt es nicht mehr/i.test((e && e.message) || '');

/* ----- Warenkorb (Läufer) ----- */
function cartSheet() {
  const ids = Object.keys(cart).filter(id => byId(S.katalog, id));
  const wert = ids.reduce((sum, id) => sum + (+byId(S.katalog, id).runner_price || 0) * cart[id], 0);
  const frei = freeSlots();
  if (cartMeta.slot && !frei.some(x => x.id === cartMeta.slot)) cartMeta.slot = '';
  openSheet('Dein Warenkorb', `
    ${ids.length ? ids.map(id => {
      const p = byId(S.katalog, id), zuviel = cart[id] > +p.stock;
      return `<div class="row" style="margin-bottom:8px">
        <div class="row-main"><div class="row-title">${esc(p.name)}</div>
          <div class="row-sub">${money(p.runner_price)} je Stück · ${money((+p.runner_price || 0) * cart[id])} gesamt</div>
          ${zuviel ? `<div class="row-sub" style="color:var(--signal)">Gerade nur ${nf.format(Math.max(0, +p.stock))} verfügbar</div>` : ''}</div>
        <div class="qtybox"><button class="sellbtn plusminus" data-cm="${id}">−</button>
          <span class="n">${cart[id]}</span>
          <button class="sellbtn plusminus" data-cp="${id}">+</button></div></div>`;
    }).join('') : '<p class="sub">Der Korb ist leer.</p>'}
    ${ids.length ? `
      ${debtBox(runnerDebt(Auth.me.id), wert, true)}
      <div class="eyebrow">Wann?</div>
      ${frei.length
        ? slotPicker(frei, cartMeta.slot) + '<p class="sub">Du kannst nur die Zeiten wählen, die dein Chef eingetragen hat.</p>'
        : `<div class="field-2">
            <div class="field"><label>Datum</label><input id="coDate" type="date" value="${esc(cartMeta.date)}"></div>
            <div class="field"><label>Uhrzeit</label><input id="coTime" type="time" value="${esc(cartMeta.time)}"></div></div>
           <p class="sub" style="margin-top:0">Dein Chef hat gerade keine festen Zeiten eingetragen — schlag eine vor.</p>`}
      <div class="eyebrow">Wo?</div>
      <div class="field"><label>Ort</label><input id="coPlace" maxlength="200" value="${esc(cartMeta.place || Auth.me.area || '')}" placeholder="z. B. Flohmarkt Landshut"></div>
      <div class="field"><label>Notiz</label><textarea id="coNote" rows="2" maxlength="1000" placeholder="Alles was wichtig ist">${esc(cartMeta.note)}</textarea></div>
      <div class="btn-row"><button class="btn" id="coGo">An den Chef schicken</button></div>
      <div class="btn-row"><button class="btn btn-ghost" id="coClear">Korb leeren</button></div>` : ''}
  `, () => {
    const keep = () => {
      [['coDate', 'date'], ['coTime', 'time'], ['coPlace', 'place'], ['coNote', 'note']].forEach(([id, k]) => {
        const el = document.getElementById(id); if (el) cartMeta[k] = el.value;
      });
      saveCart();
    };
    ['coDate', 'coTime', 'coPlace', 'coNote'].forEach(id => { const el = document.getElementById(id); if (el) el.oninput = keep; });
    wSlotPicker(id => { cartMeta.slot = id; saveCart(); });
    document.querySelectorAll('[data-cp]').forEach(el => el.onclick = () => { keep(); cartAdd(el.dataset.cp, 1); cartSheet(); render(); });
    document.querySelectorAll('[data-cm]').forEach(el => el.onclick = () => { keep(); cartAdd(el.dataset.cm, -1); cartSheet(); render(); });
    const clr = document.getElementById('coClear');
    if (clr) clr.onclick = () => {
      if (!confirm('Warenkorb leeren?')) return;
      Object.keys(cart).forEach(k => delete cart[k]); cartMeta.slot = ''; saveCart(); closeSheet(); render();
    };
    const go = document.getElementById('coGo');
    if (go) go.onclick = async () => {
      if (!online()) return;
      keep();
      const rec = { supplier_id: Auth.me.id, status: 'offen',
        place: cartMeta.place.trim().slice(0, 200), note: cartMeta.note.trim().slice(0, 1000) };
      if (frei.length) {
        const sl = byId(S.kalender, cartMeta.slot);
        if (!sl) return toast('Bitte oben eine Zeit antippen');
        rec.slot_id = sl.id; rec.needed_by = sl.day; rec.needed_time = slotText(sl);
      } else {
        rec.needed_by = cartMeta.date || null; rec.needed_time = cartMeta.time || null;
        if (rec.needed_by && urlaubAt(rec.needed_by) && !confirm('An dem Tag ist dein Chef im Urlaub. Trotzdem schicken?')) return;
      }
      go.disabled = true; go.textContent = 'Moment …';
      try {
        const rows = await SB.insert('orders', rec);
        const o = rows[0];
        const items = Object.entries(cart).filter(([pid]) => byId(S.katalog, pid))
          .map(([pid, qty]) => ({ order_id: o.id, product_id: pid, qty }));
        const made = await SB.insert('order_items', items);
        S.orders.unshift(o); S.items.push(...made);
        Object.keys(cart).forEach(k => delete cart[k]);
        Object.assign(cartMeta, { slot: '', note: '', date: '', time: '' });
        saveCart();
        Push.melden('order');
        await refreshKalender();
        closeSheet(); toast('Bestellung abgeschickt'); tab = 'mystock'; render();
      } catch (e) {
        go.disabled = false; go.textContent = 'An den Chef schicken';
        if (isSlotError(e)) { await refreshKalender(); cartMeta.slot = ''; saveCart(); cartSheet(); }
        fail(e);
      }
    };
  });
}

/* ----- Läufer ändert Zeit, Ort oder Notiz seiner offenen Bestellung ----- */
function orderEditSheet(o) {
  if (!o) return;
  const its = S.items.filter(i => i.order_id === o.id);
  const frei = freeSlots(o.id);
  let slot = o.slot_id && frei.some(x => x.id === o.slot_id) ? o.slot_id : '';
  const nochNichts = its.every(i => !+i.done_qty);
  const hm = /^\d{2}:\d{2}$/.test(o.needed_time || '') ? o.needed_time : '';
  openSheet('Bestellung ändern', `
    <div class="req-text" style="margin-top:0">${its.map(i => { const p = byId(S.katalog, i.product_id);
      return nf.format(i.qty) + ' × ' + esc(p ? p.name : 'Produkt'); }).join('<br>') || 'Keine Artikel'}</div>
    ${debtBox(runnerDebt(Auth.me.id), orderValue(o), true)}
    <div class="eyebrow">Wann?</div>
    ${o.needed_by ? `<p class="sub" style="margin-top:0">Bisher: ${esc(terminText(o))}</p>` : ''}
    ${frei.length ? slotPicker(frei, slot, o.id)
      : `<div class="field-2">
          <div class="field"><label>Datum</label><input id="oeDate" type="date" value="${esc(o.needed_by || '')}"></div>

    <div class="eyebrow">Wo?</div>

    document.getElementById('oeGo').onclick = async () => {

      if (frei.length) {
        const sl = byId(S.kalender, slot);

    if (del) del.onclick = async () => {

      if (!confirm('Bestellung wirklich zurückziehen?')) return;

        await SB.remove('orders', o.id);
        S.orders = S.orders.filter(x => x.id !== o.id);
        S.items = S.items.filter(i => i.order_id !== o.id);

    };

}

/* =========================================================
   KALENDER — für Chef und Läufer
   ========================================================= */
const kal = kind => S.kalender.filter(k => k.kind === kind);
const urlaubAt = d => kal('urlaub').find(u => d >= u.day && d <= (u.day_end || u.day));
const busyAt = d => {
  const w = wdOf(d);
  return kal('busy').filter(b => (b.weekdays || []).map(Number).includes(w)
    && (!b.day || d >= b.day) && (!b.day_end || d <= b.day_end))
    .sort((a, b) => String(a.t_from).localeCompare(String(b.t_from)));
};
const wareAt = d => kal('ware').filter(k => k.day === d);
const slotsAt = d => kal('slot').filter(x => x.day === d).sort((a, b) => a.t_from.localeCompare(b.t_from));
const slotText = x => x.t_from + '–' + x.t_to;
const slotPast = x => x.day < today() || (x.day === today() && x.t_from < nowHM());
const slotOrders = x => S.orders.filter(o => o.slot_id === x.id && o.status === 'offen' && o.kind !== 'wish');
function slotTaken(x, exceptId) {
  // Der Chef zählt selbst, der Läufer bekommt nur die Zahl vom Server
  let n = Auth.isAdmin() ? slotOrders(x).length : (+x.belegt || 0);
  if (exceptId && S.orders.some(o => o.id === exceptId && o.slot_id === x.id && o.status === 'offen')) n--;
  return Math.max(0, n);
}
const slotFree = (x, exceptId) => !slotPast(x) && !urlaubAt(x.day)
  && (+x.capacity === 0 || slotTaken(x, exceptId) < +x.capacity);
const freeSlots = exceptId => kal('slot').filter(x => slotFree(x, exceptId))
  .sort((a, b) => a.day.localeCompare(b.day) || a.t_from.localeCompare(b.t_from));
function wdText(arr) {
  const t = (arr || []).map(Number).sort((a, b) => a - b).join(',');
  if (t === '1,2,3,4,5,6,7') return 'jeden Tag';
  if (t === '1,2,3,4,5') return 'Mo–Fr';
  if (t === '6,7') return 'Sa + So';
  return (arr || []).map(Number).sort((a, b) => a - b).map(i => WD[i - 1]).join(', ');
}
const calSelFut = () => calSel && calSel >= today() ? calSel : today();

function evt(kind, ic, title, sub, id) {
  const tag = id ? 'button' : 'div';
  return `<${tag} class="evt" ${id ? `data-kev="${id}"` : ''}><span class="ic ic-${kind}">${ic}</span>
    <span style="min-width:0;flex:1"><div class="tt">${esc(title)}</div>${sub ? `<div class="ss">${esc(sub)}</div>` : ''}</span>
    ${id ? '<span class="dim" style="font-size:13px">›</span>' : ''}</${tag}>`;
}
function vCal() {
  if (!calMonth) calMonth = today().slice(0, 7);
  if (!calSel) calSel = today();
  const a = Auth.isAdmin();
  const [y, m] = calMonth.split('-').map(Number);
  const lead = (new Date(y, m - 1, 1).getDay() + 6) % 7, n = new Date(y, m, 0).getDate();
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<div class="calday blank"></div>';
  for (let d = 1; d <= n; d++) {
    const iso = `${calMonth}-${pad2(d)}`, off = urlaubAt(iso);
    const sl = slotsAt(iso), frei = sl.filter(x => slotFree(x)).length;
    const cls = ['calday', iso === today() ? 'today' : '', iso === calSel ? 'sel' : '', iso < today() ? 'past' : '', off ? 'off' : ''].join(' ');
    const marks = (frei ? '<i class="m-slot"></i>' : sl.length && !off && iso >= today() ? '<i class="m-full"></i>' : '')
      + (wareAt(iso).length ? '<i class="m-ware"></i>' : '');
    cells += `<button class="${cls}" data-day="${iso}">${d}<span class="marks">${marks}</span></button>`;
  }
  const jetzt = today().slice(0, 7);
  return `
    <div class="calhead"><button class="icon-btn" id="calPrev" aria-label="Monat davor">‹</button>
      <div class="t">${MONTHS[m - 1]} ${y}</div>
      <button class="icon-btn" id="calNext" aria-label="Monat danach">›</button></div>
    <div class="calgrid">${WD.map(w => `<div class="calwd">${w}</div>`).join('')}${cells}</div>
    <div class="callegend"><span><i class="m-slot"></i>${a ? 'Freie Zeiten' : 'Bestellen möglich'}</span>
      <span><i class="m-full"></i>Alles belegt</span><span><i class="m-ware"></i>Neue Ware</span><span><i class="m-off"></i>Urlaub</span></div>
    ${calMonth !== jetzt ? '<div class="btn-row"><button class="btn btn-ghost" id="calToday" style="padding:9px">Zu heute</button></div>' : ''}
    ${a ? `<div class="calbtns">
      <button class="btn" id="calSlot">+ Lieferzeiten</button>
      <button class="btn btn-ghost" id="calOff">+ Urlaub</button>
      <button class="btn btn-ghost" id="calWare">+ Neue Ware</button>
      <button class="btn btn-ghost" id="calBusy">+ Beschäftigt</button></div>` : ''}
    <div class="eyebrow">${esc(dayLong(calSel))}${calSel === today() ? ' · heute' : ''}</div>
    ${calDay(calSel)}
    ${calOverview()}`;
}
function calDay(d) {
  const a = Auth.isAdmin();
  const u = urlaubAt(d), sl = slotsAt(d);
  let h = '';
  if (u) h += evt('off', '✈', 'Urlaub' + (u.day_end && u.day_end !== u.day ? ` · ${deDate(u.day).slice(0, 6)}–${deDate(u.day_end).slice(0, 6)}` : ''),
    u.note || (a ? '' : 'Dein Chef ist nicht da — keine Übergaben.'), a ? u.id : '');
  wareAt(d).forEach(w => { h += evt('ware', '▤', 'Neue Ware kommt' + (w.t_from ? ' · ab ' + w.t_from : ''), w.note || '', a ? w.id : ''); });
  busyAt(d).forEach(b => { h += evt('busy', '◷', 'Beschäftigt ' + slotText(b), b.note || (a ? '' : 'Da ist dein Chef nicht erreichbar.'), a ? b.id : ''); });
  if (sl.length) {
    h += `<div class="card" style="padding:12px">
      <div class="row-sub" style="margin-bottom:9px">${a ? 'Deine Liefer- und Bestellzeiten' : 'Zeiten zum Bestellen'}</div>
      <div class="slots">${sl.map(x => {
        const t = slotTaken(x), frei = slotFree(x), cap = +x.capacity;
        let sub;
        if (a) {
          const wer = slotOrders(x).map(o => (byId(S.partners, o.supplier_id) || {}).name).filter(Boolean).join(', ');
          sub = wer ? esc(wer) : slotPast(x) ? 'vorbei' : cap ? `frei · 0/${cap}` : 'frei';
        } else sub = frei ? (cap === 0 || cap - t <= 1 ? 'frei' : `${cap - t} frei`) : slotPast(x) ? 'vorbei' : u ? 'Urlaub' : 'vergeben';
        if (x.place) sub += ' · ' + esc(x.place);
        const on = !a && cartMeta.slot === x.id;
        return `<button class="slot ${(!frei && !a) || (a && slotPast(x) && !t) ? 'full' : ''} ${on ? 'is-active' : ''}" data-slot="${x.id}">${slotText(x)}<small>${sub}</small></button>`;
      }).join('')}</div>
      ${a ? '' : '<p class="sub" style="margin-top:9px">Tippe eine freie Zeit an — sie wird für deine nächste Bestellung vorgemerkt.</p>'}</div>`;
  }
  if (!h) h = `<div class="empty">${a ? 'Nichts eingetragen. Unten kannst du Zeiten für diesen Tag anlegen.' : 'An diesem Tag ist nichts eingetragen.'}</div>`;
  if (a) h += `<div class="btn-row" style="margin-top:4px"><button class="btn btn-ghost" id="calDayAdd">+ Zeiten an diesem Tag</button>${
    sl.length ? '<button class="btn btn-danger" id="calDayDel">Zeiten löschen</button>' : ''}</div>`;
  return `<div class="stack">${h}</div>`;
}
function calOverview() {
  const a = Auth.isAdmin(), t = today();
  const offs = kal('urlaub').filter(u => (u.day_end || u.day) >= t).sort((x, y) => x.day.localeCompare(y.day)).slice(0, 4);
  const ware = kal('ware').filter(w => w.day >= t).sort((x, y) => x.day.localeCompare(y.day)).slice(0, 5);
  const busy = kal('busy').filter(b => !b.day_end || b.day_end >= t);
  const next = freeSlots()[0];
  if (!offs.length && !ware.length && !busy.length && !next) return '';
  return `<div class="eyebrow">Überblick</div><div class="stack">
    ${next ? evt('slot', '✓', 'Nächste freie Zeit: ' + dayLabel(next.day) + ' · ' + slotText(next), next.place || '', '') : ''}
    ${offs.map(u => evt('off', '✈', `Urlaub ${deDate(u.day).slice(0, 6)}${u.day_end && u.day_end !== u.day ? '–' + deDate(u.day_end).slice(0, 6) : ''}`, u.note || '', a ? u.id : '')).join('')}
    ${ware.map(w => evt('ware', '▤', `Neue Ware · ${dayLabel(w.day)}${w.t_from ? ' ab ' + w.t_from : ''}`, w.note || '', a ? w.id : '')).join('')}
    ${busy.map(b => evt('busy', '◷', `Beschäftigt ${slotText(b)} · ${wdText(b.weekdays)}`,
      [b.note, b.day ? 'ab ' + deDate(b.day) : '', b.day_end ? 'bis ' + deDate(b.day_end) : ''].filter(Boolean).join(' · '), a ? b.id : '')).join('')}
  </div>`;
}
function wCal() {
  const mv = k => { const [y, m] = calMonth.split('-').map(Number); calMonth = isoD(new Date(y, m - 1 + k, 1)).slice(0, 7); render(); };
  document.getElementById('calPrev').onclick = () => mv(-1);
  document.getElementById('calNext').onclick = () => mv(1);
  const ct = document.getElementById('calToday');
  if (ct) ct.onclick = () => { calMonth = today().slice(0, 7); calSel = today(); render(); };
  document.querySelectorAll('[data-day]').forEach(el => el.onclick = () => { calSel = el.dataset.day; render(); });
  document.querySelectorAll('[data-kev]').forEach(el => el.onclick = () => {
    const k = byId(S.kalender, el.dataset.kev); if (k) calEntrySheet(k.kind, k);
  });
  document.querySelectorAll('[data-slot]').forEach(el => el.onclick = () => {
    const x = byId(S.kalender, el.dataset.slot); if (!x) return;
    if (Auth.isAdmin()) return slotSheet(x);
    if (!slotFree(x) && cartMeta.slot !== x.id) return toast('Diese Zeit ist nicht frei');
    cartMeta.slot = cartMeta.slot === x.id ? '' : x.id; saveCart();
    toast(cartMeta.slot ? 'Vorgemerkt: ' + dayLabel(x.day) + ' · ' + slotText(x) : 'Zeit abgewählt');
    render();
  });
  if (!Auth.isAdmin()) return;
  document.getElementById('calSlot').onclick = () => slotBulkSheet(calSelFut(), '');
  document.getElementById('calOff').onclick = () => calEntrySheet('urlaub', null);
  document.getElementById('calWare').onclick = () => calEntrySheet('ware', null);
  document.getElementById('calBusy').onclick = () => calEntrySheet('busy', null);
  const add = document.getElementById('calDayAdd');
  if (add) add.onclick = () => {
    if (calSel < today()) return toast('Der Tag ist schon vorbei');
    slotBulkSheet(calSel, calSel);
  };
  const del = document.getElementById('calDayDel');
  if (del) del.onclick = async () => {
    if (!online()) return;
    const sl = slotsAt(calSel), gebucht = sl.filter(x => slotOrders(x).length).length;
    if (!confirm(`${sl.length} Zeit(en) am ${deDate(calSel)} löschen?` + (gebucht
      ? `\n\n${gebucht} davon sind gebucht. Die Bestellungen bleiben, haben dann aber keine feste Zeit mehr.` : ''))) return;
    await deleteSlots(sl.map(x => x.id));
  };
}
async function deleteSlots(ids) {
  ids = ids.filter(x => UUID.test(x));
  try {
    for (let i = 0; i < ids.length; i += 100) {
      await SB.rest(`kalender?id=in.(${ids.slice(i, i + 100).join(',')})`, { method: 'DELETE' });
    }
    S.kalender = S.kalender.filter(k => !ids.includes(k.id));
    S.orders.forEach(o => { if (ids.includes(o.slot_id)) o.slot_id = null; });
    closeSheet(); toast(ids.length + ' Zeit(en) gelöscht'); render();
  } catch (e) { fail(e); }
}

/* ----- Viele Lieferzeiten auf einmal anlegen ----- */
function slotBulkSheet(from, to) {
  const single = !!to && from === to;
  from = from || today(); to = to || addDays(from, 27);
  const wds = new Set(single ? [wdOf(from)] : [1, 2, 3, 4, 5, 6, 7]);
  openSheet(single ? 'Zeiten am ' + dayLabel(from) : 'Lieferzeiten eintragen', `
    <p class="sub" style="margin-top:0">Nur in diesen Zeiten können Läufer bestellen und Ware abholen.</p>
    <div class="field-2"><div class="field"><label>Von Tag</label><input id="sbFrom" type="date" value="${from}"></div>
      <div class="field"><label>Bis Tag</label><input id="sbTo" type="date" value="${to}"></div></div>
    <div class="field"><label>An diesen Wochentagen</label>
      <div class="wdpick" id="sbWd">${WD.map((w, i) => `<button data-wd="${i + 1}" class="${wds.has(i + 1) ? 'is-active' : ''}">${w}</button>`).join('')}</div></div>
    <div class="field-2"><div class="field"><label>Von Uhrzeit</label><input id="sbT1" type="time" value="16:00"></div>
      <div class="field"><label>Bis Uhrzeit</label><input id="sbT2" type="time" value="19:00"></div></div>
    <div class="field-2">
      <div class="field"><label>Aufteilen in</label><select id="sbStep">
        <option value="0">Ein Block</option><option value="15">15 Min</option><option value="30" selected>30 Min</option>
        <option value="45">45 Min</option><option value="60">1 Std</option><option value="90">1,5 Std</option><option value="120">2 Std</option></select></div>
      <div class="field"><label>Läufer pro Zeit</label><input id="sbCap" type="number" inputmode="numeric" min="0" max="50" step="1" value="1"></div></div>
    <div class="field"><label>Ort (optional)</label><input id="sbPlace" maxlength="200" placeholder="z. B. bei mir, Parkplatz Rewe"></div>
    <p class="sub">„Läufer pro Zeit" 0 = beliebig viele. Urlaubstage, vergangene und schon vorhandene Zeiten werden übersprungen.</p>
    <div class="card" style="margin-top:10px"><div class="row-title" id="sbCount">…</div><div class="row-sub" id="sbEx" style="white-space:normal"></div></div>
    <div class="btn-row"><button class="btn" id="sbGo">Anlegen</button></div>
  `, () => {
    const toMin = t => +t.slice(0, 2) * 60 + +t.slice(3, 5), toHM = x => pad2(Math.floor(x / 60)) + ':' + pad2(x % 60);
    const gen = () => {
      const f = gv('sbFrom'), t = gv('sbTo'), t1 = gv('sbT1'), t2 = gv('sbT2'), step = +gv('sbStep');
      if (!f || !t || t < f) return { rows: [], err: 'Tage prüfen: „Bis" muss nach „Von" liegen' };
      if (!/^\d{2}:\d{2}$/.test(t1) || !/^\d{2}:\d{2}$/.test(t2) || t2 <= t1) return { rows: [], err: 'Uhrzeit prüfen: „Bis" muss nach „Von" liegen' };
      if ((parseD(t) - parseD(f)) / 864e5 > 366) return { rows: [], err: 'Höchstens ein Jahr auf einmal' };
      if (!wds.size) return { rows: [], err: 'Mindestens einen Wochentag wählen' };
      const parts = [];
      if (!step) parts.push([t1, t2]);
      else for (let x = toMin(t1); x + step <= toMin(t2); x += step) parts.push([toHM(x), toHM(x + step)]);
      if (!parts.length) return { rows: [], err: 'Zeitraum ist kürzer als ein Schritt' };
      const have = new Set(kal('slot').map(x => x.day + ' ' + x.t_from));
      const cap = intIn('sbCap', 0, 50), place = gv('sbPlace').trim().slice(0, 200) || null;
      const rows = [];
      for (let d = f < today() ? today() : f; d <= t; d = addDays(d, 1)) {
        if (!wds.has(wdOf(d)) || urlaubAt(d)) continue;
        for (const [x, y] of parts) {
          if (d === today() && x <= nowHM()) continue;
          if (have.has(d + ' ' + x)) continue;
          rows.push({ kind: 'slot', day: d, t_from: x, t_to: y, capacity: cap, place });
        }
      }
      return { rows, parts };
    };
    const upd = () => {
      const g = gen();
      document.getElementById('sbCount').textContent = g.err || (g.rows.length ? `Ergibt ${g.rows.length} Zeit(en)` : 'Ergibt keine neuen Zeiten');
      document.getElementById('sbEx').textContent = g.parts ? 'Pro Tag: ' + g.parts.slice(0, 6).map(p => p.join('–')).join(', ') + (g.parts.length > 6 ? ' …' : '') : '';
    };
    ['sbFrom', 'sbTo', 'sbT1', 'sbT2', 'sbStep', 'sbCap', 'sbPlace'].forEach(id => {
      const el = document.getElementById(id); el.oninput = upd; el.onchange = upd;
    });
    document.querySelectorAll('#sbWd [data-wd]').forEach(el => el.onclick = () => {
      const w = +el.dataset.wd; if (wds.has(w)) wds.delete(w); else wds.add(w);
      el.classList.toggle('is-active', wds.has(w)); upd();
    });
    upd();
    document.getElementById('sbGo').onclick = async () => {
      if (!online()) return;
      const g = gen();
      if (g.err) return toast(g.err);
      if (!g.rows.length) return toast('Keine neuen Zeiten');
      if (g.rows.length > 1500) return toast('Zu viele auf einmal — höchstens 1500');
      const btn = document.getElementById('sbGo'); btn.disabled = true; btn.textContent = 'Moment …';
      try {
        for (let i = 0; i < g.rows.length; i += 250) {
          const made = await SB.insert('kalender', g.rows.slice(i, i + 250));
          S.kalender.push(...made.map(k => Object.assign(k, { belegt: 0 })));
        }
        calSel = g.rows[0].day; calMonth = calSel.slice(0, 7);
        closeSheet(); toast(g.rows.length + ' Zeit(en) angelegt'); render();
      } catch (e) { btn.disabled = false; btn.textContent = 'Anlegen'; fail(e); }
    };
  });
}

    <div class="field"><label>Was kommt?</label><textarea id="ceNote" rows="3" maxlength="500" placeholder="z. B. 20 Paar Nike Air Force, Größen 40–45">${esc(k.note || '')}</textarea></div>`;
  else body = `
    <p class="sub" style="margin-top:0">Wiederkehrend, z. B. Schule oder Arbeit. Die Läufer sehen, wann du nicht kannst.</p>
    <div class="field"><label>An diesen Tagen</label>
      <div class="wdpick" id="ceWd">${WD.map((w, i) => `<button data-wd="${i + 1}" class="${wds.has(i + 1) ? 'is-active' : ''}">${w}</button>`).join('')}</div></div>
    <div class="field-2"><div class="field"><label>Von</label><input id="ceT1" type="time" value="${esc(k.t_from || '08:00')}"></div>
      <div class="field"><label>Bis</label><input id="ceT2" type="time" value="${esc(k.t_to || '15:00')}"></div></div>
    <div class="field-2"><div class="field"><label>Gilt ab (optional)</label><input id="ceFrom" type="date" value="${esc(k.day || '')}"></div>
      <div class="field"><label>Gilt bis (optional)</label><input id="ceTo" type="date" value="${esc(k.day_end || '')}"></div></div>
    <div class="field"><label>Notiz (optional)</label><input id="ceNote" maxlength="500" value="${esc(k.note || '')}" placeholder="z. B. Schule"></div>`;
  openSheet(T, body + `<div class="btn-row"><button class="btn" id="ceGo">${neu ? 'Eintragen' : 'Speichern'}</button></div>
    ${neu ? '' : '<div class="btn-row"><button class="btn btn-danger" id="ceDel">Löschen</button></div>'}`, () => {
    document.querySelectorAll('#ceWd [data-wd]').forEach(el => el.onclick = () => {
      const w = +el.dataset.wd; if (wds.has(w)) wds.delete(w); else wds.add(w);
      el.classList.toggle('is-active', wds.has(w));
    });
    document.getElementById('ceGo').onclick = async () => {
      if (!online()) return;
      const rec = { kind, note: gv('ceNote').trim().slice(0, 500) || null };
      if (kind === 'urlaub') {
        rec.day = gv('ceFrom'); rec.day_end = gv('ceTo') || rec.day;
        if (!rec.day) return toast('Tag fehlt');
        if (rec.day_end < rec.day) return toast('„Bis" muss nach „Von" liegen');
      } else if (kind === 'ware') {
        rec.day = gv('ceFrom'); rec.t_from = gv('ceT1') || null;
        if (!rec.day) return toast('Tag fehlt');
      } else {
        rec.weekdays = [...wds].sort((a, b) => a - b); rec.t_from = gv('ceT1'); rec.t_to = gv('ceT2');
        rec.day = gv('ceFrom') || null; rec.day_end = gv('ceTo') || null;
        if (!rec.weekdays.length) return toast('Mindestens einen Tag wählen');
        if (!rec.t_from || !rec.t_to || rec.t_to <= rec.t_from) return toast('Uhrzeit prüfen');
        if (rec.day && rec.day_end && rec.day_end < rec.day) return toast('„Gilt bis" muss nach „Gilt ab" liegen');
      }
      try {
        const rows = neu ? await SB.insert('kalender', rec) : await SB.update('kalender', k.id, rec);
        const row = Object.assign(rows[0], { belegt: 0 });
        S.kalender = S.kalender.filter(x => x.id !== row.id).concat([row]);
        let msg = neu ? 'Eingetragen' : 'Gespeichert';
        const kill = document.getElementById('ceKill');
        if (kind === 'urlaub' && kill && kill.checked) {
          const weg = kal('slot').filter(x => x.day >= rec.day && x.day <= rec.day_end && !slotOrders(x).length).map(x => x.id);
          const bleibt = kal('slot').filter(x => x.day >= rec.day && x.day <= rec.day_end && slotOrders(x).length).length;
          if (weg.length) {
            for (let i = 0; i < weg.length; i += 100)
              await SB.rest(`kalender?id=in.(${weg.slice(i, i + 100).join(',')})`, { method: 'DELETE' });
            S.kalender = S.kalender.filter(x => !weg.includes(x.id));
            msg += ` · ${weg.length} Zeit(en) gelöscht`;
          }
          if (bleibt) msg += ` · ${bleibt} gebuchte behalten`;
        }
        if (rec.day) { calSel = rec.day; calMonth = rec.day.slice(0, 7); }
        closeSheet(); toast(msg); render();
      } catch (e) { fail(e); }
    };
    const del = document.getElementById('ceDel');
    if (del) del.onclick = async () => {
      if (!online()) return;
      if (!confirm(T + ' löschen?')) return;
      try {
        await SB.remove('kalender', k.id);
        S.kalender = S.kalender.filter(x => x.id !== k.id);
        closeSheet(); toast('Gelöscht'); render();
      } catch (e) { fail(e); }
    };
  });
}

function pollNewSheet() {
  const arten = [...new Set(S.products.map(p => (p.category || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'de'));
  let quelle = 'products';
  openSheet('Neue Umfrage', `
    <div class="field"><label>Frage</label><input id="uTitle" maxlength="120" placeholder="z. B. Welche Schuhe soll ich nachbestellen?"></div>
    <div class="field"><label>Erklärung (optional)</label><textarea id="uNote" rows="2" maxlength="1000"></textarea></div>
    <div class="field-2">
      <div class="field"><label>Deadline Tag</label><input id="uDay" type="date" value="${addDays(today(), 3)}"></div>
      <div class="field"><label>Uhrzeit</label><input id="uTime" type="time" value="20:00"></div></div>
    <div class="eyebrow">Antworten</div>
    <div class="seg" id="uSrc"><button data-q="products" class="is-active">Produkte aus dem Lager</button><button data-q="custom">Eigene Antworten</button></div>
    <div id="uProd">
      <div class="field-2">
        <div class="field"><label>Welche Produkte</label><select id="uWhich">
          <option value="all">Alle</option><option value="out">Nur ausverkaufte</option><option value="in">Nur vorrätige</option></select></div>

        <option value="category">Art</option><option value="brand">Marke</option><option value="none">Gar nicht</option></select></div>
    </div>
    <div id="uCustom" hidden>
      <div class="field"><label>Eine Antwort pro Zeile</label><textarea id="uOpts" rows="5" maxlength="6000" placeholder="Samstag&#10;Sonntag&#10;Egal"></textarea></div>
    </div>
    <div class="field-2">
      <div class="field" id="uMaxGF"><label id="uMaxGL">Max. pro Art</label><input id="uMaxG" type="number" inputmode="numeric" min="0" max="500" step="1" value="15"></div>
      <div class="field"><label>Max. insgesamt</label><input id="uMaxT" type="number" inputmode="numeric" min="0" max="500" step="1" value="0"></div></div>

    <div class="card" style="margin-top:10px"><div class="row-title" id="uCount">…</div></div>
    <div class="btn-row"><button class="btn" id="uGo">Umfrage starten</button></div>
  `, () => {
    const build = () => {
      if (quelle === 'custom') {
        const lines = [...new Set(gv('uOpts').split('\n').map(x => x.trim()).filter(Boolean))].slice(0, 100);
        return lines.map((l, i) => ({ id: 'c' + (i + 1), label: l.slice(0, 120), group: 'Antworten' }));
      }
      const which = gv('uWhich'), cat = gv('uCat'), gb = gv('uGroup');
      let ps = S.products.slice();
      if (cat) ps = ps.filter(p => (p.category || '').trim() === cat);
      if (which === 'out') ps = ps.filter(p => stockOf(p.id) <= 0);
      if (which === 'in') ps = ps.filter(p => stockOf(p.id) > 0);
      sortProducts(ps, p => stockOf(p.id));
      return ps.slice(0, 500).map(p => ({ id: p.id, pid: p.id, label: String(p.name).slice(0, 120),
        group: gb === 'brand' ? ((p.brand || '').trim() || 'Ohne Marke') : gb === 'category' ? ((p.category || '').trim() || 'Ohne Art') : 'Alle' }));
    };
    const gbNow = () => quelle === 'custom' ? 'none' : gv('uGroup');
    const upd = () => {
      const o = build(), gb = gbNow();
      document.getElementById('uProd').hidden = quelle === 'custom';
      document.getElementById('uCustom').hidden = quelle !== 'custom';
      document.getElementById('uMaxGF').hidden = gb === 'none';
      document.getElementById('uMaxGL').textContent = gb === 'brand' ? 'Max. pro Marke' : 'Max. pro Art';
      const groups = new Set(o.map(x => x.group)).size;
      document.getElementById('uCount').textContent = o.length
        ? `${o.length} Antwortmöglichkeit(en)${gb !== 'none' && groups > 1 ? ' in ' + groups + ' Gruppen' : ''}` : 'Noch keine Antworten';
    };
    document.getElementById('uSrc').onclick = e => {
      const b = e.target.closest('[data-q]'); if (!b) return;
      quelle = b.dataset.q;
      document.querySelectorAll('#uSrc [data-q]').forEach(x => x.classList.toggle('is-active', x === b));
      upd();
    };
    ['uWhich', 'uCat', 'uGroup', 'uOpts'].forEach(id => { const el = document.getElementById(id); el.oninput = upd; el.onchange = upd; });
    upd();
    document.getElementById('uGo').onclick = async () => {
      if (!online()) return;
      const title = gv('uTitle').trim().slice(0, 120);
      if (!title) return toast('Frage fehlt');
      const dl = new Date(gv('uDay') + 'T' + (gv('uTime') || '20:00'));
      if (isNaN(dl) || dl <= new Date()) return toast('Die Deadline muss in der Zukunft liegen');
      const options = build();
      if (!options.length) return toast(quelle === 'custom' ? 'Mindestens eine Antwort eintragen' : 'Keine passenden Produkte');
      const gb = gbNow();
      try {
        const rows = await SB.insert('umfragen', {
          title, note: gv('uNote').trim().slice(0, 1000) || null, deadline: dl.toISOString(), options,
          group_by: gb, max_per_group: gb === 'none' ? 0 : intIn('uMaxG', 0, 500), max_total: intIn('uMaxT', 0, 500) });
        S.umfragen.unshift(rows[0]);
        closeSheet(); toast('Umfrage läuft — die Läufer sehen sie jetzt'); render();
      } catch (e) { fail(e); }
    };
  });
}

function pollVoteSheet(u) {
  if (!u) return;
  const mine = myAnswer(u);
  const sel = new Set((mine && mine.choices) || []);
  const auf = pollOpen(u), groups = pollGroups(u);
  const gname = u.group_by === 'brand' ? 'Marke' : 'Art';
  const optById = {}; (u.options || []).forEach(o => { optById[o.id] = o; });
  const thumb = o => {
    if (!o.pid) return '';
    const p = byId(S.katalog, o.pid);
    return p && p.photo ? `<img class="thumb" src="${p.photo}" alt="">` : '<div class="thumb">▤</div>';
  };
  openSheet(u.title, `
    ${u.note ? `<p class="sub" style="margin-top:0">${esc(u.note)}</p>` : ''}
    <p class="sub" ${u.note ? '' : 'style="margin-top:0"'}>${auf ? 'Bis ' + deDateTime(u.deadline) + ' (' + pollLeft(u) + ')' : 'Die Umfrage ist beendet.'} · ${esc(limitText(u))}</p>
    ${groups.map(([g, os]) => `<div class="pgrp"><b>${groups.length > 1 ? esc(g) : 'Auswahl'}</b><span data-gc="${esc(g)}"></span></div>
      ${os.map(o => `<button class="popt ${sel.has(o.id) ? 'on' : ''}" data-opt="${esc(o.id)}" ${auf ? '' : 'disabled'}>
        ${thumb(o)}<span class="pl">${esc(o.label)}</span><span class="ck">✓</span></button>`).join('')}`).join('')}
    ${auf ? `<div class="stickybar"><button class="btn" id="pvSave">Abstimmen · <span id="pvN">${sel.size}</span> gewählt</button></div>` : ''}
  `, () => {
    const cntG = g => [...sel].filter(id => optById[id] && (optById[id].group || 'Alle') === g).length;
    const upd = () => {
      document.querySelectorAll('[data-gc]').forEach(el => {
        const n = cntG(el.dataset.gc);
        el.textContent = u.max_per_group > 0 ? `${n} / ${u.max_per_group}` : n ? n + ' gewählt' : '';
        el.classList.toggle('full', u.max_per_group > 0 && n >= u.max_per_group);
      });
      const n = document.getElementById('pvN'); if (n) n.textContent = sel.size;
    };
    upd();
    document.querySelectorAll('[data-opt]').forEach(el => el.onclick = () => {
      const id = el.dataset.opt, o = optById[id]; if (!o) return;
      if (sel.has(id)) sel.delete(id);
      else {
        if (u.max_per_group > 0 && cntG(o.group || 'Alle') >= u.max_per_group) return toast(`Maximal ${u.max_per_group} pro ${gname}`);
        if (u.max_total > 0 && sel.size >= u.max_total) return toast(`Maximal ${u.max_total} insgesamt`);
        sel.add(id);
      }
      el.classList.toggle('on', sel.has(id)); upd();
    });
    const sv = document.getElementById('pvSave');
    if (sv) sv.onclick = async () => {
      if (!online()) return;
      const choices = [...sel].filter(id => optById[id]);
      if (!choices.length && !mine) return toast('Wähl erst etwas aus');
      sv.disabled = true;
      try {
        await SB.rpc('umfrage_abstimmen', { p_umfrage: u.id, p_choices: choices });
        S.antworten = S.antworten.filter(a => !(a.umfrage_id === u.id && a.runner_id === Auth.me.id));
        if (choices.length) S.antworten.push({ umfrage_id: u.id, runner_id: Auth.me.id, choices, updated_at: new Date().toISOString() });
        closeSheet(); toast(choices.length ? 'Abgestimmt — danke!' : 'Stimme zurückgezogen'); render();
      } catch (e) { sv.disabled = false; fail(e); }
    };
  });
}

// Excel/Numbers führen Zellen aus, die mit = + - @ beginnen — das entschärfen wir.
function csvSafe(v) {
  let t = String(v == null ? '' : v).replace(/;/g, ',').replace(/[\r\n]+/g, ' ');
  if (/^[=+\-@\t]/.test(t)) t = "'" + t;
  return t;
}
function download(name, text, mime) {
  const b = new Blob([text], { type: mime });
  const u = URL.createObjectURL(b), el = document.createElement('a');
  el.href = u; el.download = name;
  document.body.appendChild(el); el.click();
  setTimeout(() => { URL.revokeObjectURL(u); el.remove(); }, 800);
}

      } catch (e) {
        Push.letzterFehler = e.message || String(e);
        toast('Fehler: ' + Push.letzterFehler);
      }
      menuSheet();
    };
    document.getElementById('reload').onclick = async () => {
      try { await loadData(); closeSheet(); toast('Aktualisiert'); render(); } catch (e) { fail(e); }
    };
    const c = document.getElementById('csv');
    if (c) c.onclick = () => {
      const head = 'Datum;Art;Produkt;Marke;Menge;Preis;Summe;Einkauf;Gewinn;Laeufer\n';
      const body = S.movements.slice().sort((x, y) => String(x.date).localeCompare(String(y.date))).map(m => {
        const p = byId(S.products, m.product_id) || {}, r = byId(S.partners, m.partner_id) || {};
        return [String(m.date).slice(0, 10), m.type, p.name || '', p.brand || '', m.qty,
          f2(m.unit_price), f2(m.unit_price * m.qty), f2(m.cost_price), f2(soldProfit(m)), r.name || '']
          .map(csvSafe).join(';');
      }).join('\n');
      download('lager-' + today() + '.csv', '\uFEFF' + head + body, 'text/csv');
    };
    const bk = document.getElementById('backup');
    if (bk) bk.onclick = () => {
      const data = { app: 'lager', version: 3, exported: new Date().toISOString(),
        products: S.products, movements: S.movements, partners: S.partners,
        payments: S.payments, orders: S.orders, order_items: S.items, messages: S.messages,
        kalender: S.kalender, umfragen: S.umfragen, umfrage_antworten: S.antworten };
      download('lager-sicherung-' + today() + '.json', JSON.stringify(data, null, 1), 'application/json');
      toast('Sicherung erstellt');
    };
    document.getElementById('logout').onclick = async () => {
      await Push.abmelden(); await SB.logout(); Auth.clear(); closeSheet(); location.reload();
    };
  });
}

/* =========================================================
   START
   ========================================================= */
const elBoot = document.getElementById('boot'), elAuth = document.getElementById('auth'), elApp = document.getElementById('app');
let authMode = 'login';
function showAuth(m) { elBoot.hidden = true; elApp.hidden = true; elAuth.hidden = false; if (m) authError(m); }
function authError(m) {
  const e = document.getElementById('auErr');
  if (!m) { e.hidden = true; return; }
  e.textContent = m; e.hidden = false;
}
document.getElementById('authSeg').onclick = e => {
  const b = e.target.closest('[data-m]'); if (!b) return;
  authMode = b.dataset.m;
  document.querySelectorAll('#authSeg button').forEach(x => x.classList.toggle('is-active', x.dataset.m === authMode));
  document.getElementById('signupOnly').hidden = authMode !== 'signup';
  document.getElementById('auGo').textContent = authMode === 'signup' ? 'Konto anlegen' : 'Anmelden';
  authError(null);
};
document.getElementById('auGo').onclick = async () => {
  const btn = document.getElementById('auGo');
  const email = document.getElementById('auEmail').value, pw = document.getElementById('auPass').value;
  if (!email || !pw) return authError('E-Mail und Passwort eingeben');
  btn.disabled = true; btn.textContent = 'Moment…'; authError(null);
  try {
    if (authMode === 'signup') {
      const n = document.getElementById('auName').value, c = document.getElementById('auCode').value;
      if (!n.trim()) throw new Error('Name eingeben');
      if (!c.trim()) throw new Error('Code eingeben');
      await Auth.signup(email, pw, n, c);
    } else await Auth.login(email, pw);
    await startApp();
  } catch (e) {
    let m = e.message || 'Fehler';
    if (/Invalid login/i.test(m)) m = 'E-Mail oder Passwort stimmt nicht';
    else if (/Database error saving new user|Ungueltiger|unexpected_failure/i.test(m)) m = 'Code stimmt nicht — oder das SQL-Skript fehlt';
    else if (/already registered/i.test(m)) m = 'Diese E-Mail hat schon ein Konto';
    else if (/Email not confirmed/i.test(m)) m = 'In Supabase unter Authentication → Email den Schalter „Confirm email" ausschalten';
    else if (/Password should be/i.test(m)) m = 'Passwort zu kurz, mindestens 6 Zeichen';
    else if (/Failed to fetch|Load failed/i.test(m)) m = 'Keine Verbindung. Stimmen URL und Schlüssel in config.js?';
    authError(m);
  } finally {
    btn.disabled = false; btn.textContent = authMode === 'signup' ? 'Konto anlegen' : 'Anmelden';
  }
};
function showWaiting() {
  elBoot.hidden = true; elApp.hidden = true; elAuth.hidden = true;
  document.getElementById('waiting').hidden = false;
}
document.getElementById('waitRetry').onclick = async () => {
  try { await Auth.loadProfile(); await startApp(); } catch (e) { fail(e); }
};
document.getElementById('waitLogout').onclick = async () => {
  await Push.abmelden(); await SB.logout(); Auth.clear(); location.reload();
};

async function startApp() {
  elAuth.hidden = true; elBoot.hidden = false;
  document.getElementById('waiting').hidden = true;
  // Ein Läufer ohne Freigabe kommt nicht weiter.
  if (!Auth.isAdmin() && Auth.me.active === false) return showWaiting();
  buildTabs();
  try { await loadData(); }
  catch (e) { elBoot.hidden = true; return showAuth('Daten konnten nicht geladen werden: ' + (e.message || '')); }
  if (!Auth.isAdmin()) {
    loadCart();
    // Produkte, die es nicht mehr gibt, fliegen raus — aber nur mit frischen Daten
    if (!offlineSince) { Object.keys(cart).forEach(k => { if (!byId(S.katalog, k)) delete cart[k]; }); saveCart(); }
  }
  elBoot.hidden = true; elApp.hidden = false; render();
  Push.auffrischen();
}
document.getElementById('tabbar').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  tab = b.dataset.tab; if (tab === 'chat') chatWith = null;
  window.scrollTo(0, 0); render();
});
document.getElementById('search').addEventListener('input', e => { query[tab] = e.target.value; render(); });
document.getElementById('menuBtn').addEventListener('click', menuSheet);
document.getElementById('cartBtn').addEventListener('click', cartSheet);

(async function boot() {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
  if (!SB.configured()) {
    elBoot.hidden = true;
    document.body.innerHTML = '<div style="padding:60px 24px;max-width:460px;margin:0 auto;font-family:-apple-system,sans-serif;color:#EAEEF3">'
      + '<h1 style="font-size:22px">Noch nicht eingerichtet</h1>'
      + '<p style="color:#8B95A3;line-height:1.55">Trag in <b>config.js</b> deine Supabase-Adresse und den Schlüssel ein.</p></div>';
    return;
  }
  await Cache.open();
  if (Auth.load()) {
    try { await Auth.loadProfile(); return startApp(); }
    catch (e) {
      if (await Auth.tryRefresh()) { try { await Auth.loadProfile(); return startApp(); } catch (e2) { } }
      Auth.clear();
    }
  }
  showAuth(null);
})();

</script>

<style>
:root{
  --bg:#0E1013;
  --surface:#161A20;
  --surface2:#1D222A;
  --line:#2A313C;
  --ink:#EAEEF3;
  --muted:#8B95A3;
  --signal:#FF5A1F;
  --pos:#37C98A;
  --neg:#FF5B5B;
  --paper:#F1ECE2;
  --paper-ink:#171412;
  --paper-line:#C9C0B1;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.4;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.02em}
a{color:var(--signal)}

/* ---------- Topbar ---------- */
#topbar{
  position:sticky;top:0;z-index:40;
  padding:calc(var(--safe-top) + 10px) 16px 10px;
  background:rgba(14,16,19,.86);
  backdrop-filter:saturate(160%) blur(14px);
  -webkit-backdrop-filter:saturate(160%) blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
#viewTitle{font-size:26px}
.icon-btn{
  width:36px;height:36px;border-radius:10px;color:var(--muted);
  display:grid;place-items:center;font-size:15px;background:var(--surface2);
}
.icon-btn:active{background:var(--line)}
.searchwrap{margin-top:10px}
#search{
  width:100%;background:var(--surface2);border:1px solid var(--line);
  border-radius:11px;padding:9px 12px;font-size:15px;
  -webkit-appearance:none;appearance:none;
}
#search::placeholder{color:var(--muted)}
#search:focus{outline:2px solid var(--signal);outline-offset:-1px}

/* ---------- Layout ---------- */
#main{padding:14px 16px calc(96px + var(--safe-bottom))}
.view{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin:22px 0 8px;
}
.eyebrow:first-child{margin-top:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:8px}

.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pos{color:var(--pos)}
.neg{color:var(--neg)}
.dim{color:var(--muted)}

.btn{
  background:var(--signal);color:#12100E;font-weight:680;
  border-radius:12px;padding:13px 16px;width:100%;text-align:center;
  letter-spacing:-.01em;
}
.btn:active{filter:brightness(.9)}
.btn-ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line);font-weight:560}
.btn-danger{background:transparent;color:var(--neg);border:1px solid var(--neg)}
.btn-row{display:flex;gap:8px;margin-top:12px}

.empty{
  border:1px dashed var(--line);border-radius:var(--r);padding:26px 18px;
  text-align:center;color:var(--muted);font-size:14px;
}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px;font-weight:600}

/* ---------- Kennzahlen ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px}
.kpi .lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:var(--mono)}
.kpi .val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:20px;margin-top:5px;letter-spacing:-.03em}
.kpi.wide{grid-column:1/-1}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;background:var(--surface2);border:1px solid var(--line);
  border-radius:999px;padding:7px 13px;font-size:13.5px;color:var(--muted);
}
.chip.is-active{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}

/* ---------- Produktliste ---------- */
.row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;
}
.row:active{background:var(--surface2)}
.thumb{
  width:46px;height:46px;border-radius:10px;flex:0 0 auto;object-fit:cover;
  background:var(--surface2);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--muted);font-size:16px;
}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-end{text-align:right;flex:0 0 auto}
.row-end .big{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:16px}
.row-end .small{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.low{color:var(--neg)!important}
.badge{
  display:inline-block;font-size:10.5px;font-family:var(--mono);letter-spacing:.08em;
  text-transform:uppercase;padding:2px 6px;border-radius:5px;
  background:var(--surface2);border:1px solid var(--line);color:var(--muted);
}
.badge.warn{color:var(--signal);border-color:rgba(255,90,31,.4)}

/* ---------- Rang-Liste ---------- */
.rank{display:flex;align-items:center;gap:12px;padding:11px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.rank-no{
  font-family:var(--mono);font-size:13px;width:26px;flex:0 0 auto;text-align:center;
  color:var(--muted);border-right:1px solid var(--line);padding-right:8px;
}
.rank:nth-child(1) .rank-no{color:var(--signal);font-weight:700}

/* ---------- Beleg (Erfassung) ---------- */
.receipt{
  background:var(--paper);color:var(--paper-ink);
  border-radius:12px 12px 0 0;padding:18px 18px 10px;
  font-family:var(--mono);position:relative;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}
.receipt-foot{
  height:11px;background:var(--paper);
  clip-path:polygon(0 0,100% 0,100% 0,96% 100%,92% 0,88% 100%,84% 0,80% 100%,76% 0,72% 100%,68% 0,64% 100%,60% 0,56% 100%,52% 0,48% 100%,44% 0,40% 100%,36% 0,32% 100%,28% 0,24% 100%,20% 0,16% 100%,12% 0,8% 100%,4% 0,0 100%);
}
.receipt-head{text-align:center;border-bottom:1px dashed var(--paper-line);padding-bottom:10px;margin-bottom:6px}
.receipt-head .t{font-size:13px;letter-spacing:.22em;text-transform:uppercase;font-weight:700}
.receipt-head .d{font-size:11px;color:#6C645A;margin-top:2px;letter-spacing:.06em}
.rline{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dotted var(--paper-line)}
.rline label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#6C645A;flex:0 0 82px}
.rline input,.rline select{
  flex:1;min-width:0;background:transparent;border:0;color:var(--paper-ink);
  font-family:var(--mono);font-size:15px;text-align:right;padding:2px 0;
  -webkit-appearance:none;appearance:none;
}
.rline select{text-align:right;text-align-last:right;padding-right:2px}
.rline input:focus,.rline select:focus{outline:0;box-shadow:0 2px 0 var(--signal)}
.rtotal{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0 2px;border-top:2px solid var(--paper-ink);margin-top:8px}
.rtotal .l{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.rtotal .v{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums}
.rprofit{display:flex;justify-content:space-between;font-size:12.5px;color:#6C645A;padding-bottom:8px}
.rprofit .g{color:#1E7A4F;font-weight:700}
.rprofit .r{color:#B0342F;font-weight:700}

.seg{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:13px;color:var(--muted);font-weight:560}
.seg button.is-active{background:var(--signal);color:#12100E;font-weight:680}

/* ---------- Chart ---------- */
.chart{width:100%;height:auto;display:block}
.chart .bar-r{fill:var(--surface2)}
.chart .bar-p{fill:var(--signal)}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:9px}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);font-family:var(--mono);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ---------- Tabbar ---------- */
#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(14,16,19,.9);
  backdrop-filter:saturate(160%) blur(16px);
  -webkit-backdrop-filter:saturate(160%) blur(16px);
  border-top:1px solid var(--line);
  padding-bottom:var(--safe-bottom);
}
.tab{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 2px 8px;font-size:10.5px;color:var(--muted);letter-spacing:.01em;
}
.tab-ico{font-size:16px;line-height:1}
.tab.is-active{color:var(--signal)}

/* ---------- Sheet ---------- */
.sheet{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sheet-panel{
  position:relative;width:100%;max-height:92vh;overflow-y:auto;
  background:var(--bg);border-top:1px solid var(--line);
  border-radius:20px 20px 0 0;
  padding:0 16px calc(20px + var(--safe-bottom));
  animation:up .22s cubic-bezier(.2,.8,.2,1);
  -webkit-overflow-scrolling:touch;
}
@keyframes up{from{transform:translateY(14%)}to{transform:none}}
.sheet-head{
  position:sticky;top:0;background:var(--bg);z-index:2;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 0 12px;border-bottom:1px solid var(--line);margin-bottom:14px;
}
.sheet-head h2{font-size:19px}

.field{margin-bottom:11px}
.field label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:var(--mono);margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:11px 12px;font-size:16px;-webkit-appearance:none;appearance:none;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--signal);outline-offset:-1px}
.field-2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.photo-pick{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.photo-pick img,.photo-pick .ph{
  width:64px;height:64px;border-radius:12px;object-fit:cover;
  background:var(--surface2);border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:20px;
}
.photo-pick .acts{display:flex;flex-direction:column;gap:6px;flex:1}
.photo-pick .acts button{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:13px}

.ledger{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.ledger:last-child{border-bottom:0}
.ledger .lm{min-width:0}
.ledger .ld{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.ledger .lv{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

.toast{
  position:fixed;left:50%;bottom:calc(84px + var(--safe-bottom));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;
  font-size:14px;font-weight:600;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.4);
}

/* ---------- Start / Login ---------- */
.boot{
  position:fixed;inset:0;z-index:300;display:grid;place-content:center;
  gap:10px;justify-items:center;background:var(--bg);
}
.boot-mark{
  width:62px;height:62px;border-radius:16px;background:var(--signal);color:#12100E;
  display:grid;place-items:center;font-size:26px;
}
.boot-text{font-family:var(--mono);font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.boot[hidden]{display:none}

.auth{
  position:fixed;inset:0;z-index:200;overflow-y:auto;background:var(--bg);
  padding:calc(var(--safe-top) + 28px) 20px calc(var(--safe-bottom) + 28px);
}
.auth[hidden]{display:none}
.auth-card{max-width:420px;margin:0 auto}
.auth-mark{
  width:54px;height:54px;border-radius:15px;background:var(--signal);color:#12100E;
  display:grid;place-items:center;font-size:23px;margin-bottom:18px;
}
.auth-title{font-size:30px;letter-spacing:-.03em}
.auth-sub{color:var(--muted);font-size:14.5px;margin:6px 0 20px}
.auth-error{
  background:rgba(255,91,91,.1);border:1px solid rgba(255,91,91,.35);color:var(--neg);
  border-radius:11px;padding:10px 12px;font-size:14px;margin:0 0 12px;
}
.auth-error[hidden]{display:none}
.auth-note{color:var(--muted);font-size:12.5px;text-align:center;margin:14px 0 0}

.offbar{
  background:rgba(255,90,31,.12);border-bottom:1px solid rgba(255,90,31,.3);
  color:var(--signal);font-size:12.5px;font-family:var(--mono);
  padding:7px 16px;text-align:center;
}

/* ---------- Anfragen ---------- */
.req{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px}
.req-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.req-title{font-weight:600;font-size:15.5px}

.req-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 0;
  border-top:1px solid var(--line);padding-top:10px}
.req-grid div{font-size:12px;color:var(--muted);font-family:var(--mono)}
.req-grid b{display:block;color:var(--ink);font-size:15px;margin-top:3px;font-variant-numeric:tabular-nums}

  padding:3px 8px;border-radius:6px;white-space:nowrap;flex:0 0 auto}
.st-offen{background:rgba(255,90,31,.14);color:var(--signal)}
.st-angenommen{background:rgba(55,201,138,.14);color:var(--pos)}
.st-abgelehnt{background:rgba(255,91,91,.14);color:var(--neg)}

/* ---------- Verkaufsknopf, Warenkorb, Chat ---------- */
.sellbtn{
  width:40px;height:40px;border-radius:10px;flex:0 0 auto;
  background:var(--neg);color:#fff;font-weight:700;font-size:17px;
  display:grid;place-items:center;
}

.sellbtn.plusminus{background:var(--surface2);border:1px solid var(--line);color:var(--ink);font-size:15px}
.dot{
  position:absolute;top:1px;right:1px;min-width:16px;height:16px;border-radius:9px;

}

.qtybox .n{font-family:var(--mono);font-size:16px;min-width:26px;text-align:center;font-variant-numeric:tabular-nums}

.chatwrap{display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.bubble{max-width:78%;padding:9px 12px;border-radius:15px;font-size:15px;line-height:1.35;word-break:break-word}
.bubble .t{display:block;font-size:10.5px;font-family:var(--mono);opacity:.6;margin-top:4px}
.b-me{align-self:flex-end;background:var(--signal);color:#12100E;border-bottom-right-radius:5px}
.b-them{align-self:flex-start;background:var(--surface2);border:1px solid var(--line);border-bottom-left-radius:5px}
.chatbar{
  position:sticky;bottom:0;display:flex;gap:8px;padding:10px 0 4px;
  background:linear-gradient(to top,var(--bg) 70%,transparent);
}
.chatbar input{
  flex:1;background:var(--surface);border:1px solid var(--line);border-radius:20px;
  padding:11px 14px;font-size:16px;-webkit-appearance:none;
}
.chatbar button{
  width:44px;height:44px;border-radius:22px;background:var(--signal);color:#12100E;
  font-size:18px;flex:0 0 auto;
}

.soll{display:grid;grid-template-columns:1fr 1fr;gap:8px}

</style>
<script src="config.js"></script>
</head>
<body>

<div id="boot" class="boot"><div class="boot-mark">▤</div><div class="boot-text">Lager</div></div>

<section id="auth" class="auth" hidden>
  <div class="auth-card">
    <div class="auth-mark">▤</div>
    <h1 class="auth-title">Lager</h1>
    <p class="auth-sub">Melde dich mit deinem Zugang an.</p>
    <div class="seg" id="authSeg">
      <button data-m="login" class="is-active">Anmelden</button>
      <button data-m="signup">Neues Konto</button>
    </div>
    <div class="field"><label>E-Mail</label>
      <input id="auEmail" type="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false"></div>

      <div class="field"><label>Dein Name</label><input id="auName" autocomplete="name"></div>
      <div class="field"><label>Code vom Chef</label>
        <input id="auCode" autocapitalize="characters" autocomplete="off" spellcheck="false"></div>
    </div>
    <p class="auth-error" id="auErr" hidden></p>
    <button class="btn" id="auGo">Anmelden</button>

  </div>

  <header id="topbar">
    <div class="topbar-row">
      <h1 id="viewTitle">Lager</h1>

        <button id="cartBtn" class="icon-btn" hidden aria-label="Warenkorb">🛒<span id="cartCount" class="dot" hidden></span></button>
        <button id="menuBtn" class="icon-btn" aria-label="Menü">•••</button>
      </div>
    </div>

      <input id="search" type="search" placeholder="Suchen" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
  </header>

  <main id="main"></main>
  <nav id="tabbar"></nav>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button class="icon-btn" data-close aria-label="Schließen">✕</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<script>
/* =========================================================
   Lager — Chef und Läufer
   ========================================================= */

const SB = {
  url: (window.SUPABASE_URL || '').replace(/\/+$/, ''),
  key: window.SUPABASE_KEY || '',
  token: null, refresh: null,
  configured() { return this.url && this.key && !this.url.includes('DEIN-PROJEKT'); },
  async authCall(path, body) {
    const r = await fetch(`${this.url}/auth/v1/${path}`, {
      method: 'POST', headers: { apikey: this.key, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error_description || d.msg || d.message || d.error || 'Fehler');
    return d;
  },
  head(x) {
    return Object.assign({ apikey: this.key, Authorization: 'Bearer ' + (this.token || this.key),
      'Content-Type': 'application/json' }, x || {});
  },
  async rest(path, o) {
    o = o || {};
    const r = await fetch(`${this.url}/rest/v1/${path}`,
      { method: o.method || 'GET', headers: this.head(o.headers), body: o.body });
    if (!r.ok) throw new Error((await r.text()) || 'Serverfehler');
    if (r.status === 204) return null;
    return r.json();
  },
  select(t, q) { return this.rest(t + '?' + (q || 'select=*')); },
  insert(t, row) { return this.rest(t, { method: 'POST', headers: { Prefer: 'return=representation' }, body: JSON.stringify(row) }); },
  update(t, id, p) { return this.rest(`${t}?id=eq.${id}`, { method: 'PATCH', headers: { Prefer: 'return=representation' }, body: JSON.stringify(p) }); },
  remove(t, id) { return this.rest(`${t}?id=eq.${id}`, { method: 'DELETE' }); }
};

const Auth = {
  me: null,
  save(d) {
    SB.token = d.access_token; SB.refresh = d.refresh_token;
    try { localStorage.setItem('lager_session', JSON.stringify({ a: d.access_token, r: d.refresh_token })); } catch (e) { }
  },
  load() {
    try { const s = JSON.parse(localStorage.getItem('lager_session') || 'null');
      if (s) { SB.token = s.a; SB.refresh = s.r; return true; } } catch (e) { }
    return false;
  },
  clear() { SB.token = null; SB.refresh = null; this.me = null;
    try { localStorage.removeItem('lager_session'); } catch (e) { } },
  async tryRefresh() {
    if (!SB.refresh) return false;
    try { this.save(await SB.authCall('token?grant_type=refresh_token', { refresh_token: SB.refresh })); return true; }
    catch (e) { this.clear(); return false; }
  },
  uid() {
    try { return JSON.parse(atob(SB.token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).sub; }
    catch (e) { return null; }
  },
  async login(email, pw) { this.save(await SB.authCall('token?grant_type=password', { email: email.trim(), password: pw })); return this.loadProfile(); },
  async signup(email, pw, name, code) {
    await SB.authCall('signup', { email: email.trim(), password: pw, data: { name: name.trim(), code: code.trim() } });
    return this.login(email, pw);
  },
  async loadProfile() {
    const id = this.uid(); if (!id) throw new Error('Sitzung ungültig');
    const rows = await SB.select('profiles', `select=*&id=eq.${id}`);
    if (!rows || !rows.length) throw new Error('Konto nicht gefunden. Wurde das SQL-Skript ausgeführt?');
    this.me = rows[0]; return this.me;
  },
  isAdmin() { return this.me && this.me.role === 'admin'; }
};

const Cache = {
  db: null,
  open() { return new Promise(res => {
    const r = indexedDB.open('lagercache', 1);
    r.onupgradeneeded = e => { const d = e.target.result; if (!d.objectStoreNames.contains('snap')) d.createObjectStore('snap'); };
    r.onsuccess = e => { this.db = e.target.result; res(true); };
    r.onerror = () => res(false);
  }); },
  put(k, v) { if (!this.db) return Promise.resolve();
    return new Promise(res => { try { const q = this.db.transaction('snap', 'readwrite').objectStore('snap').put(v, k);
      q.onsuccess = () => res(); q.onerror = () => res(); } catch (e) { res(); } }); },
  get(k) { if (!this.db) return Promise.resolve(null);
    return new Promise(res => { try { const q = this.db.transaction('snap', 'readonly').objectStore('snap').get(k);
      q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); } catch (e) { res(null); } }); }
};

/* ---------- Zustand ---------- */
const S = { products: [], movements: [], partners: [], payments: [], orders: [], items: [], messages: [], katalog: [] };
let tab = 'stock';
let offlineSince = null;
const query = {};
let period = 'month';
let statsYear = new Date().getFullYear();
let chatWith = null;
const cart = {};          // productId -> menge (nur Läufer)

/* ---------- Werkzeug ---------- */
const eur = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' });
const nf = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 2 });
const money = v => eur.format(+v || 0);
const today = () => new Date().toISOString().slice(0, 10);
const deDate = i => { if (!i) return ''; const p = String(i).slice(0, 10).split('-'); return `${p[2]}.${p[1]}.${p[0]}`; };
const deTime = i => { try { return new Date(i).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } };
const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MON1 = ['J','F','M','A','M','J','J','A','S','O','N','D'];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const norm = s => String(s || '').toLowerCase();
const byId = (a, id) => a.find(x => x.id === id);
const n2 = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
const f2 = v => (Math.round((+v || 0) * 100) / 100).toFixed(2).replace('.', ',');

function toast(m) {
  const t = document.getElementById('toast');
  t.textContent = m; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 2200);
}
function fail(e) {
  let m = (e && e.message) || String(e);
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) m = 'Keine Verbindung';
  else if (m.length > 140) m = m.slice(0, 140) + '…';
  toast(m);
}

/* ---------- Rechnen ---------- */
const PLUS = ['purchase', 'return'];
const MINUS = ['sale', 'handout', 'adjust'];

function stockOf(pid) {                 // Lager beim Chef
  let n = 0;
  for (const m of S.movements) {
    if (m.product_id !== pid) continue;
    if (PLUS.includes(m.type)) n += +m.qty;
    else if (MINUS.includes(m.type)) n -= +m.qty;
  }
  return n;
}
function runnerStock(sid, pid) {        // was ein Läufer noch hat
  let n = 0;
  for (const m of S.movements) {
    if (m.partner_id !== sid) continue;
    if (pid && m.product_id !== pid) continue;
    if (m.type === 'handout') n += +m.qty;
    else if (m.type === 'return' || m.type === 'runner_sale') n -= +m.qty;
  }
  return n;
}
function runnerStockList(sid) {
  const map = {};
  S.movements.filter(m => m.partner_id === sid).forEach(m => {
    if (!['handout', 'return', 'runner_sale'].includes(m.type)) return;
    const v = map[m.product_id] || (map[m.product_id] = { qty: 0, price: 0 });
    if (m.type === 'handout') { v.qty += +m.qty; v.price = +m.unit_price || v.price; }
    else v.qty -= +m.qty;
  });
  return Object.entries(map).map(([pid, v]) => ({ pid, qty: v.qty, price: v.price })).filter(x => x.qty > 0);
}
function runnerDebt(sid) {              // was der Läufer dem Chef schuldet
  let d = 0;
  for (const m of S.movements) {
    if (m.partner_id !== sid) continue;
    if (m.type === 'handout') d += m.unit_price * m.qty;
    else if (m.type === 'return') d -= m.unit_price * m.qty;
  }
  for (const p of S.payments) if (p.partner_id === sid && p.direction === 'in') d -= +p.amount;
  return d;
}
const runners = () => S.partners.filter(p => p.role === 'supplier');
const stockValue = () => S.products.reduce((s, p) => s + stockOf(p.id) * (+p.sell_price || 0), 0);
const totalDebt = () => runners().reduce((s, r) => s + Math.max(0, runnerDebt(r.id)), 0);

function periodRange(p) {
  const n = new Date(), y = n.getFullYear(), mo = n.getMonth(), d = n.getDate();
  const iso = x => x.toISOString().slice(0, 10);
  if (p === 'week') { const dw = (n.getDay() + 6) % 7; return [iso(new Date(y, mo, d - dw)), iso(new Date(y, mo, d - dw + 6))]; }
  if (p === 'month') return [iso(new Date(y, mo, 1)), iso(new Date(y, mo + 1, 0))];
  if (p === 'year') return [`${y}-01-01`, `${y}-12-31`];
  return ['0000-01-01', '9999-12-31'];
}
const inPeriod = (m, p) => { const r = periodRange(p), d = String(m.date).slice(0, 10); return d >= r[0] && d <= r[1]; };

/* Einkaufspreis: steht bewusst nicht in Zeilen, die Läufer lesen dürfen.
   Deshalb im Zweifel aus dem Produkt holen — das sieht nur der Chef. */
const buyOf = pid => { const p = byId(S.products, pid); return p ? +p.buy_price || 0 : 0; };
const costOf = m => (+m.cost_price > 0 ? +m.cost_price : buyOf(m.product_id));

/* Geld, das der Chef verdient */
const adminRevenue = m => m.type === 'sale' ? m.unit_price * m.qty
  : m.type === 'handout' ? m.unit_price * m.qty
  : m.type === 'return' ? -(m.unit_price * m.qty) : 0;
const adminCost = m => m.type === 'sale' || m.type === 'handout' ? costOf(m) * m.qty
  : m.type === 'return' ? -(costOf(m) * m.qty) : 0;

/* Tatsächlich an Kunden verkaufte Stück */
const soldUnits = m => m.type === 'sale' || m.type === 'runner_sale' ? +m.qty : 0;
const soldProfit = m => m.type === 'sale' ? (m.unit_price - costOf(m)) * m.qty
  : m.type === 'runner_sale' ? (m.admin_price - costOf(m)) * m.qty : 0;
const soldValue = m => m.type === 'sale' ? m.unit_price * m.qty
  : m.type === 'runner_sale' ? m.admin_price * m.qty : 0;

/* Läufer: eigener Gewinn */
const myProfit = m => m.type === 'runner_sale' ? (m.unit_price - m.admin_price) * m.qty : 0;
const myRevenue = m => m.type === 'runner_sale' ? m.unit_price * m.qty : 0;

/* ---------- Daten holen ---------- */
async function loadData() {
  try {
    if (Auth.isAdmin()) {
      const [products, movements, partners, payments, orders, items, messages] = await Promise.all([
        SB.select('products', 'select=*&order=name'),
        SB.select('movements', 'select=*&order=date.desc'),
        SB.select('profiles', 'select=*&order=name'),
        SB.select('payments', 'select=*'),
        SB.select('orders', 'select=*&order=created_at.desc'),
        SB.select('order_items', 'select=*'),
        SB.select('messages', 'select=*&order=created_at')
      ]);
      Object.assign(S, { products, movements, partners, payments, orders, items, messages });
    } else {
      const [katalog, movements, payments, orders, items, messages] = await Promise.all([
        SB.select('katalog', 'select=*&order=name'),
        SB.select('movements', 'select=*&order=date.desc'),
        SB.select('payments', 'select=*'),
        SB.select('orders', 'select=*&order=created_at.desc'),
        SB.select('order_items', 'select=*'),
        SB.select('messages', 'select=*&order=created_at')
      ]);
      Object.assign(S, { katalog, movements, payments, orders, items, messages });
    }
    offlineSince = null;
    await Cache.put('v2', { at: new Date().toISOString(), role: Auth.me.role, S: JSON.parse(JSON.stringify(S)) });
  } catch (e) {
    const snap = await Cache.get('v2');
    if (snap && snap.role === Auth.me.role) { Object.assign(S, snap.S); offlineSince = snap.at; }
    else throw e;
  }
  const bar = document.getElementById('offlineBar');
  bar.hidden = !offlineSince;
  if (offlineSince) bar.textContent = 'Kein Internet — Stand ' + deDate(offlineSince) + ', nichts speicherbar';
}
function online() { if (offlineSince) { toast('Kein Internet'); return false; } return true; }

/* ---------- Tabs ---------- */
const ADMIN_TABS = [['stock','▤','Lager'],['runners','⇄','Läufer'],['finance','€','Geld'],['chat','✉','Chat'],['stats','▮','Statistik']];
const SUP_TABS = [['shop','▤','Produkte'],['mystock','▦','Mein Lager'],['mystats','▮','Meine Zahlen'],['chat','✉','Chat']];
const TITLES = { stock:'Lager', runners:'Läufer', finance:'Geld', chat:'Chat', stats:'Statistik',
  shop:'Produkte', mystock:'Mein Lager', mystats:'Meine Zahlen' };
const PLACE = { stock:'Produkt oder Marke', runners:'Läufer oder Ort', finance:'Produkt suchen',
  chat:'Läufer suchen', stats:'Produkt oder Läufer', shop:'Produkt oder Marke',
  mystock:'Produkt suchen', mystats:'Produkt suchen' };

function buildTabs() {
  const list = Auth.isAdmin() ? ADMIN_TABS : SUP_TABS;
  tab = list[0][0];
  const b = document.getElementById('tabbar');
  b.style.gridTemplateColumns = `repeat(${list.length},1fr)`;
  b.innerHTML = list.map(([k, i, l]) => `<button class="tab" data-tab="${k}"><span class="tab-ico">${i}</span>${l}</button>`).join('');
}
const q = () => norm(query[tab]);
const empty = (t, x) => `<div class="empty"><b>${esc(t)}</b>${esc(x)}</div>`;

function render() {
  document.getElementById('viewTitle').textContent = TITLES[tab];
  const s = document.getElementById('search');
  s.placeholder = PLACE[tab] || 'Suchen';
  if (s.value !== (query[tab] || '')) s.value = query[tab] || '';
  document.getElementById('searchWrap').hidden = (tab === 'chat' && !Auth.isAdmin());
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('is-active', x.dataset.tab === tab));
  const cb = document.getElementById('cartBtn');
  const n = Object.values(cart).reduce((a, b) => a + b, 0);
  cb.hidden = Auth.isAdmin() || tab !== 'shop';
  document.getElementById('cartCount').hidden = !n;
  document.getElementById('cartCount').textContent = n;
  const V = { stock:vStock, runners:vRunners, finance:vFinance, chat:vChat, stats:vStats,
    shop:vShop, mystock:vMyStock, mystats:vMyStats }[tab];
  document.getElementById('main').innerHTML = '<div class="view">' + V() + '</div>';
  const W = { stock:wStock, runners:wRunners, finance:wFinance, chat:wChat, stats:wStats,
    shop:wShop, mystock:wMyStock, mystats:wMyStats }[tab];
  if (W) W();
}

/* =========================================================
   CHEF-ANSICHTEN
   ========================================================= */

/* ----- Lager ----- */
function vStock() {
  let list = S.products.slice();
  if (q()) list = list.filter(p => norm(p.name).includes(q()) || norm(p.brand).includes(q()) || norm(p.category).includes(q()));
  const units = S.products.reduce((s, p) => s + Math.max(0, stockOf(p.id)), 0);
  const beiLaeufern = runners().reduce((s, r) => s + runnerStock(r.id, null), 0);
  return `
    <div class="kpis">
      <div class="kpi"><div class="lab">Bei dir</div><div class="val">${nf.format(units)}</div></div>
      <div class="kpi"><div class="lab">Bei den Läufern</div><div class="val">${nf.format(beiLaeufern)}</div></div>
      <div class="kpi wide"><div class="lab">Wert deines Lagers</div><div class="val">${money(stockValue())}</div></div>
    </div>
    <button class="btn" id="newProduct" style="margin-top:10px">Neues Produkt</button>
    <p class="sub">Das rote Feld verkauft direkt 1 Stück.</p>
    <div class="eyebrow">${q() ? 'Gefunden · ' + list.length : 'Produkte · ' + S.products.length}</div>
    <div class="stack">${list.length ? list.map(pRow).join('')
      : empty(S.products.length ? 'Nichts gefunden' : 'Noch keine Produkte', 'Leg oben dein erstes Produkt an.')}</div>`;
}
function pRow(p) {
  const st = stockOf(p.id);
  return `<div class="row">
    <button class="row" style="border:0;padding:0;background:none;flex:1;gap:12px" data-pid="${p.id}">

  const zahlungen = S.payments.filter(p => inPeriod(p, period) && p.direction === 'in').reduce((s, p) => s + +p.amount, 0);
  const soll = rev, ist = eigene + zahlungen;
  const schulden = totalDebt();
  const wertLaeufer = runners().reduce((s, r) => s + runnerStockList(r.id).reduce((a, x) => a + x.qty * x.price, 0), 0);
  let liste = runners().map(r => ({ r, d: runnerDebt(r.id) })).filter(x => x.d > 0.005).sort((a, b) => b.d - a.d);

    </div>

    <div class="kpis" style="margin-top:10px">
      <div class="kpi"><div class="lab">Offene Schulden</div><div class="val ${schulden ? 'neg' : ''}">${money(schulden)}</div></div>
      <div class="kpi"><div class="lab">Ware bei Läufern</div><div class="val">${money(wertLaeufer)}</div></div>
      <div class="kpi wide"><div class="lab">Wert deines Lagers</div><div class="val">${money(stockValue())}</div></div>
    </div>
    <div class="eyebrow">Wer schuldet dir was</div>
    <div class="stack">${liste.length ? liste.map(x => `
      <button class="row" data-fid="${x.r.id}">
        <div class="row-main"><div class="row-title">${esc(x.r.name)}</div>
          <div class="row-sub">${x.r.area ? esc(x.r.area) : 'Kein Ort'} · hat ${nf.format(runnerStock(x.r.id, null))} Stück</div></div>
        <div class="row-end"><div class="big neg">${money(x.d)}</div><div class="small">offen</div></div></button>`).join('')
      : empty('Alle haben bezahlt', 'Keine offenen Schulden.')}</div>
    <div class="eyebrow">Verlauf ${new Date().getFullYear()}</div>
    <div class="card">${chart(new Date().getFullYear())}
      <div class="legend"><span><i style="background:var(--surface2);border:1px solid var(--line)"></i>Umsatz</span>
        <span><i style="background:var(--signal)"></i>Gewinn</span></div></div>`;
}
function wFinance() {
  document.getElementById('perChips').onclick = e => {
    const b = e.target.closest('[data-p]'); if (!b) return; period = b.dataset.p; render();
  };
  document.querySelectorAll('[data-fid]').forEach(el => el.onclick = () => runnerSheet(byId(S.partners, el.dataset.fid)));
}
function chart(year) {
  const rev = Array(12).fill(0), pro = Array(12).fill(0);
  S.movements.forEach(m => {
    const d = String(m.date).slice(0, 10).split('-');
    if (+d[0] !== year) return;
    rev[+d[1] - 1] += adminRevenue(m); pro[+d[1] - 1] += adminRevenue(m) - adminCost(m);
  });
  const max = Math.max(1, ...rev, ...pro), W = 340, H = 150, pad = 16, bw = (W - pad * 2) / 12;
  let o = '';
  for (let i = 0; i < 12; i++) {
    const hr = Math.max(0, rev[i] / max) * (H - 34), hp = Math.max(0, pro[i] / max) * (H - 34), x = pad + i * bw;
    o += `<rect class="bar-r" x="${x + 2}" y="${H - 20 - hr}" width="${bw - 8}" height="${hr}" rx="2"/>`;
    o += `<rect class="bar-p" x="${x + 2}" y="${H - 20 - hp}" width="${bw - 8}" height="${hp}" rx="2"/>`;
    o += `<text x="${x + (bw - 6) / 2}" y="${H - 7}" text-anchor="middle">${MON1[i]}</text>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${o}</svg>`;
}

/* ----- Statistik ----- */
function vStats() {
  const inP = S.movements.filter(m => inPeriod(m, period));
  const pa = {};
  inP.forEach(m => {
    if (!soldUnits(m)) return;
    const a = pa[m.product_id] || (pa[m.product_id] = { u: 0, v: 0, g: 0 });
    a.u += soldUnits(m); a.v += soldValue(m); a.g += soldProfit(m);
  });
  let topP = Object.entries(pa).map(([id, a]) => Object.assign({ p: byId(S.products, id) }, a))
    .filter(x => x.p).sort((a, b) => b.u - a.u);
  if (q()) topP = topP.filter(x => norm(x.p.name).includes(q()) || norm(x.p.brand).includes(q()));
  topP = topP.slice(0, 10);

  const ra = {};
  inP.forEach(m => {
    if (m.type !== 'runner_sale' || !m.partner_id) return;
    const a = ra[m.partner_id] || (ra[m.partner_id] = { u: 0, g: 0 });
    a.u += +m.qty; a.g += soldProfit(m);
  });
  let topR = Object.entries(ra).map(([id, a]) => Object.assign({ r: byId(S.partners, id) }, a))
    .filter(x => x.r).sort((a, b) => b.u - a.u);
  if (q()) topR = topR.filter(x => norm(x.r.name).includes(q()));
  topR = topR.slice(0, 3);

  const yMov = S.movements.filter(m => +String(m.date).slice(0, 4) === statsYear);
  const ma = Array.from({ length: 12 }, () => ({ u: 0, g: 0 }));
  yMov.forEach(m => { const i = +String(m.date).slice(5, 7) - 1; ma[i].u += soldUnits(m); ma[i].g += soldProfit(m); });
  const topM = ma.map((a, i) => Object.assign({ i }, a)).filter(x => x.u > 0).sort((a, b) => b.g - a.g).slice(0, 3);
  const years = [...new Set(S.movements.map(m => +String(m.date).slice(0, 4)))].sort((a, b) => b - a);
  if (years.length && !years.includes(statsYear)) statsYear = years[0];

  const label = { week: 'diese Woche', month: 'diesen Monat', year: 'dieses Jahr', all: 'insgesamt' }[period];
  return `
    <div class="chips" id="perChips">${[['week','Woche'],['month','Monat'],['year','Jahr'],['all','Gesamt']]
      .map(([k, l]) => `<button class="chip ${k === period ? 'is-active' : ''}" data-p="${k}">${l}</button>`).join('')}</div>
    <div class="eyebrow">Top 10 Produkte · ${label}</div>
    <div class="stack">${topP.length ? topP.map((x, i) => `
      <div class="rank"><div class="rank-no">${String(i + 1).padStart(2, '0')}</div>
        ${x.p.photo ? `<img class="thumb" src="${x.p.photo}" alt="">` : '<div class="thumb">▤</div>'}
        <div class="row-main"><div class="row-title">${esc(x.p.name)}</div>
          <div class="row-sub">${esc(x.p.brand || 'ohne Marke')} · ${nf.format(x.u)} Stück · ${money(x.v)}</div></div>
        <div class="row-end"><div class="big ${x.g >= 0 ? 'pos' : 'neg'}">${money(x.g)}</div><div class="small">Gewinn</div></div></div>`).join('')
      : empty('Noch nichts verkauft', 'Wähle oben einen anderen Zeitraum.')}</div>
    <div class="eyebrow">Top 3 Läufer · ${label}</div>
    <div class="stack">${topR.length ? topR.map((x, i) => `
      <div class="rank"><div class="rank-no">${i + 1}</div>
        <div class="row-main"><div class="row-title">${esc(x.r.name)}</div>
          <div class="row-sub">${x.r.area ? esc(x.r.area) + ' · ' : ''}${nf.format(x.u)} Stück verkauft</div></div>
        <div class="row-end"><div class="big ${x.g >= 0 ? 'pos' : 'neg'}">${money(x.g)}</div><div class="small">dein Gewinn</div></div></div>`).join('')
      : empty('Keine Verkäufe der Läufer', 'Sobald sie etwas verkaufen, steht es hier.')}</div>
    <div class="eyebrow">Beste Monate ${statsYear}</div>
    <div class="chips" id="yrChips">${(years.length ? years : [statsYear]).map(y =>
      `<button class="chip ${y === statsYear ? 'is-active' : ''}" data-y="${y}">${y}</button>`).join('')}</div>
    <div class="stack" style="margin-top:8px">${topM.length ? topM.map((x, i) => `
      <div class="rank"><div class="rank-no">${i + 1}</div>
        <div class="row-main"><div class="row-title">${MONTHS[x.i]}</div>
          <div class="row-sub">${nf.format(x.u)} Stück verkauft</div></div>
        <div class="row-end"><div class="big ${x.g >= 0 ? 'pos' : 'neg'}">${money(x.g)}</div><div class="small">Gewinn</div></div></div>`).join('')
      : empty('Noch kein Monat mit Verkauf', 'Buche Verkäufe, dann füllt sich das hier.')}</div>`;
}

function sellSheet(pid) {
  const p = byId(S.katalog, pid);
  const mine = runnerStockList(Auth.me.id).find(x => x.pid === pid);
  if (!p || !mine) return;
  openSheet('Verkauft: ' + p.name, `
    <p class="sub" style="margin-top:0">Du hast ${nf.format(mine.qty)} Stück. Trag ein, für wieviel du verkauft hast.</p>
    <div class="field-2">
      <div class="field"><label>Anzahl</label><input id="svQty" type="number" inputmode="numeric" step="1" value="1"></div>
      <div class="field"><label>Preis je Stück</label><input id="svPrice" type="number" inputmode="decimal" step="0.01" value="${p.sell_price || ''}"></div>
    </div>
    <div class="card"><div class="ledger"><div class="lm">Du zahlst dem Chef</div><div class="lv">${money(mine.price)}</div></div>
      <div class="ledger"><div class="lm">Dein Gewinn je Stück</div><div class="lv pos" id="svGain">${money((+p.sell_price || 0) - mine.price)}</div></div></div>
    <div class="btn-row"><button class="btn" id="svGo">Verkauf eintragen</button></div>
  `, () => {
    const upd = () => {
      const g = n2(document.getElementById('svPrice').value) - mine.price;
      const el = document.getElementById('svGain');
      el.textContent = money(g); el.className = 'lv ' + (g >= 0 ? 'pos' : 'neg');
    };
    document.getElementById('svPrice').oninput = upd;
    document.getElementById('svGo').onclick = async () => {
      if (!online()) return;
      const qty = n2(document.getElementById('svQty').value);
      if (qty <= 0) return toast('Anzahl eintragen');
      if (qty > mine.qty) return toast('So viel hast du nicht');
      try {
        const rows = await SB.insert('movements', {
          type: 'runner_sale', product_id: pid, qty,
          unit_price: n2(document.getElementById('svPrice').value),
          admin_price: mine.price, cost_price: 0,
          date: today(), partner_id: Auth.me.id
        });
        S.movements.unshift(rows[0]);
        closeSheet(); toast('Verkauf eingetragen'); render();
      } catch (e) { fail(e); }
    };

function vMyStats() {

  const um = inP.reduce((s, m) => s + myRevenue(m), 0);
  const gw = inP.reduce((s, m) => s + myProfit(m), 0);
  const agg = {};
  inP.forEach(m => {

  let top = Object.entries(agg).map(([id, a]) => Object.assign({ p: byId(S.katalog, id) }, a))

          <span class="t">${deDate(m.created_at)} ${deTime(m.created_at)}</span></div>`;
      }).join('') : '<div class="empty"><b>Noch nichts geschrieben</b>Schreib die erste Nachricht.</div>'}

      <button id="msgGo">↑</button></div>`;
}
function wChat() {
  const back = document.getElementById('backChat');
  if (back) back.onclick = () => { chatWith = null; render(); };
  document.querySelectorAll('[data-cid]').forEach(el => el.onclick = () => { chatWith = el.dataset.cid; render(); });
  const inp = document.getElementById('msgIn'), go = document.getElementById('msgGo');
  if (!inp) return;
  const send = async () => {
    if (!online()) return;
    const t = inp.value.trim(); if (!t) return;
    const sid = Auth.isAdmin() ? chatWith : Auth.me.id;
    inp.value = '';
    try {
      const rows = await SB.insert('messages', { supplier_id: sid, sender_id: Auth.me.id, from_admin: Auth.isAdmin(), text: t });
      S.messages.push(rows[0]); render();
      window.scrollTo(0, document.body.scrollHeight);
    } catch (e) { fail(e); inp.value = t; }
  };
  go.onclick = send;
  inp.onkeydown = e => { if (e.key === 'Enter') send(); };
  window.scrollTo(0, document.body.scrollHeight);
}

    <div class="field-2">
      <div class="field"><label>Menge</label><input id="pQty" type="number" inputmode="numeric" step="1" value="${isNew ? 0 : st}"></div>
      <div class="field"><label>Dein Einkauf</label><input id="pBuy" type="number" inputmode="decimal" step="0.01" value="${p.buy_price}"></div></div>
    <div class="field-2">
      <div class="field"><label>Preis für Kunden</label><input id="pSell" type="number" inputmode="decimal" step="0.01" value="${p.sell_price}"></div>
      <div class="field"><label>Preis für Läufer</label><input id="pRun" type="number" inputmode="decimal" step="0.01" value="${p.runner_price}"></div></div>
    <p class="sub">„Preis für Läufer" ist das, was ein Läufer dir schuldet, wenn er ein Stück bekommt.</p>
    <div class="field" style="margin-top:11px"><label>Notiz</label><textarea id="pNote" rows="2">${esc(p.note)}</textarea></div>
    ${isNew ? '' : `<div class="kpis" style="margin-top:6px">
        <div class="kpi"><div class="lab">Verkauft</div><div class="val">${nf.format(verk)}</div></div>
        <div class="kpi"><div class="lab">Gewinn daraus</div><div class="val ${gew >= 0 ? 'pos' : 'neg'}">${money(gew)}</div></div></div>`}
    <div class="btn-row"><button class="btn" id="pSave">${isNew ? 'Anlegen' : 'Speichern'}</button></div>
    ${isNew ? '' : '<div class="btn-row"><button class="btn btn-danger" id="pDel">Produkt löschen</button></div>'}
  `, () => {
    let photo = p.photo;
    const img = document.getElementById('pvImg'), ph = document.getElementById('pvPh'), file = document.getElementById('fileIn');
    document.getElementById('pickPhoto').onclick = () => file.click();
    document.getElementById('dropPhoto').onclick = () => {
      photo = ''; img.hidden = true; ph.hidden = false; document.getElementById('dropPhoto').hidden = true;
    };
    file.onchange = async () => {
      if (!file.files[0]) return;
      photo = await shrink(file.files[0]);
      img.src = photo; img.hidden = false; ph.hidden = true; document.getElementById('dropPhoto').hidden = false;
    };
    document.getElementById('pSave').onclick = async () => {
      if (!online()) return;
      const name = document.getElementById('pName').value.trim();
      if (!name) return toast('Name fehlt');
      const rec = { name, brand: document.getElementById('pBrand').value.trim(),
        category: document.getElementById('pCat').value.trim(), photo,
        buy_price: n2(document.getElementById('pBuy').value),
        sell_price: n2(document.getElementById('pSell').value),
        runner_price: n2(document.getElementById('pRun').value),
        note: document.getElementById('pNote').value.trim() };
      const wantQty = n2(document.getElementById('pQty').value);
      try {
        let pid = p.id;
        if (isNew) { const rows = await SB.insert('products', rec); S.products.push(rows[0]); pid = rows[0].id; }
        else { const rows = await SB.update('products', p.id, rec);
          const i = S.products.findIndex(x => x.id === p.id); if (i >= 0) S.products[i] = rows[0]; }
        const diff = wantQty - (isNew ? 0 : st);
        if (Math.abs(diff) > 0.0001) {
          const mv = await SB.insert('movements', {
            type: diff > 0 ? 'purchase' : 'adjust', product_id: pid, qty: Math.abs(diff),
            unit_price: diff > 0 ? rec.buy_price : 0, cost_price: rec.buy_price,
            date: today(), note: diff > 0 ? 'Ware rein' : 'Korrektur' });
          S.movements.unshift(mv[0]);
        }
        closeSheet(); toast(isNew ? 'Angelegt' : 'Gespeichert'); render();
      } catch (e) { fail(e); }
    };
    const d = document.getElementById('pDel');
    if (d) d.onclick = async () => {
      if (!online()) return;
      if (!confirm('Produkt und alle Buchungen dazu löschen?')) return;
      try {
        await SB.remove('products', p.id);
        S.products = S.products.filter(x => x.id !== p.id);
        S.movements = S.movements.filter(m => m.product_id !== p.id);
        closeSheet(); toast('Gelöscht'); render();
      } catch (e) { fail(e); }
    };
  });
}
function shrink(file) {
  return new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const max = 700, sc = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.65));
      };
      im.onerror = () => res(''); im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

      v: m.type === 'handout' ? '+' + money(m.unit_price * m.qty)
        : m.type === 'return' ? '−' + money(m.unit_price * m.qty) : '',
      c: m.type === 'handout' ? 'neg' : m.type === 'return' ? 'pos' : 'dim'

      if (!online()) return;
      const qty = n2(document.getElementById('bkQty').value);
      if (qty <= 0 || qty > x.qty) return toast('Anzahl passt nicht');
      try {
        const mv = await SB.insert('movements', { type: 'return', product_id: pid, qty,
          unit_price: x.price, cost_price: 0, date: today(), partner_id: r.id });
        S.movements.unshift(mv[0]);
        closeSheet(); toast('Zurückgenommen'); runnerSheet(r); render();
      } catch (e) { fail(e); }
    };
  });
}

/* ----- Warenkorb (Läufer) ----- */
function cartSheet() {
  const ids = Object.keys(cart);
  openSheet('Dein Warenkorb', `
    ${ids.length ? ids.map(id => {
      const p = byId(S.katalog, id);
      return `<div class="row" style="margin-bottom:8px">
        <div class="row-main"><div class="row-title">${esc(p ? p.name : '—')}</div>
          <div class="row-sub">${money(p ? p.runner_price : 0)} je Stück · ${money((p ? p.runner_price : 0) * cart[id])} gesamt</div></div>
        <div class="qtybox"><button class="sellbtn plusminus" data-cm="${id}">−</button>
          <span class="n">${cart[id]}</span>
          <button class="sellbtn plusminus" data-cp="${id}">+</button></div></div>`;
    }).join('') : '<p class="sub">Der Korb ist leer.</p>'}
    ${ids.length ? `
      <div class="eyebrow">Wann und wo brauchst du es?</div>
      <div class="field-2">
        <div class="field"><label>Datum</label><input id="coDate" type="date"></div>
        <div class="field"><label>Uhrzeit</label><input id="coTime" type="time"></div></div>
      <div class="field"><label>Ort</label><input id="coPlace" placeholder="z. B. Flohmarkt Landshut"></div>
      <div class="field"><label>Notiz</label><textarea id="coNote" rows="2" placeholder="Alles was wichtig ist"></textarea></div>
      <div class="btn-row"><button class="btn" id="coGo">An den Chef schicken</button></div>
      <div class="btn-row"><button class="btn btn-ghost" id="coClear">Korb leeren</button></div>` : ''}
  `, () => {
    document.querySelectorAll('[data-cp]').forEach(el => el.onclick = () => { cart[el.dataset.cp]++; cartSheet(); render(); });
    document.querySelectorAll('[data-cm]').forEach(el => el.onclick = () => {
      const id = el.dataset.cm; cart[id]--; if (cart[id] <= 0) delete cart[id]; cartSheet(); render();
    });
    const clr = document.getElementById('coClear');
    if (clr) clr.onclick = () => { Object.keys(cart).forEach(k => delete cart[k]); closeSheet(); render(); };
    const go = document.getElementById('coGo');
    if (go) go.onclick = async () => {
      if (!online()) return;
      try {
        const rows = await SB.insert('orders', {
          supplier_id: Auth.me.id, status: 'offen',
          needed_by: document.getElementById('coDate').value || null,
          needed_time: document.getElementById('coTime').value || null,
          place: document.getElementById('coPlace').value.trim(),
          note: document.getElementById('coNote').value.trim() });
        const o = rows[0];
        const items = Object.entries(cart).map(([pid, qty]) => ({ order_id: o.id, product_id: pid, qty }));
        const made = await SB.insert('order_items', items);
        S.orders.unshift(o); S.items.push(...made);
        Object.keys(cart).forEach(k => delete cart[k]);
        closeSheet(); toast('Bestellung abgeschickt'); tab = 'mystock'; render();
      } catch (e) { fail(e); }
    };
  });
}

/* ----- Menü ----- */
function menuSheet() {
  const a = Auth.isAdmin();
  openSheet('Dein Konto', `
    <div class="card">
      <div class="ledger"><div class="lm">Name</div><div class="lv">${esc(Auth.me.name || '')}</div></div>
      <div class="ledger"><div class="lm">E-Mail</div><div class="lv" style="font-size:12px">${esc(Auth.me.email || '')}</div></div>
      <div class="ledger"><div class="lm">Rolle</div><div class="lv">${a ? 'Chef' : 'Läufer'}</div></div>
      ${!a && Auth.me.area ? `<div class="ledger"><div class="lm">Dein Ort</div><div class="lv">${esc(Auth.me.area)}</div></div>` : ''}
    </div>
    <div class="btn-row"><button class="btn btn-ghost" id="reload">Neu laden</button></div>
    ${a ? '<div class="btn-row"><button class="btn btn-ghost" id="csv">Alles als CSV</button></div>' : ''}
    <div class="btn-row"><button class="btn btn-danger" id="logout">Abmelden</button></div>
  `, () => {
    document.getElementById('reload').onclick = async () => {
      try { await loadData(); closeSheet(); toast('Aktualisiert'); render(); } catch (e) { fail(e); }
    };
    const c = document.getElementById('csv');
    if (c) c.onclick = () => {
      const head = 'Datum;Art;Produkt;Marke;Menge;Preis;Summe;Einkauf;Gewinn;Laeufer\n';
      const body = S.movements.slice().sort((x, y) => String(x.date).localeCompare(String(y.date))).map(m => {
        const p = byId(S.products, m.product_id) || {}, r = byId(S.partners, m.partner_id) || {};
        return [String(m.date).slice(0, 10), m.type, p.name || '', p.brand || '', m.qty,
          f2(m.unit_price), f2(m.unit_price * m.qty), f2(m.cost_price), f2(soldProfit(m)), r.name || '']
          .map(v => String(v).replace(/;/g, ',')).join(';');
      }).join('\n');
      const b = new Blob(['\uFEFF' + head + body], { type: 'text/csv' });
      const u = URL.createObjectURL(b), el = document.createElement('a');
      el.href = u; el.download = 'lager-' + today() + '.csv';
      document.body.appendChild(el); el.click();
      setTimeout(() => { URL.revokeObjectURL(u); el.remove(); }, 500);
    };
    document.getElementById('logout').onclick = () => { Auth.clear(); closeSheet(); location.reload(); };
  });
}

/* =========================================================
   START
   ========================================================= */
const elBoot = document.getElementById('boot'), elAuth = document.getElementById('auth'), elApp = document.getElementById('app');
let authMode = 'login';
function showAuth(m) { elBoot.hidden = true; elApp.hidden = true; elAuth.hidden = false; if (m) authError(m); }
function authError(m) {
  const e = document.getElementById('auErr');
  if (!m) { e.hidden = true; return; }
  e.textContent = m; e.hidden = false;
}
document.getElementById('authSeg').onclick = e => {
  const b = e.target.closest('[data-m]'); if (!b) return;
  authMode = b.dataset.m;
  document.querySelectorAll('#authSeg button').forEach(x => x.classList.toggle('is-active', x.dataset.m === authMode));
  document.getElementById('signupOnly').hidden = authMode !== 'signup';
  document.getElementById('auGo').textContent = authMode === 'signup' ? 'Konto anlegen' : 'Anmelden';
  authError(null);
};
document.getElementById('auGo').onclick = async () => {
  const btn = document.getElementById('auGo');
  const email = document.getElementById('auEmail').value, pw = document.getElementById('auPass').value;
  if (!email || !pw) return authError('E-Mail und Passwort eingeben');
  btn.disabled = true; btn.textContent = 'Moment…'; authError(null);
  try {
    if (authMode === 'signup') {
      const n = document.getElementById('auName').value, c = document.getElementById('auCode').value;
      if (!n.trim()) throw new Error('Name eingeben');
      if (!c.trim()) throw new Error('Code eingeben');
      await Auth.signup(email, pw, n, c);
    } else await Auth.login(email, pw);
    await startApp();
  } catch (e) {
    let m = e.message || 'Fehler';
    if (/Invalid login/i.test(m)) m = 'E-Mail oder Passwort stimmt nicht';
    else if (/Database error saving new user|Ungueltiger|unexpected_failure/i.test(m)) m = 'Code stimmt nicht — oder das SQL-Skript fehlt';
    else if (/already registered/i.test(m)) m = 'Diese E-Mail hat schon ein Konto';
    else if (/Email not confirmed/i.test(m)) m = 'In Supabase unter Authentication → Email den Schalter „Confirm email" ausschalten';
    else if (/Password should be/i.test(m)) m = 'Passwort zu kurz, mindestens 6 Zeichen';
    else if (/Failed to fetch|Load failed/i.test(m)) m = 'Keine Verbindung. Stimmen URL und Schlüssel in config.js?';
    authError(m);
  } finally {
    btn.disabled = false; btn.textContent = authMode === 'signup' ? 'Konto anlegen' : 'Anmelden';
  }
};
async function startApp() {
  elAuth.hidden = true; elBoot.hidden = false;
  buildTabs();
  try { await loadData(); }
  catch (e) { elBoot.hidden = true; return showAuth('Daten konnten nicht geladen werden: ' + (e.message || '')); }
  elBoot.hidden = true; elApp.hidden = false; render();
}
document.getElementById('tabbar').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  tab = b.dataset.tab; if (tab === 'chat') chatWith = null;
  window.scrollTo(0, 0); render();
});
document.getElementById('search').addEventListener('input', e => { query[tab] = e.target.value; render(); });
document.getElementById('menuBtn').addEventListener('click', menuSheet);
document.getElementById('cartBtn').addEventListener('click', cartSheet);

(async function boot() {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
  if (!SB.configured()) {
    elBoot.hidden = true;
    document.body.innerHTML = '<div style="padding:60px 24px;max-width:460px;margin:0 auto;font-family:-apple-system,sans-serif;color:#EAEEF3">'
      + '<h1 style="font-size:22px">Noch nicht eingerichtet</h1>'
      + '<p style="color:#8B95A3;line-height:1.55">Trag in <b>config.js</b> deine Supabase-Adresse und den Schlüssel ein.</p></div>';
    return;
  }
  await Cache.open();
  if (Auth.load()) {
    try { await Auth.loadProfile(); return startApp(); }
    catch (e) {
      if (await Auth.tryRefresh()) { try { await Auth.loadProfile(); return startApp(); } catch (e2) { } }
      Auth.clear();
    }
  }
  showAuth(null);
})();

</script>

<style>
:root{
  --bg:#0E1013;
  --surface:#161A20;
  --surface2:#1D222A;
  --line:#2A313C;
  --ink:#EAEEF3;
  --muted:#8B95A3;
  --signal:#FF5A1F;
  --pos:#37C98A;
  --neg:#FF5B5B;
  --paper:#F1ECE2;
  --paper-ink:#171412;
  --paper-line:#C9C0B1;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.4;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.02em}
a{color:var(--signal)}

/* ---------- Topbar ---------- */
#topbar{
  position:sticky;top:0;z-index:40;
  padding:calc(var(--safe-top) + 10px) 16px 10px;
  background:rgba(14,16,19,.86);
  backdrop-filter:saturate(160%) blur(14px);
  -webkit-backdrop-filter:saturate(160%) blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
#viewTitle{font-size:26px}
.icon-btn{
  width:36px;height:36px;border-radius:10px;color:var(--muted);
  display:grid;place-items:center;font-size:15px;background:var(--surface2);
}
.icon-btn:active{background:var(--line)}
.searchwrap{margin-top:10px}
#search{
  width:100%;background:var(--surface2);border:1px solid var(--line);
  border-radius:11px;padding:9px 12px;font-size:15px;
  -webkit-appearance:none;appearance:none;
}
#search::placeholder{color:var(--muted)}
#search:focus{outline:2px solid var(--signal);outline-offset:-1px}

/* ---------- Layout ---------- */
#main{padding:14px 16px calc(96px + var(--safe-bottom))}
.view{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin:22px 0 8px;
}
.eyebrow:first-child{margin-top:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:8px}

.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pos{color:var(--pos)}
.neg{color:var(--neg)}
.dim{color:var(--muted)}

.btn{
  background:var(--signal);color:#12100E;font-weight:680;
  border-radius:12px;padding:13px 16px;width:100%;text-align:center;
  letter-spacing:-.01em;
}
.btn:active{filter:brightness(.9)}
.btn-ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line);font-weight:560}
.btn-danger{background:transparent;color:var(--neg);border:1px solid var(--neg)}
.btn-row{display:flex;gap:8px;margin-top:12px}

.empty{
  border:1px dashed var(--line);border-radius:var(--r);padding:26px 18px;
  text-align:center;color:var(--muted);font-size:14px;
}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px;font-weight:600}

/* ---------- Kennzahlen ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px}
.kpi .lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:var(--mono)}
.kpi .val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:20px;margin-top:5px;letter-spacing:-.03em}
.kpi.wide{grid-column:1/-1}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;background:var(--surface2);border:1px solid var(--line);
  border-radius:999px;padding:7px 13px;font-size:13.5px;color:var(--muted);
}
.chip.is-active{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}

/* ---------- Produktliste ---------- */
.row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;
}
.row:active{background:var(--surface2)}
.thumb{
  width:46px;height:46px;border-radius:10px;flex:0 0 auto;object-fit:cover;
  background:var(--surface2);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--muted);font-size:16px;
}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-end{text-align:right;flex:0 0 auto}
.row-end .big{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:16px}
.row-end .small{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.low{color:var(--neg)!important}
.badge{
  display:inline-block;font-size:10.5px;font-family:var(--mono);letter-spacing:.08em;
  text-transform:uppercase;padding:2px 6px;border-radius:5px;
  background:var(--surface2);border:1px solid var(--line);color:var(--muted);
}
.badge.warn{color:var(--signal);border-color:rgba(255,90,31,.4)}

/* ---------- Rang-Liste ---------- */
.rank{display:flex;align-items:center;gap:12px;padding:11px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.rank-no{
  font-family:var(--mono);font-size:13px;width:26px;flex:0 0 auto;text-align:center;
  color:var(--muted);border-right:1px solid var(--line);padding-right:8px;
}
.rank:nth-child(1) .rank-no{color:var(--signal);font-weight:700}

/* ---------- Beleg (Erfassung) ---------- */
.receipt{
  background:var(--paper);color:var(--paper-ink);
  border-radius:12px 12px 0 0;padding:18px 18px 10px;
  font-family:var(--mono);position:relative;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}
.receipt-foot{
  height:11px;background:var(--paper);
  clip-path:polygon(0 0,100% 0,100% 0,96% 100%,92% 0,88% 100%,84% 0,80% 100%,76% 0,72% 100%,68% 0,64% 100%,60% 0,56% 100%,52% 0,48% 100%,44% 0,40% 100%,36% 0,32% 100%,28% 0,24% 100%,20% 0,16% 100%,12% 0,8% 100%,4% 0,0 100%);
}
.receipt-head{text-align:center;border-bottom:1px dashed var(--paper-line);padding-bottom:10px;margin-bottom:6px}
.receipt-head .t{font-size:13px;letter-spacing:.22em;text-transform:uppercase;font-weight:700}
.receipt-head .d{font-size:11px;color:#6C645A;margin-top:2px;letter-spacing:.06em}
.rline{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dotted var(--paper-line)}
.rline label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#6C645A;flex:0 0 82px}
.rline input,.rline select{
  flex:1;min-width:0;background:transparent;border:0;color:var(--paper-ink);
  font-family:var(--mono);font-size:15px;text-align:right;padding:2px 0;
  -webkit-appearance:none;appearance:none;
}
.rline select{text-align:right;text-align-last:right;padding-right:2px}
.rline input:focus,.rline select:focus{outline:0;box-shadow:0 2px 0 var(--signal)}
.rtotal{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0 2px;border-top:2px solid var(--paper-ink);margin-top:8px}
.rtotal .l{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.rtotal .v{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums}
.rprofit{display:flex;justify-content:space-between;font-size:12.5px;color:#6C645A;padding-bottom:8px}
.rprofit .g{color:#1E7A4F;font-weight:700}
.rprofit .r{color:#B0342F;font-weight:700}

.seg{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:13px;color:var(--muted);font-weight:560}
.seg button.is-active{background:var(--signal);color:#12100E;font-weight:680}

/* ---------- Chart ---------- */
.chart{width:100%;height:auto;display:block}
.chart .bar-r{fill:var(--surface2)}
.chart .bar-p{fill:var(--signal)}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:9px}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);font-family:var(--mono);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ---------- Tabbar ---------- */
#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(14,16,19,.9);
  backdrop-filter:saturate(160%) blur(16px);
  -webkit-backdrop-filter:saturate(160%) blur(16px);
  border-top:1px solid var(--line);
  padding-bottom:var(--safe-bottom);
}
.tab{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 2px 8px;font-size:10.5px;color:var(--muted);letter-spacing:.01em;
}
.tab-ico{font-size:16px;line-height:1}
.tab.is-active{color:var(--signal)}

/* ---------- Sheet ---------- */
.sheet{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sheet-panel{
  position:relative;width:100%;max-height:92vh;overflow-y:auto;
  background:var(--bg);border-top:1px solid var(--line);
  border-radius:20px 20px 0 0;
  padding:0 16px calc(20px + var(--safe-bottom));
  animation:up .22s cubic-bezier(.2,.8,.2,1);
  -webkit-overflow-scrolling:touch;
}
@keyframes up{from{transform:translateY(14%)}to{transform:none}}
.sheet-head{
  position:sticky;top:0;background:var(--bg);z-index:2;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 0 12px;border-bottom:1px solid var(--line);margin-bottom:14px;
}
.sheet-head h2{font-size:19px}

.field{margin-bottom:11px}
.field label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:var(--mono);margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:11px 12px;font-size:16px;-webkit-appearance:none;appearance:none;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--signal);outline-offset:-1px}
.field-2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.photo-pick{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.photo-pick img,.photo-pick .ph{
  width:64px;height:64px;border-radius:12px;object-fit:cover;
  background:var(--surface2);border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:20px;
}
.photo-pick .acts{display:flex;flex-direction:column;gap:6px;flex:1}
.photo-pick .acts button{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:13px}

.ledger{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.ledger:last-child{border-bottom:0}
.ledger .lm{min-width:0}
.ledger .ld{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.ledger .lv{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

.toast{
  position:fixed;left:50%;bottom:calc(84px + var(--safe-bottom));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;
  font-size:14px;font-weight:600;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.4);
}

/* ---------- Start / Login ---------- */
.boot{
  position:fixed;inset:0;z-index:300;display:grid;place-content:center;
  gap:10px;justify-items:center;background:var(--bg);
}
.boot-mark{
  width:62px;height:62px;border-radius:16px;background:var(--signal);color:#12100E;
  display:grid;place-items:center;font-size:26px;
}
.boot-text{font-family:var(--mono);font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.boot[hidden]{display:none}

.auth{
  position:fixed;inset:0;z-index:200;overflow-y:auto;background:var(--bg);
  padding:calc(var(--safe-top) + 28px) 20px calc(var(--safe-bottom) + 28px);
}
.auth[hidden]{display:none}
.auth-card{max-width:420px;margin:0 auto}
.auth-mark{
  width:54px;height:54px;border-radius:15px;background:var(--signal);color:#12100E;
  display:grid;place-items:center;font-size:23px;margin-bottom:18px;
}
.auth-title{font-size:30px;letter-spacing:-.03em}
.auth-sub{color:var(--muted);font-size:14.5px;margin:6px 0 20px}
.auth-error{
  background:rgba(255,91,91,.1);border:1px solid rgba(255,91,91,.35);color:var(--neg);
  border-radius:11px;padding:10px 12px;font-size:14px;margin:0 0 12px;
}
.auth-error[hidden]{display:none}
.auth-note{color:var(--muted);font-size:12.5px;text-align:center;margin:14px 0 0}

.offbar{
  background:rgba(255,90,31,.12);border-bottom:1px solid rgba(255,90,31,.3);
  color:var(--signal);font-size:12.5px;font-family:var(--mono);

}
.offbar[hidden]{display:none}

/* ---------- Anfragen ---------- */

  border-top:1px solid var(--line);padding-top:10px}

  padding:3px 8px;border-radius:6px;white-space:nowrap;flex:0 0 auto}

</style>
<script src="config.js"></script>
</head>
<body>

<div id="boot" class="boot"><div class="boot-mark">▤</div><div class="boot-text">Lager</div></div>

<section id="auth" class="auth" hidden>
  <div class="auth-card">
    <div class="auth-mark">▤</div>
    <h1 class="auth-title">Lager</h1>
    <p class="auth-sub" id="authSub">Melde dich mit deinem Zugang an.</p>

    </div>

</div>

<div id="toast" class="toast" hidden></div>

<script>
/* =========================================================
   Lager — Warenwirtschaft mit Admin- und Lieferantenzugang
   Daten liegen in Supabase. Zugriffsrechte in der Datenbank.
   ========================================================= */

/* ---------- Supabase-Anbindung ---------- */
const SB = {
  url: (window.SUPABASE_URL || '').replace(/\/+$/, ''),
  key: window.SUPABASE_KEY || '',
  token: null,
  refresh: null,

  configured() {
    return this.url && this.key && !this.url.includes('DEIN-PROJEKT') && !this.key.includes('DEIN-ANON');
  },
  async authCall(path, body) {
    const r = await fetch(`${this.url}/auth/v1/${path}`, {
      method: 'POST',
      headers: { apikey: this.key, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error_description || d.msg || d.message || d.error || 'Anmeldung fehlgeschlagen');
    return d;
  },
  head(extra) {
    return Object.assign({
      apikey: this.key,
      Authorization: 'Bearer ' + (this.token || this.key),
      'Content-Type': 'application/json'
    }, extra || {});
  },
  async rest(path, opts) {
    opts = opts || {};
    const r = await fetch(`${this.url}/rest/v1/${path}`, {
      method: opts.method || 'GET',
      headers: this.head(opts.headers),
      body: opts.body
    });
    if (r.status === 401) { await Auth.tryRefresh(); throw new Error('Sitzung abgelaufen'); }
    if (!r.ok) throw new Error((await r.text()) || 'Serverfehler');
    if (r.status === 204) return null;
    return r.json();
  },
  select(t, q) { return this.rest(t + '?' + (q || 'select=*')); },
  insert(t, row) {
    return this.rest(t, { method: 'POST', headers: { Prefer: 'return=representation' }, body: JSON.stringify(row) });
  },
  update(t, id, patch) {
    return this.rest(`${t}?id=eq.${id}`, { method: 'PATCH', headers: { Prefer: 'return=representation' }, body: JSON.stringify(patch) });
  },
  remove(t, id) { return this.rest(`${t}?id=eq.${id}`, { method: 'DELETE' }); }
};

/* ---------- Sitzung ---------- */
const Auth = {
  me: null,
  save(d) {
    SB.token = d.access_token; SB.refresh = d.refresh_token;
    try {
      localStorage.setItem('lager_session', JSON.stringify({ a: d.access_token, r: d.refresh_token }));
    } catch (e) { }
  },
  load() {
    try {
      const s = JSON.parse(localStorage.getItem('lager_session') || 'null');
      if (s) { SB.token = s.a; SB.refresh = s.r; return true; }
    } catch (e) { }
    return false;
  },
  clear() {
    SB.token = null; SB.refresh = null; this.me = null;
    try { localStorage.removeItem('lager_session'); } catch (e) { }
  },
  async tryRefresh() {
    if (!SB.refresh) return false;
    try {
      const d = await SB.authCall('token?grant_type=refresh_token', { refresh_token: SB.refresh });
      this.save(d); return true;
    } catch (e) { this.clear(); return false; }
  },
  async login(email, password) {
    const d = await SB.authCall('token?grant_type=password', { email: email.trim(), password });
    this.save(d);
    return this.loadProfile();
  },
  async signup(email, password, name, code) {
    await SB.authCall('signup', {
      email: email.trim(), password,
      data: { name: name.trim(), code: code.trim() }
    });
    return this.login(email, password);
  },
  uid() {
    try {
      const p = JSON.parse(atob(SB.token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
      return p.sub;
    } catch (e) { return null; }
  },
  async loadProfile() {
    const id = this.uid();
    if (!id) throw new Error('Sitzung ungültig');
    const rows = await SB.select('profiles', `select=*&id=eq.${id}`);
    if (!rows || !rows.length) throw new Error('Profil nicht gefunden. Wurde das SQL-Skript ausgeführt?');
    this.me = rows[0];
    return this.me;
  },
  isAdmin() { return this.me && this.me.role === 'admin'; }
};

/* ---------- Offline-Zwischenspeicher ---------- */
const Cache = {
  db: null,
  open() {
    return new Promise(res => {
      const r = indexedDB.open('lagercache', 1);
      r.onupgradeneeded = e => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains('snap')) d.createObjectStore('snap');
      };
      r.onsuccess = e => { this.db = e.target.result; res(true); };
      r.onerror = () => res(false);
    });
  },
  put(key, val) {
    if (!this.db) return Promise.resolve();
    return new Promise(res => {
      try {
        const q = this.db.transaction('snap', 'readwrite').objectStore('snap').put(val, key);
        q.onsuccess = () => res(); q.onerror = () => res();
      } catch (e) { res(); }
    });
  },
  get(key) {
    if (!this.db) return Promise.resolve(null);
    return new Promise(res => {
      try {
        const q = this.db.transaction('snap', 'readonly').objectStore('snap').get(key);
        q.onsuccess = () => res(q.result || null); q.onerror = () => res(null);
      } catch (e) { res(null); }
    });
  }
};

/* ---------- Zustand ---------- */
const S = { products: [], movements: [], partners: [], payments: [], requests: [], catalog: [] };
let tab = 'stock';
let offlineSince = null;
const query = {};
let period = 'month';
let statsYear = new Date().getFullYear();
let entryType = 'sale';
const entryDraft = { productId: '', qty: '', unitPrice: '', date: today(), partnerId: '' };

/* ---------- Helfer ---------- */
const eur = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' });
const num = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 2 });
const money = v => eur.format(+v || 0);
function today() { return new Date().toISOString().slice(0, 10); }
function deDate(iso) { if (!iso) return ''; const p = String(iso).slice(0, 10).split('-'); return `${p[2]}.${p[1]}.${p[0]}`; }
const MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const MON3 = ['J', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D'];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').toLowerCase();
const byId = (arr, id) => arr.find(x => x.id === id);
const n2 = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
const f2 = v => (Math.round((+v || 0) * 100) / 100).toFixed(2).replace('.', ',');

const TYPE_LABEL = { purchase: 'Einkauf', sale: 'Verkauf', consign: 'Ausgabe', return: 'Rückgabe' };
const OUT = ['sale', 'consign'];
const IN = ['purchase', 'return'];

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.hidden = true; }, 2200);
}
function fail(e) {
  let m = (e && e.message) || String(e);
  if (m.length > 160) m = m.slice(0, 160) + '…';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) m = 'Keine Verbindung';
  toast(m);
}

/* ---------- Berechnungen (nur Admin) ---------- */
function stockOf(pid) {
  let n = 0;
  for (const m of S.movements) {
    if (m.product_id !== pid) continue;
    if (IN.includes(m.type)) n += +m.qty; else n -= +m.qty;
  }
  return n;
}
const profitOf = m => m.type === 'return' ? -((m.unit_price - m.cost_price) * m.qty)
  : OUT.includes(m.type) ? (m.unit_price - m.cost_price) * m.qty : 0;
const revenueOf = m => m.type === 'return' ? -(m.unit_price * m.qty)
  : OUT.includes(m.type) ? m.unit_price * m.qty : 0;
const cogsOf = m => m.type === 'return' ? -(m.cost_price * m.qty)
  : OUT.includes(m.type) ? m.cost_price * m.qty : 0;
const unitsOf = m => m.type === 'return' ? -m.qty : OUT.includes(m.type) ? +m.qty : 0;

function periodRange(p) {
  const now = new Date(), y = now.getFullYear(), mo = now.getMonth(), d = now.getDate();
  const iso = dt => dt.toISOString().slice(0, 10);
  if (p === 'today') return [iso(new Date(y, mo, d)), iso(new Date(y, mo, d))];
  if (p === 'week') { const dow = (now.getDay() + 6) % 7; return [iso(new Date(y, mo, d - dow)), iso(new Date(y, mo, d - dow + 6))]; }
  if (p === 'month') return [iso(new Date(y, mo, 1)), iso(new Date(y, mo + 1, 0))];
  if (p === 'year') return [`${y}-01-01`, `${y}-12-31`];
  return ['0000-01-01', '9999-12-31'];
}
const inPeriod = (m, p) => { const r = periodRange(p); const d = String(m.date).slice(0, 10); return d >= r[0] && d <= r[1]; };

function partnerBalance(pid) {
  let credit = 0, debt = 0;
  for (const m of S.movements) {
    if (m.partner_id !== pid) continue;
    const v = m.unit_price * m.qty;
    if (m.type === 'consign') credit += v;
    else if (m.type === 'return') credit -= v;
    else if (m.type === 'purchase') debt += v;
  }
  for (const p of S.payments) {
    if (p.partner_id !== pid) continue;
    if (p.direction === 'in') credit -= +p.amount; else debt -= +p.amount;
  }
  return { credit, debt, net: credit - debt };
}
const stockValue = () => S.products.reduce((s, p) => s + stockOf(p.id) * (+p.buy_price || 0), 0);
const openReceivables = () => S.partners.reduce((s, p) => { const n = partnerBalance(p.id).net; return s + (n > 0 ? n : 0); }, 0);

/* ---------- Laden ---------- */
async function loadData() {
  try {
    if (Auth.isAdmin()) {
      const [products, movements, partners, payments, requests] = await Promise.all([
        SB.select('products', 'select=*&order=name'),
        SB.select('movements', 'select=*&order=date.desc'),
        SB.select('profiles', 'select=*&order=name'),
        SB.select('payments', 'select=*'),
        SB.select('requests', 'select=*&order=created_at.desc')
      ]);
      Object.assign(S, { products, movements, partners, payments, requests });
    } else {
      const [catalog, requests] = await Promise.all([
        SB.select('catalog', 'select=*&order=name'),
        SB.select('requests', 'select=*&order=created_at.desc')
      ]);
      Object.assign(S, { catalog, requests });
    }
    offlineSince = null;
    await Cache.put('data', { at: new Date().toISOString(), role: Auth.me.role, S: JSON.parse(JSON.stringify(S)) });
  } catch (e) {
    const snap = await Cache.get('data');
    if (snap && snap.role === Auth.me.role) {
      Object.assign(S, snap.S);
      offlineSince = snap.at;
    } else throw e;
  }
  const bar = document.getElementById('offlineBar');
  bar.hidden = !offlineSince;
  if (offlineSince) bar.textContent = 'Offline — Stand ' + deDate(offlineSince) + ', keine Änderungen möglich';
}
function requireOnline() {
  if (offlineSince) { toast('Offline — geht gerade nicht'); return false; }
  return true;
}

/* ---------- Tabs je Rolle ---------- */
const ADMIN_TABS = [
  ['stock', '▤', 'Lager'], ['entry', '✚', 'Erfassung'], ['finance', '€', 'Finanzen'],
  ['partners', '⇄', 'Partner'], ['stats', '▮', 'Statistik']
];
const SUP_TABS = [['catalog', '▤', 'Katalog'], ['myreq', '✚', 'Anfragen']];
const TITLES = {
  stock: 'Lager', entry: 'Erfassung', finance: 'Finanzen', partners: 'Partner',
  stats: 'Statistik', catalog: 'Katalog', myreq: 'Meine Anfragen'
};
const PLACEHOLDER = {
  stock: 'Produkt, Marke, Kategorie', entry: 'Buchungen durchsuchen', finance: 'Produkt suchen',
  partners: 'Partner oder Anfrage', stats: 'Produkt oder Partner',
  catalog: 'Produkt oder Marke', myreq: 'Anfragen durchsuchen'
};

function buildTabs() {
  const list = Auth.isAdmin() ? ADMIN_TABS : SUP_TABS;
  tab = list[0][0];
  const bar = document.getElementById('tabbar');
  bar.style.gridTemplateColumns = `repeat(${list.length},1fr)`;
  bar.innerHTML = list.map(([k, i, l]) =>
    `<button class="tab" data-tab="${k}"><span class="tab-ico">${i}</span>${l}</button>`).join('');
}

function render() {
  document.getElementById('viewTitle').textContent = TITLES[tab];
  const s = document.getElementById('search');
  s.placeholder = PLACEHOLDER[tab] || 'Suchen';
  if (s.value !== (query[tab] || '')) s.value = query[tab] || '';
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('is-active', b.dataset.tab === tab));
  const fn = { stock: renderStock, entry: renderEntry, finance: renderFinance, partners: renderPartners,
    stats: renderStats, catalog: renderCatalog, myreq: renderMyRequests }[tab];
  document.getElementById('main').innerHTML = '<div class="view">' + fn() + '</div>';
  const w = { entry: wireEntry, finance: wireFinance, partners: wirePartners, stats: wireStats,
    stock: wireStock, catalog: wireCatalog, myreq: wireMyRequests }[tab];
  if (w) w();
}
const q = () => norm(query[tab]);
const emptyBox = (t, x) => `<div class="empty"><b>${esc(t)}</b>${esc(x)}</div>`;

/* =========================================================
   ADMIN-ANSICHTEN
   ========================================================= */

/* ----- Lager ----- */
function renderStock() {
  let list = S.products.slice();
  if (q()) list = list.filter(p => norm(p.name).includes(q()) || norm(p.brand).includes(q()) || norm(p.category).includes(q()));
  const units = S.products.reduce((s, p) => s + Math.max(0, stockOf(p.id)), 0);
  const low = S.products.filter(p => stockOf(p.id) <= (+p.min_stock || 0)).length;
  return `
    <div class="kpis">
      <div class="kpi"><div class="lab">Artikel im Lager</div><div class="val">${num.format(units)}</div></div>
      <div class="kpi"><div class="lab">Lagerwert</div><div class="val">${money(stockValue())}</div></div>
    </div>
    <button class="btn" id="newProduct" style="margin-top:10px">Neues Produkt anlegen</button>
    ${low ? `<p class="dim" style="font-size:13px;margin:12px 0 0">${low} Produkt(e) unter Mindestbestand.</p>` : ''}
    <div class="eyebrow">${q() ? 'Treffer · ' + list.length : 'Produkte · ' + S.products.length}</div>
    <div class="stack">${list.length ? list.map(productRow).join('')
      : emptyBox(S.products.length ? 'Keine Treffer' : 'Noch keine Produkte',
        S.products.length ? 'Andere Suche versuchen.' : 'Leg dein erstes Produkt an.')}</div>`;
}
function productRow(p) {
  const st = stockOf(p.id), lowFlag = st <= (+p.min_stock || 0);
  return `<button class="row" data-pid="${p.id}">
    ${p.photo ? `<img class="thumb" src="${p.photo}" alt="">` : '<div class="thumb">▤</div>'}
    <div class="row-main"><div class="row-title">${esc(p.name)}</div>
      <div class="row-sub">${[p.brand, p.category].filter(Boolean).map(esc).join(' · ') || 'Ohne Marke'} · VK ${money(p.sell_price)}</div></div>
    <div class="row-end"><div class="big ${lowFlag ? 'low' : ''}">${num.format(st)}</div><div class="small">Stück</div></div>
  </button>`;
}
function wireStock() {
  document.getElementById('newProduct').onclick = () => productSheet(null);
  document.querySelectorAll('[data-pid]').forEach(el =>
    el.onclick = () => productSheet(byId(S.products, el.dataset.pid)));
}

/* ----- Erfassung ----- */
function renderEntry() {
  let last = S.movements.slice();
  if (q()) last = last.filter(m => {
    const p = byId(S.products, m.product_id), pa = byId(S.partners, m.partner_id);
    return norm(p && p.name).includes(q()) || norm(pa && pa.name).includes(q()) || norm(TYPE_LABEL[m.type]).includes(q());
  });
  last = last.slice(0, 40);
  const opts = S.products.map(p =>
    `<option value="${p.id}" ${p.id === entryDraft.productId ? 'selected' : ''}>${esc(p.name)}${p.brand ? ' · ' + esc(p.brand) : ''}</option>`).join('');
  const pOpts = S.partners.filter(p => p.role === 'supplier').map(p =>
    `<option value="${p.id}" ${p.id === entryDraft.partnerId ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
  return `
    <div class="seg" id="segType">${Object.entries(TYPE_LABEL).map(([k, v]) =>
      `<button data-t="${k}" class="${k === entryType ? 'is-active' : ''}">${v}</button>`).join('')}</div>
    <div class="receipt">
      <div class="receipt-head"><div class="t">${TYPE_LABEL[entryType]}</div>
        <div class="d">Beleg-Entwurf · ${deDate(entryDraft.date)}</div></div>
      <div class="rline"><label>Produkt</label><select id="fProd">${S.products.length
        ? '<option value="">— wählen —</option>' + opts : '<option value="">Erst Produkt anlegen</option>'}</select></div>
      <div class="rline"><label>Menge</label><input id="fQty" type="number" inputmode="decimal" min="0" step="1" placeholder="0" value="${esc(entryDraft.qty)}"></div>
      <div class="rline"><label>Stückpreis</label><input id="fPrice" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0,00" value="${esc(entryDraft.unitPrice)}"></div>
      <div class="rline"><label>Datum</label><input id="fDate" type="date" value="${entryDraft.date}"></div>
      <div class="rline"><label>Partner</label><select id="fPartner"><option value="">— ohne —</option>${pOpts}</select></div>
      <div id="rTotals">${totalsHTML()}</div>
    </div>
    <div class="receipt-foot"></div>
    <button class="btn" id="saveMove" style="margin-top:14px">Buchung speichern</button>
    <div class="eyebrow">Letzte Buchungen</div>
    <div class="stack">${last.length ? last.map(moveRow).join('')
      : emptyBox('Noch nichts gebucht', 'Trag oben deine erste Bewegung ein.')}</div>`;
}
function totalsHTML() {
  const prod = byId(S.products, entryDraft.productId);
  const qty = n2(entryDraft.qty), price = n2(entryDraft.unitPrice);
  const cost = prod ? +prod.buy_price || 0 : 0;
  const profit = (price - cost) * qty, isOut = OUT.includes(entryType);
  const cur = prod ? stockOf(prod.id) : 0;
  return `
    <div class="rtotal"><span class="l">Summe</span><span class="v">${money(qty * price)}</span></div>
    <div class="rprofit"><span>${isOut ? 'Gewinn dieser Buchung' : entryType === 'purchase' ? 'Erhöht den Lagerwert' : 'Storniert eine Ausgabe'}</span>
      <span class="${profit >= 0 ? 'g' : 'r'}">${isOut ? money(profit) : '—'}</span></div>
    <div class="rprofit" style="border-top:1px dashed var(--paper-line);padding-top:8px">

async function saveMovement() {
  if (!requireOnline()) return;
  const p = byId(S.products, entryDraft.productId);
  if (!p) return toast('Produkt wählen');
  const qty = n2(entryDraft.qty);
  if (qty <= 0) return toast('Menge eintragen');
  try {
    const rows = await SB.insert('movements', {
      type: entryType, product_id: p.id, qty,
      unit_price: n2(entryDraft.unitPrice), cost_price: +p.buy_price || 0,
      date: entryDraft.date || today(), partner_id: entryDraft.partnerId || null

    S.movements.unshift(rows[0]);

/* ----- Finanzen ----- */
function renderFinance() {
  const inP = S.movements.filter(m => inPeriod(m, period));
  const rev = inP.reduce((s, m) => s + revenueOf(m), 0);
  const cogs = inP.reduce((s, m) => s + cogsOf(m), 0);
  const profit = rev - cogs;
  const buys = inP.filter(m => m.type === 'purchase').reduce((s, m) => s + m.unit_price * m.qty, 0);
  const margin = rev ? profit / rev * 100 : 0;
  const agg = {};
  inP.forEach(m => {
    if (!OUT.includes(m.type) && m.type !== 'return') return;
    const a = agg[m.product_id] || (agg[m.product_id] = { units: 0, rev: 0, profit: 0 });
    a.units += unitsOf(m); a.rev += revenueOf(m); a.profit += profitOf(m);
  });
  let best = Object.entries(agg).map(([id, a]) => Object.assign({ p: byId(S.products, id) }, a))
    .filter(x => x.p && x.units > 0).sort((a, b) => b.units - a.units);
  const sold = new Set(best.map(x => x.p.id));
  let slow = S.products.filter(p => !sold.has(p.id));
  if (q()) { best = best.filter(x => norm(x.p.name).includes(q())); slow = slow.filter(p => norm(p.name).includes(q())); }
  return `
    <div class="chips" id="periodChips">${[['today', 'Heute'], ['week', 'Woche'], ['month', 'Monat'], ['year', 'Jahr'], ['all', 'Gesamt']]
      .map(([k, l]) => `<button class="chip ${k === period ? 'is-active' : ''}" data-p="${k}">${l}</button>`).join('')}</div>
    <div class="kpis" style="margin-top:12px">
      <div class="kpi"><div class="lab">Umsatz</div><div class="val">${money(rev)}</div></div>
      <div class="kpi"><div class="lab">Gewinn</div><div class="val ${profit >= 0 ? 'pos' : 'neg'}">${money(profit)}</div></div>
      <div class="kpi"><div class="lab">Marge</div><div class="val">${num.format(margin.toFixed(1))} %</div></div>
      <div class="kpi"><div class="lab">Wareneinsatz</div><div class="val">${money(cogs)}</div></div>
      <div class="kpi"><div class="lab">Einkäufe</div><div class="val">${money(buys)}</div></div>
      <div class="kpi"><div class="lab">Lagerwert</div><div class="val">${money(stockValue())}</div></div>
      <div class="kpi wide"><div class="lab">Offene Forderungen</div>
        <div class="val ${openReceivables() > 0 ? 'neg' : ''}">${money(openReceivables())}</div></div>
    </div>
    <div class="eyebrow">Verlauf ${new Date().getFullYear()}</div>
    <div class="card">${monthChart(new Date().getFullYear())}
      <div class="legend"><span><i style="background:var(--surface2);border:1px solid var(--line)"></i>Umsatz</span>
        <span><i style="background:var(--signal)"></i>Gewinn</span></div></div>
    <div class="eyebrow">Meistverkauft im Zeitraum</div>
    <div class="stack">${best.length ? best.slice(0, 12).map((x, i) => `
      <div class="rank"><div class="rank-no">${i + 1}</div>
        <div class="row-main"><div class="row-title">${esc(x.p.name)}</div>
          <div class="row-sub">${num.format(x.units)} Stück · Umsatz ${money(x.rev)}</div></div>
        <div class="row-end"><div class="big ${x.profit >= 0 ? 'pos' : 'neg'}">${money(x.profit)}</div>
          <div class="small">Gewinn</div></div></div>`).join('')
      : emptyBox('Keine Verkäufe im Zeitraum', 'Wähle oben einen anderen Zeitraum.')}</div>
    <div class="eyebrow">Ladenhüter</div>
    <div class="stack">${slow.length ? slow.slice(0, 12).map(p => `
      <div class="row"><div class="row-main"><div class="row-title">${esc(p.name)}</div>
        <div class="row-sub">Bestand ${num.format(stockOf(p.id))} · gebunden ${money(stockOf(p.id) * (+p.buy_price || 0))}</div>
      </div></div>`).join('') : emptyBox('Alles bewegt sich', 'Jedes Produkt wurde im Zeitraum verkauft.')}</div>`;
}
function wireFinance() {
  document.getElementById('periodChips').onclick = e => {
    const b = e.target.closest('[data-p]'); if (!b) return; period = b.dataset.p; render();
  };
}
function monthChart(year) {
  const rev = Array(12).fill(0), pro = Array(12).fill(0);
  S.movements.forEach(m => {
    const d = String(m.date).slice(0, 10).split('-');
    if (+d[0] !== year) return;
    rev[+d[1] - 1] += revenueOf(m); pro[+d[1] - 1] += profitOf(m);
  });
  const max = Math.max(1, ...rev, ...pro), W = 340, H = 150, pad = 16, bw = (W - pad * 2) / 12;
  let out = '';
  for (let i = 0; i < 12; i++) {
    const hr = Math.max(0, rev[i] / max) * (H - 34), hp = Math.max(0, pro[i] / max) * (H - 34), x = pad + i * bw;
    out += `<rect class="bar-r" x="${x + 2}" y="${H - 20 - hr}" width="${bw - 8}" height="${hr}" rx="2"/>`;
    out += `<rect class="bar-p" x="${x + 2}" y="${H - 20 - hp}" width="${bw - 8}" height="${hp}" rx="2"/>`;
    out += `<text x="${x + (bw - 6) / 2}" y="${H - 7}" text-anchor="middle">${MON3[i]}</text>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${out}</svg>`;
}

function renderStats() {
  const years = [...new Set(S.movements.map(m => +String(m.date).slice(0, 4)))].sort((a, b) => b - a);
  if (years.length && !years.includes(statsYear)) statsYear = years[0];
  const ym = S.movements.filter(m => +String(m.date).slice(0, 4) === statsYear);
  const pa = {};
  ym.forEach(m => {
    if (!OUT.includes(m.type) && m.type !== 'return') return;
    const a = pa[m.product_id] || (pa[m.product_id] = { units: 0, rev: 0, profit: 0 });
    a.units += unitsOf(m); a.rev += revenueOf(m); a.profit += profitOf(m);
  });
  let topP = Object.entries(pa).map(([id, a]) => Object.assign({ p: byId(S.products, id) }, a))
    .filter(x => x.p && x.units > 0).sort((a, b) => b.units - a.units);
  if (q()) topP = topP.filter(x => norm(x.p.name).includes(q()) || norm(x.p.brand).includes(q()));
  topP = topP.slice(0, 10);
  const ta = {};
  ym.forEach(m => {
    if (!m.partner_id || (!OUT.includes(m.type) && m.type !== 'return')) return;
    const a = ta[m.partner_id] || (ta[m.partner_id] = { units: 0, rev: 0, profit: 0 });
    a.units += unitsOf(m); a.rev += revenueOf(m); a.profit += profitOf(m);
  });
  let topT = Object.entries(ta).map(([id, a]) => Object.assign({ pa: byId(S.partners, id) }, a))
    .filter(x => x.pa && x.units > 0).sort((a, b) => b.units - a.units);
  if (q()) topT = topT.filter(x => norm(x.pa.name).includes(q()));
  topT = topT.slice(0, 3);
  const ma = Array.from({ length: 12 }, () => ({ units: 0, rev: 0, profit: 0 }));
  ym.forEach(m => {

      : emptyBox('Keine Daten für ' + statsYear, 'Sobald du Verkäufe buchst, erscheint hier die Rangliste.')}</div>

            });

          if (i >= 0) S.products[i] = rows[0];

        closeSheet(); toast(isNew ? 'Produkt angelegt' : 'Gespeichert'); render();

        S.movements = S.movements.filter(m => m.product_id !== p.id);
        closeSheet(); toast('Gelöscht'); render();
      } catch (e) { fail(e); }
    };
  });
}
function shrink(file) {
  return new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const max = 700, sc = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.65));
      };
      im.onerror = () => res('');
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

const elBoot = document.getElementById('boot');
const elAuth = document.getElementById('auth');
const elApp = document.getElementById('app');
let authMode = 'login';

function showAuth(msg) {
  elBoot.hidden = true; elApp.hidden = true; elAuth.hidden = false;
  if (msg) authError(msg);
}
function authError(m) {
  const e = document.getElementById('auErr');
  if (!m) { e.hidden = true; return; }
  e.textContent = m; e.hidden = false;
}
document.getElementById('authSeg').onclick = e => {
  const b = e.target.closest('[data-m]'); if (!b) return;
  authMode = b.dataset.m;
  document.querySelectorAll('#authSeg button').forEach(x => x.classList.toggle('is-active', x.dataset.m === authMode));
  document.getElementById('signupOnly').hidden = authMode !== 'signup';
  document.getElementById('auGo').textContent = authMode === 'signup' ? 'Konto erstellen' : 'Anmelden';
  document.getElementById('auPass').autocomplete = authMode === 'signup' ? 'new-password' : 'current-password';
  authError(null);
};
document.getElementById('auGo').onclick = async () => {
  const btn = document.getElementById('auGo');
  const email = document.getElementById('auEmail').value;
  const pass = document.getElementById('auPass').value;
  if (!email || !pass) return authError('E-Mail und Passwort eingeben');
  btn.disabled = true; btn.textContent = 'Moment…'; authError(null);
  try {
    if (authMode === 'signup') {
      const name = document.getElementById('auName').value;
      const code = document.getElementById('auCode').value;
      if (!name.trim()) throw new Error('Name eingeben');
      if (!code.trim()) throw new Error('Einladungscode eingeben');
      await Auth.signup(email, pass, name, code);
    } else {
      await Auth.login(email, pass);
    }
    await startApp();
  } catch (e) {
    let m = e.message || 'Fehler';
    if (/Invalid login/i.test(m)) m = 'E-Mail oder Passwort stimmt nicht';
    if (/Ungueltiger Einladungscode|invalid.*code/i.test(m)) m = 'Einladungscode stimmt nicht';
    if (/already registered/i.test(m)) m = 'Diese E-Mail hat schon ein Konto';
    if (/Database error saving new user|unexpected_failure/i.test(m)) m = 'Einladungscode stimmt nicht — oder das SQL-Skript wurde noch nicht ausgeführt';
    if (/Email not confirmed/i.test(m)) m = 'E-Mail-Bestätigung ist noch aktiv. In Supabase unter Authentication → Providers → Email "Confirm email" ausschalten.';
    if (/Password should be/i.test(m)) m = 'Passwort zu kurz (mindestens 6 Zeichen)';
    if (/Failed to fetch|Load failed/i.test(m)) m = 'Keine Verbindung zum Server. Stimmen URL und Schlüssel in config.js?';
    authError(m);
  } finally {
    btn.disabled = false;
    btn.textContent = authMode === 'signup' ? 'Konto erstellen' : 'Anmelden';
  }
};

async function startApp() {
  elAuth.hidden = true; elBoot.hidden = false;
  buildTabs();
  try { await loadData(); } catch (e) { elBoot.hidden = true; return showAuth('Daten konnten nicht geladen werden: ' + (e.message || '')); }
  elBoot.hidden = true; elApp.hidden = false;
  render();
}

document.getElementById('tabbar').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  tab = b.dataset.tab; window.scrollTo(0, 0); render();
});
document.getElementById('search').addEventListener('input', e => { query[tab] = e.target.value; render(); });
document.getElementById('menuBtn').addEventListener('click', menuSheet);

(async function boot() {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
  if (!SB.configured()) {
    elBoot.hidden = true;
    document.body.innerHTML = '<div style="padding:60px 24px;max-width:460px;margin:0 auto;font-family:-apple-system,sans-serif;color:#EAEEF3">'
      + '<h1 style="font-size:22px">Noch nicht eingerichtet</h1>'
      + '<p style="color:#8B95A3;line-height:1.55">Trag in der Datei <b>config.js</b> deine Supabase-Projekt-URL und den anon-Schlüssel ein. '
      + 'Du findest beides in Supabase unter Settings → API.</p></div>';
    return;
  }
  await Cache.open();
  if (Auth.load()) {
    try {
      await Auth.loadProfile();
      return startApp();
    } catch (e) {
      if (await Auth.tryRefresh()) {
        try { await Auth.loadProfile(); return startApp(); } catch (e2) { }
      }
      Auth.clear();
    }
  }
  showAuth(null);
})();

</script>
</body>
</html>

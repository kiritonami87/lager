<style>
:root{
  --bg:#0E1013;
  --surface:#161A20;
  --surface2:#1D222A;
  --line:#2A313C;
  --ink:#EAEEF3;
  --muted:#8B95A3;
  --signal:#FF5A1F;
  --pos:#37C98A;
  --neg:#FF5B5B;
  --paper:#F1ECE2;
  --paper-ink:#171412;
  --paper-line:#C9C0B1;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.4;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.02em}
a{color:var(--signal)}

/* ---------- Topbar ---------- */
#topbar{
  position:sticky;top:0;z-index:40;
  padding:calc(var(--safe-top) + 10px) 16px 10px;
  background:rgba(14,16,19,.86);
  backdrop-filter:saturate(160%) blur(14px);
  -webkit-backdrop-filter:saturate(160%) blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
#viewTitle{font-size:26px}
.icon-btn{
  width:36px;height:36px;border-radius:10px;color:var(--muted);
  display:grid;place-items:center;font-size:15px;background:var(--surface2);
}
.icon-btn:active{background:var(--line)}
.searchwrap{margin-top:10px}
#search{
  width:100%;background:var(--surface2);border:1px solid var(--line);
  border-radius:11px;padding:9px 12px;font-size:15px;
  -webkit-appearance:none;appearance:none;
}
#search::placeholder{color:var(--muted)}
#search:focus{outline:2px solid var(--signal);outline-offset:-1px}

/* ---------- Layout ---------- */
#main{padding:14px 16px calc(96px + var(--safe-bottom))}
.view{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin:22px 0 8px;
}
.eyebrow:first-child{margin-top:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:8px}

.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pos{color:var(--pos)}
.neg{color:var(--neg)}
.dim{color:var(--muted)}

.btn{
  background:var(--signal);color:#12100E;font-weight:680;
  border-radius:12px;padding:13px 16px;width:100%;text-align:center;
  letter-spacing:-.01em;
}
.btn:active{filter:brightness(.9)}
.btn-ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line);font-weight:560}
.btn-danger{background:transparent;color:var(--neg);border:1px solid var(--neg)}
.btn-row{display:flex;gap:8px;margin-top:12px}

.empty{
  border:1px dashed var(--line);border-radius:var(--r);padding:26px 18px;
  text-align:center;color:var(--muted);font-size:14px;
}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px;font-weight:600}

/* ---------- Kennzahlen ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px}
.kpi .lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:var(--mono)}
.kpi .val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:20px;margin-top:5px;letter-spacing:-.03em}
.kpi.wide{grid-column:1/-1}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;background:var(--surface2);border:1px solid var(--line);
  border-radius:999px;padding:7px 13px;font-size:13.5px;color:var(--muted);
}
.chip.is-active{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}

/* ---------- Produktliste ---------- */
.row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;
}
.row:active{background:var(--surface2)}
.thumb{
  width:46px;height:46px;border-radius:10px;flex:0 0 auto;object-fit:cover;
  background:var(--surface2);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--muted);font-size:16px;
}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-end{text-align:right;flex:0 0 auto}
.row-end .big{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:16px}
.row-end .small{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.low{color:var(--neg)!important}
.badge{
  display:inline-block;font-size:10.5px;font-family:var(--mono);letter-spacing:.08em;
  text-transform:uppercase;padding:2px 6px;border-radius:5px;
  background:var(--surface2);border:1px solid var(--line);color:var(--muted);
}
.badge.warn{color:var(--signal);border-color:rgba(255,90,31,.4)}

/* ---------- Rang-Liste ---------- */
.rank{display:flex;align-items:center;gap:12px;padding:11px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.rank-no{
  font-family:var(--mono);font-size:13px;width:26px;flex:0 0 auto;text-align:center;
  color:var(--muted);border-right:1px solid var(--line);padding-right:8px;
}
.rank:nth-child(1) .rank-no{color:var(--signal);font-weight:700}

/* ---------- Beleg (Erfassung) ---------- */
.receipt{
  background:var(--paper);color:var(--paper-ink);
  border-radius:12px 12px 0 0;padding:18px 18px 10px;
  font-family:var(--mono);position:relative;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}
.receipt-foot{
  height:11px;background:var(--paper);
  clip-path:polygon(0 0,100% 0,100% 0,96% 100%,92% 0,88% 100%,84% 0,80% 100%,76% 0,72% 100%,68% 0,64% 100%,60% 0,56% 100%,52% 0,48% 100%,44% 0,40% 100%,36% 0,32% 100%,28% 0,24% 100%,20% 0,16% 100%,12% 0,8% 100%,4% 0,0 100%);
}
.receipt-head{text-align:center;border-bottom:1px dashed var(--paper-line);padding-bottom:10px;margin-bottom:6px}
.receipt-head .t{font-size:13px;letter-spacing:.22em;text-transform:uppercase;font-weight:700}
.receipt-head .d{font-size:11px;color:#6C645A;margin-top:2px;letter-spacing:.06em}
.rline{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dotted var(--paper-line)}
.rline label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#6C645A;flex:0 0 82px}
.rline input,.rline select{
  flex:1;min-width:0;background:transparent;border:0;color:var(--paper-ink);
  font-family:var(--mono);font-size:15px;text-align:right;padding:2px 0;
  -webkit-appearance:none;appearance:none;
}
.rline select{text-align:right;text-align-last:right;padding-right:2px}
.rline input:focus,.rline select:focus{outline:0;box-shadow:0 2px 0 var(--signal)}
.rtotal{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0 2px;border-top:2px solid var(--paper-ink);margin-top:8px}
.rtotal .l{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.rtotal .v{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums}
.rprofit{display:flex;justify-content:space-between;font-size:12.5px;color:#6C645A;padding-bottom:8px}
.rprofit .g{color:#1E7A4F;font-weight:700}
.rprofit .r{color:#B0342F;font-weight:700}

.seg{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:13px;color:var(--muted);font-weight:560}
.seg button.is-active{background:var(--signal);color:#12100E;font-weight:680}

/* ---------- Chart ---------- */
.chart{width:100%;height:auto;display:block}
.chart .bar-r{fill:#465062}
.chart .bar-p{fill:var(--signal)}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:9px}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);font-family:var(--mono);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ---------- Tabbar ---------- */
#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(14,16,19,.9);
  backdrop-filter:saturate(160%) blur(16px);
  -webkit-backdrop-filter:saturate(160%) blur(16px);
  border-top:1px solid var(--line);
  padding-bottom:var(--safe-bottom);
}
.tab{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 2px 8px;font-size:10.5px;color:var(--muted);letter-spacing:.01em;
}
.tab-ico{font-size:16px;line-height:1}
.tab.is-active{color:var(--signal)}

/* ---------- Sheet ---------- */
.sheet{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sheet-panel{
  position:relative;width:100%;max-height:92vh;overflow-y:auto;
  background:var(--bg);border-top:1px solid var(--line);
  border-radius:20px 20px 0 0;
  padding:0 16px calc(20px + var(--safe-bottom));
  animation:up .22s cubic-bezier(.2,.8,.2,1);
  -webkit-overflow-scrolling:touch;
}
@keyframes up{from{transform:translateY(14%)}to{transform:none}}
.sheet-head{
  position:sticky;top:0;background:var(--bg);z-index:2;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 0 12px;border-bottom:1px solid var(--line);margin-bottom:14px;
}
.sheet-head h2{font-size:19px}

.field{margin-bottom:11px}
.field label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:var(--mono);margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:11px 12px;font-size:16px;-webkit-appearance:none;appearance:none;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--signal);outline-offset:-1px}
.field-2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.photo-pick{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.photo-pick img,.photo-pick .ph{
  width:64px;height:64px;border-radius:12px;object-fit:cover;
  background:var(--surface2);border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:20px;
}
.photo-pick .acts{display:flex;flex-direction:column;gap:6px;flex:1}
.photo-pick .acts button{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:13px}

.ledger{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.ledger:last-child{border-bottom:0}
.ledger .lm{min-width:0}
.ledger .ld{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.ledger .lv{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

.toast{
  position:fixed;left:50%;bottom:calc(84px + var(--safe-bottom));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;
  font-size:14px;font-weight:600;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.4);
}

/* ---------- Start / Login ---------- */
.boot{
  position:fixed;inset:0;z-index:300;display:grid;place-content:center;
  gap:10px;justify-items:center;background:var(--bg);
}
.boot-mark{
  width:62px;height:62px;border-radius:16px;background:var(--signal);color:#12100E;
  display:grid;place-items:center;font-size:26px;
}
.boot-text{font-family:var(--mono);font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.boot[hidden]{display:none}

.auth{
  position:fixed;inset:0;z-index:200;overflow-y:auto;background:var(--bg);
  padding:calc(var(--safe-top) + 28px) 20px calc(var(--safe-bottom) + 28px);
}
.auth[hidden]{display:none}
.auth-card{max-width:420px;margin:0 auto}
.auth-mark{
  width:54px;height:54px;border-radius:15px;background:var(--signal);color:#12100E;
  display:grid;place-items:center;font-size:23px;margin-bottom:18px;
}
.auth-title{font-size:30px;letter-spacing:-.03em}
.auth-sub{color:var(--muted);font-size:14.5px;margin:6px 0 20px}
.auth-error{
  background:rgba(255,91,91,.1);border:1px solid rgba(255,91,91,.35);color:var(--neg);
  border-radius:11px;padding:10px 12px;font-size:14px;margin:0 0 12px;
}
.auth-error[hidden]{display:none}
.auth-note{color:var(--muted);font-size:12.5px;text-align:center;margin:14px 0 0}

.offbar{
  background:rgba(255,90,31,.12);border-bottom:1px solid rgba(255,90,31,.3);
  color:var(--signal);font-size:12.5px;font-family:var(--mono);
  padding:7px 16px;text-align:center;
}
.offbar[hidden]{display:none}

/* ---------- Anfragen ---------- */
.req{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px}
.req-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.req-title{font-weight:600;font-size:15.5px}
.req-meta{font-size:12.5px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.req-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 0;
  border-top:1px solid var(--line);padding-top:10px}
.req-grid div{font-size:12px;color:var(--muted);font-family:var(--mono)}
.req-grid b{display:block;color:var(--ink);font-size:15px;margin-top:3px;font-variant-numeric:tabular-nums}
.req-text{font-size:14px;color:var(--ink);background:var(--surface2);border-radius:9px;padding:9px 11px;margin-top:9px}
.st{font-size:10.5px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;
  padding:3px 8px;border-radius:6px;white-space:nowrap;flex:0 0 auto}
.st-offen{background:rgba(255,90,31,.14);color:var(--signal)}
.st-angenommen{background:rgba(55,201,138,.14);color:var(--pos)}
.st-abgelehnt{background:rgba(255,91,91,.14);color:var(--neg)}
.st-erledigt{background:var(--surface2);color:var(--muted)}

/* ---------- Verkaufsknopf, Warenkorb, Chat ---------- */
.sellbtn{
  width:40px;height:40px;border-radius:10px;flex:0 0 auto;
  background:var(--neg);color:#fff;font-weight:700;font-size:17px;
  display:grid;place-items:center;
}
.sellbtn:active{filter:brightness(.85)}
.sellbtn.plusminus{background:var(--surface2);border:1px solid var(--line);color:var(--ink);font-size:15px}
.dot{
  position:absolute;top:1px;right:1px;min-width:16px;height:16px;border-radius:9px;
  background:var(--signal);color:#12100E;font-size:10px;font-weight:700;
  display:grid;place-items:center;padding:0 4px;
}
.icon-btn{position:relative}
.qtybox{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.qtybox .n{font-family:var(--mono);font-size:16px;min-width:26px;text-align:center;font-variant-numeric:tabular-nums}

.chatwrap{display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.bubble{max-width:78%;padding:9px 12px;border-radius:15px;font-size:15px;line-height:1.35;word-break:break-word}
.bubble .t{display:block;font-size:10.5px;font-family:var(--mono);opacity:.6;margin-top:4px}
.b-me{align-self:flex-end;background:var(--signal);color:#12100E;border-bottom-right-radius:5px}
.b-them{align-self:flex-start;background:var(--surface2);border:1px solid var(--line);border-bottom-left-radius:5px}
.chatbar{
  position:sticky;bottom:0;display:flex;gap:8px;padding:10px 0 4px;
  background:linear-gradient(to top,var(--bg) 70%,transparent);
}
.chatbar input{
  flex:1;background:var(--surface);border:1px solid var(--line);border-radius:20px;
  padding:11px 14px;font-size:16px;-webkit-appearance:none;
}
.chatbar button{
  width:44px;height:44px;border-radius:22px;background:var(--signal);color:#12100E;
  font-size:18px;flex:0 0 auto;
}
.sub{color:var(--muted);font-size:13.5px;margin:2px 0 0;line-height:1.45}
.soll{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ---------- Produktkarten im Lager — größer, Amazon-artiger ---------- */
.pcard{
  display:grid;
  grid-template-columns:68px 1fr;
  grid-template-areas:
    "img body"
    "img actions";
  column-gap:13px; row-gap:8px;
  align-items:start;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:13px;
}
.pcard:active{background:var(--surface2)}
.pcard-img{
  grid-area:img; width:68px;height:68px;border-radius:13px;object-fit:cover;
  background:var(--surface2);border:1px solid var(--line);
}
.pcard-ph{display:grid;place-items:center;color:var(--muted);font-size:22px}
.pcard-body{grid-area:body;min-width:0}
.pcard-title{
  font-weight:650;font-size:16.5px;line-height:1.28;letter-spacing:-.01em;
  white-space:normal;word-break:break-word;color:var(--ink);
}
.pcard-sub{color:var(--muted);font-size:13px;margin-top:3px}
.pcard-meta{display:flex;align-items:center;gap:10px;margin-top:7px;flex-wrap:wrap}
.pcard-price{font-family:var(--mono);font-size:15.5px;font-weight:700;color:var(--ink)}
.pcard-stock{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.pcard-stock.low{color:var(--signal);font-weight:700}
.pcard-actions{grid-area:actions;display:flex;gap:8px;align-items:center}
.sellbtn.qtyplus{width:auto;padding:0 15px;font-size:14px;font-weight:700}

.pcard-stock-big{
  font-family:var(--mono);font-size:20px;font-weight:800;letter-spacing:-.02em;
  color:var(--pos);margin-top:6px;
}
.pcard-stock-big.low{color:var(--signal);font-size:15px;font-weight:700}

/* ---------- Benachrichtigungs-Punkte ---------- */
.tab{position:relative}
.tab-dot{
  position:absolute;top:4px;right:calc(50% - 20px);min-width:16px;height:16px;padding:0 4px;
  border-radius:9px;background:var(--signal);color:#12100E;
  font-size:10px;font-weight:800;line-height:16px;text-align:center;
}
.dot-inline{
  display:inline-block;width:8px;height:8px;border-radius:50%;
  background:var(--signal);vertical-align:middle;margin-left:2px;
}

/* ================= v16 ================= */
/* "hidden" muss immer gewinnen — sonst war z. B. der Warenkorb-Knopf
   mit einer 0 auch beim Chef zu sehen (display:grid hat es überschrieben) */
[hidden]{display:none!important}
.seg.four{display:grid;grid-template-columns:1fr 1fr}
.pnav{display:flex;align-items:center;gap:10px;margin-top:10px}
.pnav .pnav-l{flex:1;text-align:center;font-family:var(--mono);font-size:13.5px}
.pnav .icon-btn,.calhead .icon-btn{font-size:21px;color:var(--ink)}
.pnav .icon-btn[disabled],.calhead .icon-btn[disabled]{opacity:.25}

/* Diagramm mit Achse */
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .grid.zero{stroke:#56606E}
.chart .ylab{font-size:9.5px}
.chart .bar-n{fill:var(--neg)}
.chart .hit{fill:transparent}
.chart .hit.sel{fill:rgba(255,255,255,.06)}
.chart-info{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:8px;min-height:18px}

/* Fotos im Chat */
.bubble.has-img{padding:5px 5px 8px}
.bubble.has-img .txt{display:block;padding:0 7px}
.bubble.has-img .t{padding:0 7px}
.chat-img{display:block;width:240px;max-width:100%;max-height:340px;min-height:150px;border-radius:11px;object-fit:cover;background:rgba(0,0,0,.18);margin-bottom:6px}
.chat-img[src]{min-height:0}
.chatbar .picbtn{background:var(--surface2);border:1px solid var(--line);color:var(--ink)}
.chatbar .picbtn[disabled]{opacity:.4}
.photo-full{width:100%;border-radius:14px;border:1px solid var(--line);display:block}

/* Kalender */
.calhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.calhead .t{flex:1;text-align:center;font-weight:650;font-size:17px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calwd{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-align:center;padding:2px 0 3px}
.calday{min-height:46px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:6px 0 5px;font-size:14px;font-variant-numeric:tabular-nums}
.calday.blank{background:none;border-color:transparent}
.calday.past{opacity:.45}
.calday.today{border-color:var(--signal)}
.calday.off{background:rgba(255,91,91,.13);border-color:rgba(255,91,91,.35)}
.calday.sel{background:var(--signal);color:#12100E;border-color:var(--signal);opacity:1;font-weight:700}
.calday .marks{display:flex;gap:3px;margin-top:auto;height:6px}
.calday .marks i{width:6px;height:6px;border-radius:50%}
.calday.sel .marks i{box-shadow:0 0 0 1.5px #12100E}
.m-slot{background:var(--pos)}
.m-full{background:var(--muted)}
.m-ware{background:#FFB020}
.m-off{background:rgba(255,91,91,.6)}
.callegend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--muted);font-family:var(--mono);margin-top:9px}
.callegend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.calbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.calbtns .btn{padding:11px 8px;font-size:14px}
.evt{display:flex;gap:11px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;text-align:left}
.evt .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;font-size:14px}
.evt .tt{font-weight:600;font-size:14.5px}
.evt .ss{font-size:12.5px;color:var(--muted);margin-top:1px;white-space:pre-line}
.ic-off{background:rgba(255,91,91,.15);color:var(--neg)}
.ic-ware{background:rgba(255,176,32,.15);color:#FFB020}
.ic-busy{background:var(--surface2);color:var(--muted)}
.ic-slot{background:rgba(55,201,138,.15);color:var(--pos)}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slot{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-family:var(--mono);font-size:13.5px;color:var(--ink);text-align:left}
.slot small{display:block;font-size:10.5px;color:var(--muted);margin-top:1px;font-family:var(--sans)}
.slot.full{opacity:.45}
.slot.is-active{background:var(--pos);border-color:var(--pos);color:#0E1013}
.slot.is-active small{color:#0E1013}
.slotbox{max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);-webkit-overflow-scrolling:touch}
.slotday{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
.slotday:first-child{margin-top:0}
.wdpick{display:flex;gap:5px}
.wdpick button{flex:1;padding:9px 0;border-radius:9px;background:var(--surface2);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.wdpick button.is-active{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:650}
.checkline{display:flex;gap:9px;align-items:center;font-size:14px;margin:4px 0 8px}
.checkline input{width:20px;height:20px;accent-color:var(--signal)}

/* Umfragen */
.poll{display:block;width:100%;text-align:left;background:linear-gradient(135deg,rgba(255,90,31,.17),rgba(255,90,31,.04));border:1px solid rgba(255,90,31,.45);border-radius:var(--r);padding:13px 14px}
.poll-k{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--signal)}
.poll-t{font-weight:650;font-size:16.5px;margin-top:3px}
.poll-s{font-size:13px;color:var(--muted);margin-top:3px}
.poll.done{background:var(--surface);border-color:rgba(55,201,138,.4)}
.poll.done .poll-k{color:var(--pos)}
.poll.ended{background:var(--surface);border-color:var(--line)}
.poll.ended .poll-k{color:var(--muted)}
.popt{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:6px;min-height:50px}
.popt .thumb{width:40px;height:40px}
.popt .pl{flex:1;min-width:0;font-size:14.5px;line-height:1.3}
.popt .ck{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:0 0 auto;display:grid;place-items:center;font-size:14px;color:transparent;font-weight:800}
.popt.on{border-color:var(--pos);background:rgba(55,201,138,.09)}
.popt.on .ck{background:var(--pos);border-color:var(--pos);color:#0E1013}
.popt[disabled]{opacity:.7}
.pgrp{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 7px}
.pgrp b{font-size:14px}
.pgrp span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.pgrp span.full{color:var(--signal);font-weight:700}
.pbar{height:6px;border-radius:3px;background:var(--surface2);margin-top:6px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--signal);border-radius:3px}
.stickybar{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 78%,transparent);padding:14px 0 4px;margin-top:6px;z-index:3}
details.who summary{cursor:pointer;font-size:13.5px;color:var(--muted);list-style:none}
details.who summary::-webkit-details-marker{display:none}
details.who .sub{margin-top:8px}

/* Schulden-Vorschau, Hinweise */
.debt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:2px 12px;margin-top:12px}
.debt .total .lv{font-size:16.5px;font-weight:700}
.admin-note{background:rgba(255,90,31,.12);border:1px solid rgba(255,90,31,.35);color:var(--signal);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px;line-height:1.45}
.who-tag{color:var(--signal)}

<script>
/* =========================================================
   Lager — Chef und Läufer
   ========================================================= */

// Die App darf nicht in einer fremden Seite eingebettet werden (Clickjacking).
if (window.top !== window.self) {
  try { window.top.location = window.self.location; } catch (e) { document.documentElement.innerHTML = ''; }
}

const APP_VERSION = 16;   // bei jeder Änderung hochzählen

const SB = {
  url: (window.SUPABASE_URL || '').replace(/\/+$/, ''),
  key: window.SUPABASE_KEY || '',
  token: null, refresh: null,
  configured() { return this.url && this.key && !this.url.includes('DEIN-PROJEKT'); },
  async authCall(path, body) {
    const r = await fetch(`${this.url}/auth/v1/${path}`, {
      method: 'POST', headers: { apikey: this.key, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error_description || d.msg || d.message || d.error || 'Fehler');
    return d;
  },
  head(x) {
    return Object.assign({ apikey: this.key, Authorization: 'Bearer ' + (this.token || this.key),
      'Content-Type': 'application/json' }, x || {});
  },
  async rest(path, o, retried) {
    o = o || {};
    const r = await fetch(`${this.url}/rest/v1/${path}`,
      { method: o.method || 'GET', headers: this.head(o.headers), body: o.body });
    if (r.status === 401 && !retried && this.refresh) {
      if (await Auth.tryRefresh()) return this.rest(path, o, true);
    }
    if (!r.ok) {
      const raw = await r.text();
      let m = raw;
      try { const j = JSON.parse(raw); m = j.message || j.error || j.hint || raw; } catch (e) { }
      throw new Error(m || 'Serverfehler');
    }
    if (r.status === 204) return null;
    return r.json();
  },
  async logout() {
    try {
      if (this.token) await fetch(`${this.url}/auth/v1/logout`, {
        method: 'POST', headers: { apikey: this.key, Authorization: 'Bearer ' + this.token }
      });
    } catch (e) { }
  },
  select(t, q) { return this.rest(t + '?' + (q || 'select=*')); },
  insert(t, row) { return this.rest(t, { method: 'POST', headers: { Prefer: 'return=representation' }, body: JSON.stringify(row) }); },
  update(t, id, p) { return this.rest(`${t}?id=eq.${id}`, { method: 'PATCH', headers: { Prefer: 'return=representation' }, body: JSON.stringify(p) }); },
  remove(t, id) { return this.rest(`${t}?id=eq.${id}`, { method: 'DELETE' }); },
  rpc(fn, args) { return this.rest('rpc/' + fn, { method: 'POST', body: JSON.stringify(args || {}) }); }
};

const Auth = {
  me: null,
  save(d) {
    SB.token = d.access_token; SB.refresh = d.refresh_token;
    try { localStorage.setItem('lager_session', JSON.stringify({ a: d.access_token, r: d.refresh_token })); } catch (e) { }
  },
  load() {
    try { const s = JSON.parse(localStorage.getItem('lager_session') || 'null');
      if (s) { SB.token = s.a; SB.refresh = s.r; return true; } } catch (e) { }
    return false;
  },
  clear() { SB.token = null; SB.refresh = null; this.me = null;
    try { localStorage.removeItem('lager_session'); } catch (e) { } },
  async tryRefresh() {
    if (!SB.refresh) return false;
    try { this.save(await SB.authCall('token?grant_type=refresh_token', { refresh_token: SB.refresh })); return true; }
    catch (e) { this.clear(); return false; }
  },
  uid() {
    try { return JSON.parse(atob(SB.token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).sub; }
    catch (e) { return null; }
  },
  async login(email, pw) { this.save(await SB.authCall('token?grant_type=password', { email: email.trim(), password: pw })); return this.loadProfile(); },
  async signup(email, pw, name, code) {
    await SB.authCall('signup', { email: email.trim(), password: pw, data: { name: name.trim(), code: code.trim() } });
    return this.login(email, pw);
  },
  async loadProfile() {
    const id = this.uid(); if (!id) throw new Error('Sitzung ungültig');
    const rows = await SB.select('profiles', `select=*&id=eq.${id}`);
    if (!rows || !rows.length) throw new Error('Konto nicht gefunden. Wurde das SQL-Skript ausgeführt?');
    this.me = rows[0]; return this.me;
  },
  isAdmin() { return this.me && this.me.role === 'admin'; }
};

const Cache = {
  db: null,
  open() { return new Promise(res => {
    const r = indexedDB.open('lagercache', 1);
    r.onupgradeneeded = e => { const d = e.target.result; if (!d.objectStoreNames.contains('snap')) d.createObjectStore('snap'); };
    r.onsuccess = e => { this.db = e.target.result; res(true); };
    r.onerror = () => res(false);
  }); },
  put(k, v) { if (!this.db) return Promise.resolve();
    return new Promise(res => { try { const q = this.db.transaction('snap', 'readwrite').objectStore('snap').put(v, k);
      q.onsuccess = () => res(); q.onerror = () => res(); } catch (e) { res(); } }); },
  get(k) { if (!this.db) return Promise.resolve(null);
    return new Promise(res => { try { const q = this.db.transaction('snap', 'readonly').objectStore('snap').get(k);
      q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); } catch (e) { res(null); } }); }
};

  },

  async melden(kind, to) {

    const pad = '='.repeat((4 - b64.length % 4) % 4);
    const roh = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
    return Uint8Array.from([...roh].map(c => c.charCodeAt(0)));
  }
};

/* ---------- Rechnen ---------- */
const PLUS = ['purchase', 'return'];
const MINUS = ['sale', 'handout', 'adjust'];

function stockOf(pid) {                 // Lager beim Chef
  let n = 0;
  for (const m of S.movements) {
    if (m.product_id !== pid) continue;
    if (PLUS.includes(m.type)) n += +m.qty;
    else if (MINUS.includes(m.type)) n -= +m.qty;
    // "gift" ohne Partner = Chef verschenkt direkt aus seinem Lager.
    // "gift" mit Partner = ein Läufer verschenkt aus SEINEM Bestand,
    // der war beim Chef schon lange raus (seit der Übergabe) — zieht
    // hier also nichts nochmal ab.
    else if (m.type === 'gift' && !m.partner_id) n -= +m.qty;
  }
  return n;
}
/* ---- Kontostand eines Läufers, Schritt für Schritt durchgerechnet ----

   Alles in EINER Funktion, chronologisch. Das ist wichtig, weil ein
   Läufer dasselbe Produkt mehrfach zu verschiedenen Preisen bekommen
   kann. Beispiel: 5 Stück zu 15 €, später 2 Stück zu 20 €.
   Gibt er dann 7 zurück, darf man ihm nicht 7 × 20 € gutschreiben —
   er hat ja nur 115 € geschuldet, nicht 140 €. Deshalb wird pro
   Produkt ein Durchschnittspreis mitgeführt und Rückgaben werden
   genau zu dem Preis gutgeschrieben, zu dem sie belastet wurden.
   Ohne das entsteht aus dem Nichts ein Minus.                        */
function runnerState(sid) {
  const bew = S.movements
    .filter(m => m.partner_id === sid && ['handout', 'return', 'runner_sale', 'gift'].includes(m.type))
    .slice()
    .sort((a, b) => String(a.date).localeCompare(String(b.date))
                 || String(a.created_at || '').localeCompare(String(b.created_at || '')));

  const lager = {};          // pro Produkt: Stückzahl und gebundener Wert
  let schuld = 0;

  for (const m of bew) {
    const pid = m.product_id;
    const v = lager[pid] || (lager[pid] = { qty: 0, wert: 0 });
    const menge = +m.qty || 0;

    if (m.type === 'handout') {
      const betrag = (+m.unit_price || 0) * menge;
      schuld += betrag;
      v.qty += menge;
      v.wert += betrag;
    } else {
      // Durchschnittspreis dessen, was er gerade hat
      const schnitt = v.qty > 0 ? v.wert / v.qty : (+m.unit_price || 0);
      const weg = Math.min(menge, Math.max(0, v.qty));
      const betrag = weg * schnitt;
      if (m.type === 'return') schuld -= betrag;   // Verkauf und Verschenken ändern die Schuld nicht
      v.qty -= menge;
      v.wert -= betrag;
      if (v.qty <= 0) { v.qty = Math.max(0, v.qty); v.wert = 0; }
    }
  }

  for (const p of S.payments) {
    if (p.partner_id !== sid) continue;
    if (p.direction === 'in') schuld -= +p.amount;
    else if (p.direction === 'adjust') schuld += +p.amount;
  }

  const items = Object.entries(lager)
    .filter(([, v]) => v.qty > 0)
    .map(([pid, v]) => ({ pid, qty: v.qty, price: v.qty > 0 ? v.wert / v.qty : 0 }));

  return { schuld, items };
}

function runnerStock(sid, pid) {
  const st = runnerState(sid);
  if (pid) { const t = st.items.find(x => x.pid === pid); return t ? t.qty : 0; }
  return st.items.reduce((s, x) => s + x.qty, 0);
}
const runnerStockList = sid => runnerState(sid).items;

// Für die normale Anzeige: nie unter 0.

/* Eine Sortierung für Chef und Läufer — Marke, dann verfügbar zuerst,
   dann der Name. Zahlen im Namen zählen als Zahl, nicht als Text:
   "Nike 30k" steht damit vor "Nike 40k" und vor "Nike 100k". */
function sortProducts(list, stockFn) {
  return list.sort((a, b) => {
    const ba = norm(a.brand) || 'zzzzzz', bb = norm(b.brand) || 'zzzzzz';
    if (ba !== bb) return ba.localeCompare(bb, 'de', { numeric: true });
    const aa = stockFn(a) > 0 ? 0 : 1, ab = stockFn(b) > 0 ? 0 : 1;
    if (aa !== ab) return aa - ab;
    return norm(a.name).localeCompare(norm(b.name), 'de', { numeric: true, sensitivity: 'base' });
  });
}

function periodRange(p, off) {
  off = off || 0;
  const n = new Date(), y = n.getFullYear(), mo = n.getMonth(), d = n.getDate();
  if (p === 'week') {
    const dw = (n.getDay() + 6) % 7, st = new Date(y, mo, d - dw + off * 7);
    return [isoD(st), isoD(new Date(st.getFullYear(), st.getMonth(), st.getDate() + 6))];
  }
  if (p === 'month') return [isoD(new Date(y, mo + off, 1)), isoD(new Date(y, mo + off + 1, 0))];
  if (p === 'year') return [`${y + off}-01-01`, `${y + off}-12-31`];
  return ['0000-01-01', '9999-12-31'];
}
const inPeriod = (m, p, off) => { const r = periodRange(p, off), d = String(m.date).slice(0, 10); return d >= r[0] && d <= r[1]; };
function isoWeek(t) {
  const d = parseD(t); d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
  const w1 = new Date(d.getFullYear(), 0, 4);
  return 1 + Math.round(((d - w1) / 864e5 - 3 + (w1.getDay() + 6) % 7) / 7);
}
function periodLabel(p, off) {
  const r = periodRange(p, off);
  if (p === 'week') return (off === 0 ? 'Diese Woche' : off === -1 ? 'Letzte Woche' : 'KW ' + isoWeek(r[0]))
    + ' · ' + deDate(r[0]).slice(0, 6) + '–' + deDate(r[1]).slice(0, 6);
  if (p === 'month') { const d = parseD(r[0]); return MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }
  if (p === 'year') return r[0].slice(0, 4);
  return 'Insgesamt';
}

/* Einkaufspreis: steht bewusst nicht in Zeilen, die Läufer lesen dürfen.

  : m.type === 'runner_sale' ? m.admin_price * m.qty : 0;

    : 'Kein Internet — Stand ' + deDate(offlineSince) + ', nichts speicherbar';
}
function online() { if (offlineSince) { toast('Kein Internet'); return false; } return true; }

/* ---------- Benachrichtigungen (Punkt auf dem Reiter) ----------
   Läuft komplett lokal auf dem Gerät, ohne neue Datenbank-Tabelle.
   "Gesehen" merkt sich, wann zuletzt in einen Chat geschaut wurde. */
function seenKey(chatId) { return 'lager_seen_' + (Auth.me ? Auth.me.id : '') + '_' + chatId; }
function getSeen(chatId) { try { return localStorage.getItem(seenKey(chatId)) || ''; } catch (e) { return ''; } }
function markSeen(chatId) { try { localStorage.setItem(seenKey(chatId), new Date().toISOString()); } catch (e) { } }

function unreadChatsForAdmin() {
  return runners().filter(r =>
    S.messages.some(m => m.supplier_id === r.id && !m.from_admin && m.created_at > getSeen(r.id))
  ).length;
}
function unreadChatForRunner() {
  return S.messages.some(m => m.supplier_id === Auth.me.id && m.from_admin && m.created_at > getSeen('me')) ? 1 : 0;
}
function updateTabBadges() {
  if (Auth.isAdmin()) {
    setBadge('runners', S.orders.filter(o => o.status === 'offen').length);
    setBadge('chat', unreadChatsForAdmin());
  } else {
    setBadge('chat', unreadChatForRunner());
    setBadge('shop', S.umfragen.filter(u => pollOpen(u) && !myAnswer(u)).length);
  }
}
function setBadge(tabKey, n) {
  const btn = document.querySelector(`.tab[data-tab="${tabKey}"]`);
  if (!btn) return;
  let dot = btn.querySelector('.tab-dot');
  if (!n) { if (dot) dot.remove(); return; }
  if (!dot) { dot = document.createElement('span'); dot.className = 'tab-dot'; btn.appendChild(dot); }
  dot.textContent = n > 9 ? '9+' : String(n);
}

/* ---------- Tabs ---------- */
const ADMIN_TABS = [['stock','▤','Lager'],['runners','⇄','Läufer'],['finance','€','Geld'],['chat','✉','Chat'],['stats','▮','Statistik'],['cal','◷','Kalender']];
const SUP_TABS = [['shop','▤','Produkte'],['mystock','▦','Mein Lager'],['mystats','▮','Meine Zahlen'],['chat','✉','Chat'],['cal','◷','Kalender']];
const TITLES = { stock:'Lager', runners:'Läufer', finance:'Geld', chat:'Chat', stats:'Statistik',
  shop:'Produkte', mystock:'Mein Lager', mystats:'Meine Zahlen', cal:'Kalender' };
const PLACE = { stock:'Produkt oder Marke', runners:'Läufer oder Ort', finance:'Produkt suchen',
  chat:'Läufer suchen', stats:'Produkt oder Läufer', shop:'Produkt oder Marke',
  mystock:'Produkt suchen', mystats:'Produkt suchen' };

function buildTabs() {
  const list = Auth.isAdmin() ? ADMIN_TABS : SUP_TABS;
  tab = list[0][0];

  b.style.gridTemplateColumns = `repeat(${list.length},1fr)`;
  b.innerHTML = list.map(([k, i, l]) => `<button class="tab" data-tab="${k}"><span class="tab-ico">${i}</span>${l}</button>`).join('');
}
const q = () => norm(query[tab]);
const empty = (t, x) => `<div class="empty"><b>${esc(t)}</b>${esc(x)}</div>`;

function render() {
  if (!Auth.isAdmin() && Auth.me && Auth.me.active === false) return showWaiting();
  document.getElementById('viewTitle').textContent = TITLES[tab];
  const s = document.getElementById('search');
  s.placeholder = PLACE[tab] || 'Suchen';
  if (s.value !== (query[tab] || '')) s.value = query[tab] || '';
  document.getElementById('searchWrap').hidden = (tab === 'chat' && !Auth.isAdmin()) || tab === 'cal';
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('is-active', x.dataset.tab === tab));
  const cb = document.getElementById('cartBtn');
  const n = Object.values(cart).reduce((a, b) => a + b, 0);
  cb.hidden = Auth.isAdmin() || tab !== 'shop';
  document.getElementById('cartCount').hidden = !n;
  document.getElementById('cartCount').textContent = n;
  const V = { stock:vStock, runners:vRunners, finance:vFinance, chat:vChat, stats:vStats,

  const hinweis = Auth.isAdmin() && dbAlt
    ? '<div class="admin-note">Kalender, Umfragen, Wünsche und Chat-Fotos brauchen noch das Datenbank-Update: <b>update-v16.sql</b> im Supabase SQL Editor ausführen, dann ••• → Neu laden.</div>' : '';
  document.getElementById('main').innerHTML = '<div class="view">' + hinweis + V() + '</div>';
  const W = { stock:wStock, runners:wRunners, finance:wFinance, chat:wChat, stats:wStats,
    shop:wShop, mystock:wMyStock, mystats:wMyStats, cal:wCal }[tab];
  if (W) W();
  updateTabBadges();
}

/* ----- Lager ----- */
function vStock() {
  let list = S.products.slice();
  if (q()) list = list.filter(p => hit(query[tab], p.name, p.brand, p.category));
  sortProducts(list, p => stockOf(p.id));
  const units = S.products.reduce((s, p) => s + Math.max(0, stockOf(p.id)), 0);
  const beiLaeufern = runners().reduce((s, r) => s + runnerStock(r.id, null), 0);
  return `
    <div class="kpis">
      <div class="kpi"><div class="lab">Bei dir</div><div class="val">${nf.format(units)}</div></div>
      <div class="kpi"><div class="lab">Bei den Läufern</div><div class="val">${nf.format(beiLaeufern)}</div></div>
      <div class="kpi wide"><div class="lab">Wert deines Lagers</div><div class="val">${money(stockValue())}</div></div>
    </div>
    <button class="btn" id="newProduct" style="margin-top:10px">Neues Produkt</button>
    <p class="sub">$ verkauft direkt 1 Stück, 🎁 verschenkt 1 Stück.</p>
    <div class="eyebrow">${q() ? 'Gefunden · ' + list.length : 'Produkte · ' + S.products.length}</div>
    <div class="stack">${list.length ? list.map(pRow).join('')
      : empty(S.products.length ? 'Nichts gefunden' : 'Noch keine Produkte', 'Leg oben dein erstes Produkt an.')}</div>`;
}
function pRow(p) {
  const st = stockOf(p.id);
  const out = st <= 0;
  return `<div class="pcard" data-pid="${p.id}">
    ${p.photo ? `<img class="pcard-img" src="${p.photo}" alt="">` : '<div class="pcard-img pcard-ph">▤</div>'}
    <div class="pcard-body">
      <div class="pcard-title">${esc(p.name)}</div>
      <div class="pcard-sub">${[p.brand, p.category].filter(Boolean).map(esc).join(' · ') || 'Ohne Marke'}</div>
      <div class="pcard-meta">
        <span class="pcard-price">${money(p.sell_price)}</span>
        <span class="pcard-stock ${out ? 'low' : ''}">${out ? 'Nicht da' : nf.format(st) + ' Stück'}</span>
      </div>
    </div>
    <div class="pcard-actions">
      ${out
        ? `<button class="btn btn-ghost" style="flex:1;padding:9px;font-size:13.5px" data-reorder="${p.id}">${p.want_reorder ? '★ Vorgemerkt' : '☆ Für Nachbestellung vormerken'}</button>`
        : `<button class="sellbtn" data-sell="${p.id}" title="1 verkauft">$</button>
           <button class="sellbtn plusminus" data-gift="${p.id}" title="1 verschenkt">🎁</button>`}
    </div>
  </div>`;
}
function wStock() {
  document.getElementById('newProduct').onclick = () => productSheet(null);
  document.querySelectorAll('.pcard[data-pid]').forEach(el =>
    el.onclick = () => productSheet(byId(S.products, el.dataset.pid)));
  document.querySelectorAll('[data-sell]').forEach(el => el.onclick = async e => {
    e.stopPropagation();
    if (!online()) return;
    const p = byId(S.products, el.dataset.sell);
    if (stockOf(p.id) <= 0) return toast('Nichts mehr auf Lager');
    try {
      const rows = await SB.insert('movements', { type: 'sale', product_id: p.id, qty: 1,
        unit_price: +p.sell_price || 0, cost_price: +p.buy_price || 0, date: today() });
      S.movements.unshift(rows[0]);
      toast('1 × ' + p.name + ' verkauft · ' + money(p.sell_price));
      render();
    } catch (err) { fail(err); }
  });
  document.querySelectorAll('[data-gift]').forEach(el => el.onclick = async e => {
    e.stopPropagation();
    if (!online()) return;
    const p = byId(S.products, el.dataset.gift);
    if (stockOf(p.id) <= 0) return toast('Nichts mehr auf Lager');
    try {
      const rows = await SB.insert('movements', { type: 'gift', product_id: p.id, qty: 1,
        unit_price: 0, cost_price: +p.buy_price || 0, date: today() });
      S.movements.unshift(rows[0]);
      toast('1 × ' + p.name + ' verschenkt');
      render();
    } catch (err) { fail(err); }
  });
  document.querySelectorAll('[data-reorder]').forEach(el => el.onclick = async e => {
    e.stopPropagation();
    if (!online()) return;
    const p = byId(S.products, el.dataset.reorder);
    try {
      const rows = await SB.update('products', p.id, { want_reorder: !p.want_reorder });
      const i = S.products.findIndex(x => x.id === p.id); if (i >= 0) S.products[i] = rows[0];
      toast(rows[0].want_reorder ? 'Für Nachbestellung vorgemerkt' : 'Merker entfernt');
      render();
    } catch (err) { fail(err); }
  });
}

/* ----- Läufer ----- */
let runTab = 'orders';
function vRunners() {
  const offO = S.orders.filter(o => o.status === 'offen' && o.kind !== 'wish').length;
  const offW = S.orders.filter(o => o.status === 'offen' && o.kind === 'wish').length;
  const offU = S.umfragen.filter(pollOpen).length;
  const b = (k, l, n) => `<button data-s="${k}" class="${runTab === k ? 'is-active' : ''}">${l}${n ? ' · ' + n : ''}</button>`;
  const seg = `<div class="seg four" id="segRun">${b('orders', 'Bestellungen', offO)}${b('wishes', 'Wünsche', offW)}${b('polls', 'Umfragen', offU)}${b('people', 'Läufer', 0)}</div>`;
  const V = { orders: vOrders, wishes: vWishes, polls: vPolls, people: vPeople }[runTab] || vOrders;
  return seg + V();
}
function vOrders() {
  let list = S.orders.filter(o => o.kind !== 'wish');
  if (q()) list = list.filter(o => {
    const r = byId(S.partners, o.supplier_id);
    return hit(query[tab], r && r.name, o.place);
  });
  // offene zuerst, darin nach Termin; sonst neueste zuerst
  list.sort((a, b) => {
    const oa = a.status === 'offen' ? 0 : 1, ob = b.status === 'offen' ? 0 : 1;
    if (oa !== ob) return oa - ob;
    if (!oa) return String(a.needed_by || '9999').localeCompare(String(b.needed_by || '9999'))
      || String(a.needed_time || '').localeCompare(String(b.needed_time || ''));
    return String(b.created_at).localeCompare(String(a.created_at));
  });
  return `<p class="sub">Was die Läufer bestellt haben. Tippe drauf, um die Ware zu übergeben.</p>
    <div class="eyebrow">${list.length} Bestellung(en)</div>
    <div class="stack">${list.length ? list.map(o => orderCard(o, false)).join('')
      : empty('Keine Bestellungen', 'Sobald ein Läufer etwas bestellt, steht es hier.')}</div>`;
}
// Wert der Ware, die aus dieser Bestellung noch übergeben wird — zum Läufer-Preis
function orderValue(o) {
  const src = Auth.isAdmin() ? S.products : S.katalog;
  return S.items.filter(i => i.order_id === o.id).reduce((sum, i) => {
    const p = byId(src, i.product_id);
    return sum + Math.max(0, (+i.qty || 0) - (+i.done_qty || 0)) * (p ? +p.runner_price || 0 : 0);
  }, 0);
}
const terminText = o => o.needed_by ? dayLabel(o.needed_by) + (o.needed_time ? ' · ' + o.needed_time : '') : '';
function orderCard(o, mine) {
  const r = byId(S.partners, o.supplier_id);
  const its = S.items.filter(i => i.order_id === o.id);
  const offen = its.reduce((sum, i) => sum + (i.qty - i.done_qty), 0);
  const src = Auth.isAdmin() ? S.products : S.katalog;
  const lines = its.map(i => {
    const p = byId(src, i.product_id) || byId(S.katalog, i.product_id);
    return `${nf.format(i.qty)} × ${esc(p ? p.name : 'Produkt')}${i.done_qty ? ' <span class="dim">(' + nf.format(i.done_qty) + ' übergeben)</span>' : ''}`;
  }).join('<br>');
  const wert = orderValue(o);
  const danach = runnerDebt(o.supplier_id) + wert;
  const stCls = o.status === 'offen' ? 'offen' : o.status === 'erledigt' ? 'angenommen' : 'abgelehnt';
  return `<div class="req" data-oid="${o.id}">
    <div class="req-top">
      <div><div class="req-title">${mine ? 'Deine Bestellung' : esc((r && r.name) || 'Unbekannter Läufer')}</div>
        <div class="req-meta">Bestellt ${deDate(o.created_at)}${o.place ? ' · ' + esc(o.place) : ''}</div></div>
      <span class="st st-${stCls}">${esc(o.status)}</span></div>
    ${o.needed_by ? `<div class="req-meta" style="margin:-2px 0 2px;color:var(--ink)">◷ ${esc(terminText(o))}</div>` : ''}
    <div class="req-text">${lines || 'Keine Artikel'}</div>
    ${o.note ? `<div class="req-meta" style="margin-top:6px">${esc(o.note)}</div>` : ''}
    ${offen > 0 && o.status === 'offen' ? `<div class="req-meta" style="margin-top:8px;color:var(--signal)">Noch ${nf.format(offen)} Stück · ≈ ${money(wert)} · ${mine ? 'du schuldest danach' : 'Schulden danach'} ${money(Math.max(0, danach))}</div>` : ''}
  </div>`;
}

/* ----- Wünsche: Produkte, die gerade nicht da waren ----- */
function wishGroups() {
  const agg = {};
  S.orders.filter(o => o.kind === 'wish' && o.status === 'offen').forEach(o => {
    const r = byId(S.partners, o.supplier_id), wer = r ? r.name : 'Läufer';
    S.items.filter(i => i.order_id === o.id).forEach(i => {
      const a = agg[i.product_id] || (agg[i.product_id] = { pid: i.product_id, n: 0, wer: [], oids: [], last: '' });
      a.n += +i.qty || 1;
      if (!a.wer.includes(wer)) a.wer.push(wer);
      if (!a.oids.includes(o.id)) a.oids.push(o.id);
      if (String(o.created_at) > a.last) a.last = String(o.created_at);
    });
  });
  return Object.values(agg).map(a => Object.assign(a, { p: byId(S.products, a.pid) }));
}
function vWishes() {
  let list = wishGroups();
  if (q()) list = list.filter(a => hit(query[tab], a.p && a.p.name, a.p && a.p.brand, a.wer.join(' ')));
  list.sort((a, b) => b.n - a.n || b.last.localeCompare(a.last));
  return `<p class="sub">Was Läufer gerne hätten, aber gerade ausverkauft war. Das sind keine Bestellungen — nur Wünsche fürs Nachbestellen.</p>
    <div class="eyebrow">${list.length} Produkt(e) gewünscht</div>
    <div class="stack">${list.length ? list.map(a => `
      <div class="pcard">
        ${a.p && a.p.photo ? `<img class="pcard-img" src="${a.p.photo}" alt="">` : '<div class="pcard-img pcard-ph">☆</div>'}
        <div class="pcard-body">
          <div class="pcard-title">${esc(a.p ? a.p.name : 'Gelöschtes Produkt')}</div>
          <div class="pcard-sub"><b class="who-tag">${nf.format(a.n)}× gewünscht</b> · von ${esc(a.wer.join(', '))}</div>
          <div class="pcard-sub">Zuletzt ${deDate(a.last)} · bei dir gerade ${a.p ? nf.format(stockOf(a.pid)) : '–'} Stück</div>
        </div>
        <div class="pcard-actions">
          ${a.p ? `<button class="btn btn-ghost" style="flex:1;padding:9px;font-size:13.5px" data-wmark="${a.pid}">${a.p.want_reorder ? '★ Vorgemerkt' : '☆ Vormerken'}</button>` : ''}
          <button class="btn" style="flex:1;padding:9px;font-size:13.5px" data-wdone="${a.oids.join(',')}">✓ Erledigt</button>
        </div>
      </div>`).join('')
      : empty('Keine Wünsche', 'Wenn ein Läufer etwas Ausverkauftes wünscht, steht es hier.')}</div>`;
}

/* ----- Umfragen (Chef) ----- */
const pollOpen = u => !u.closed && new Date(u.deadline) > new Date();
const myAnswer = u => S.antworten.find(a => a.umfrage_id === u.id && Auth.me && a.runner_id === Auth.me.id);
function pollLeft(u) {
  const ms = new Date(u.deadline) - Date.now();
  if (u.closed || ms <= 0) return 'beendet';
  const d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24;
  return d ? `noch ${d} T ${h} Std` : h ? `noch ${h} Std` : `noch ${Math.max(1, Math.round(ms / 6e4))} Min`;
}
function pollGroups(u) {
  const m = new Map();
  (u.options || []).forEach(o => { const g = o.group || 'Alle'; if (!m.has(g)) m.set(g, []); m.get(g).push(o); });
  return [...m.entries()];
}
function limitText(u) {
  const t = [];
  if (u.max_per_group > 0) t.push(`max. ${u.max_per_group} pro ${u.group_by === 'brand' ? 'Marke' : 'Art'}`);
  if (u.max_total > 0) t.push(`max. ${u.max_total} insgesamt`);
  return t.length ? 'Regel: ' + t.join(', ') : 'Beliebig viele wählbar';
}
function vPolls() {
  let list = S.umfragen.slice().sort((a, b) => (+pollOpen(b) - +pollOpen(a)) || String(b.deadline).localeCompare(String(a.deadline)));
  if (q()) list = list.filter(u => hit(query[tab], u.title, u.note));
  const aktiv = runners().filter(r => r.active !== false).length;
  return `<button class="btn" id="newPoll">Neue Umfrage</button>
    <p class="sub">Läufer sehen offene Umfragen ganz oben auf ihrer Produktseite und können bis zur Deadline abstimmen und ändern.</p>
    <div class="eyebrow">${list.length} Umfrage(n)</div>
    <div class="stack">${list.length ? list.map(u => {
      const n = S.antworten.filter(a => a.umfrage_id === u.id).length, auf = pollOpen(u);
      return `<button class="poll ${auf ? '' : 'ended'}" data-uid="${u.id}">
        <div class="poll-k">${auf ? 'Läuft · ' + pollLeft(u) : 'Beendet'}</div>
        <div class="poll-t">${esc(u.title)}</div>
        <div class="poll-s">${n} von ${aktiv} Läufern abgestimmt · Deadline ${deDateTime(u.deadline)}</div></button>`;
    }).join('') : empty('Noch keine Umfrage', 'Leg oben eine an — z. B. welche Schuhe nachbestellt werden sollen.')}</div>`;
}

function vPeople() {
  let list = runners();
  if (q()) list = list.filter(r => hit(query[tab], r.name, r.area, r.email));
  list.sort((a, b) => (a.active === false ? 0 : 1) - (b.active === false ? 0 : 1)
    || runnerDebtOwed(b.id) - runnerDebtOwed(a.id));
  const warten = list.filter(r => r.active === false).length;
  return `<div class="kpis">
      ${warten ? `<div class="kpi wide" style="border-color:rgba(255,90,31,.5)">
        <div class="lab">Warten auf deine Freigabe</div>
        <div class="val" style="color:var(--signal)">${warten}</div></div>` : ''}
      <div class="kpi wide"><div class="lab">Alle Schulden zusammen</div>
        <div class="val ${totalDebt() ? 'neg' : ''}">${money(totalDebt())}</div></div></div>
    <div class="eyebrow">${list.length} Läufer</div>
    <div class="stack">${list.length ? list.map(rRow).join('')
      : empty('Noch keine Läufer', 'Gib deinen Code weiter, damit sie sich anmelden können.')}</div>`;
}
function rRow(r) {
  const d = runnerDebtOwed(r.id), st = runnerStock(r.id, null);
  const gesperrt = r.active === false;
  return `<button class="row" data-rid="${r.id}" ${gesperrt ? 'style="border-color:rgba(255,90,31,.5)"' : ''}>
    <div class="row-main"><div class="row-title">${esc(r.name)}${gesperrt ? ' <span class="badge warn">Gesperrt</span>' : ''}</div>
      <div class="row-sub">${r.area ? esc(r.area) : 'Kein Ort'} · hat ${nf.format(st)} Stück</div></div>
    <div class="row-end"><div class="big ${d > 0.005 ? 'neg' : 'dim'}">${money(d)}</div>
      <div class="small">${d > 0.005 ? 'schuldet dir' : 'bezahlt'}</div></div></button>`;
}
function wRunners() {
  document.getElementById('segRun').onclick = e => {
    const b = e.target.closest('[data-s]'); if (!b) return; runTab = b.dataset.s; render();
  };
  document.querySelectorAll('[data-oid]').forEach(el => el.onclick = () => orderSheet(byId(S.orders, el.dataset.oid)));
  document.querySelectorAll('[data-rid]').forEach(el => el.onclick = () => runnerSheet(byId(S.partners, el.dataset.rid)));
  const np = document.getElementById('newPoll');
  if (np) np.onclick = () => pollNewSheet();
  document.querySelectorAll('[data-uid]').forEach(el => el.onclick = () => pollAdminSheet(byId(S.umfragen, el.dataset.uid)));
  document.querySelectorAll('[data-wmark]').forEach(el => el.onclick = async () => {
    if (!online()) return;
    const p = byId(S.products, el.dataset.wmark); if (!p) return;
    try {
      const rows = await SB.update('products', p.id, { want_reorder: !p.want_reorder });
      const i = S.products.findIndex(x => x.id === p.id); if (i >= 0) S.products[i] = rows[0];
      toast(rows[0].want_reorder ? 'Für Nachbestellung vorgemerkt' : 'Merker entfernt'); render();
    } catch (e) { fail(e); }
  });
  document.querySelectorAll('[data-wdone]').forEach(el => el.onclick = async () => {
    if (!online()) return;
    const ids = el.dataset.wdone.split(',').filter(x => UUID.test(x));
    if (!ids.length) return;
    try {
      await SB.rest(`orders?id=in.(${ids.join(',')})`, { method: 'PATCH', headers: { Prefer: 'return=minimal' },
        body: JSON.stringify({ status: 'erledigt' }) });
      S.orders.forEach(o => { if (ids.includes(o.id)) o.status = 'erledigt'; });
      toast('Wunsch erledigt'); render();
    } catch (e) { fail(e); }
  });
}

/* ----- Geld ----- */
function vFinance() {
  const inP = S.movements.filter(m => inPeriod(m, period));
  const rev = inP.reduce((s, m) => s + adminRevenue(m), 0);
  const cost = inP.reduce((s, m) => s + adminCost(m), 0);

// "Schöne" Schrittweite für die Achse: 1, 2, 2,5, 5 oder 10 mal Zehnerpotenz
function niceStep(range, ticks) {
  const raw = range / ticks, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
}
function eurShort(v) {
  const a = Math.abs(v);
  const t = a >= 10000 ? nf.format(Math.round(a / 1000)) + 'k'
    : a >= 1000 ? nf.format(Math.round(a / 100) / 10) + 'k' : nf.format(Math.round(a));
  return (v < 0 ? '−' : '') + t + ' €';
}
function chart(year) {
  const rev = Array(12).fill(0), pro = Array(12).fill(0);
  S.movements.forEach(m => {
    const d = String(m.date).slice(0, 10).split('-');
    if (+d[0] !== year) return;
    rev[+d[1] - 1] += adminRevenue(m); pro[+d[1] - 1] += adminRevenue(m) - adminCost(m);
  });
  chart.data = { year, rev, pro };
  const hi = Math.max(0, ...rev, ...pro), lo = Math.min(0, ...rev, ...pro);
  const step = niceStep(Math.max(hi - lo, 10), 4);
  const top = Math.max(step, Math.ceil(hi / step - 1e-9) * step), bot = Math.floor(lo / step + 1e-9) * step;
  // Zeichenfläche links, Euro-Achse rechts
  const W = 340, H = 196, L = 2, R = 48, T = 8, B = 22, pw = W - L - R, ph = H - T - B;
  const y = v => T + (top - v) / (top - bot) * ph;
  let o = '';
  for (let v = bot; v <= top + step / 2; v += step) {
    const yy = y(v);
    o += `<line class="grid${Math.abs(v) < step / 2 ? ' zero' : ''}" x1="${L}" x2="${L + pw}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}"/>`;
    o += `<text class="ylab" x="${L + pw + 6}" y="${(yy + 3.2).toFixed(1)}">${eurShort(Math.abs(v) < step / 2 ? 0 : v)}</text>`;
  }
  const bw = pw / 12;
  let hits = '';
  for (let i = 0; i < 12; i++) {
    const x = L + i * bw, w1 = bw - 7, w2 = Math.max(4, w1 * 0.55);
    const bar = (v, cls, w) => {
      const a = y(Math.max(0, v)), b = y(Math.min(0, v));
      return `<rect class="${cls}" x="${(x + 3.5 + (w1 - w) / 2).toFixed(1)}" y="${a.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0, b - a).toFixed(1)}" rx="2"/>`;
    };
    o += bar(rev[i], 'bar-r', w1) + bar(pro[i], pro[i] < 0 ? 'bar-n' : 'bar-p', w2);
    o += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 7}" text-anchor="middle">${MON1[i]}</text>`;
    hits += `<rect class="hit" data-mi="${i}" x="${x.toFixed(1)}" y="0" width="${bw.toFixed(1)}" height="${H}"/>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Umsatz und Gewinn pro Monat ${year}">${o}${hits}</svg>`;
}

function loadCart() {
  Object.keys(cart).forEach(k => delete cart[k]);

    const d = JSON.parse(localStorage.getItem(cartKey()) || 'null');
    if (d && d.c && typeof d.c === 'object') Object.entries(d.c).forEach(([k, v]) => {
      if (UUID.test(k) && Number.isFinite(v) && v > 0 && v <= 10000) cart[k] = Math.floor(v);
    });
    if (d && d.m) Object.keys(cartMeta).forEach(k => { if (typeof d.m[k] === 'string') cartMeta[k] = d.m[k].slice(0, 1000); });
  } catch (e) { }

  if (!online()) return;
  const p = byId(S.katalog, pid);

  try {
    const rows = await SB.insert('orders', { supplier_id: Auth.me.id, status: 'offen', kind: 'wish', note: '' });

// Fotos erst holen, wenn sie im Chat zu sehen sind — und dann auf dem Gerät merken
async function hydratePhotos() {
  const els = [...document.querySelectorAll('img[data-mph]')].filter(el => !el.getAttribute('src'));
  for (const el of els) {
    const id = el.dataset.mph;
    if (!UUID.test(id)) continue;
    let ph = PHOTOS[id] || await Cache.get('ph_' + id);
    if (!ph && !offlineSince) {
      try {
        const r = await SB.select('messages', 'select=photo&id=eq.' + id);
        ph = r && r[0] && r[0].photo;
        if (safeImg(ph)) Cache.put('ph_' + id, ph);
      } catch (e) { }
    }
    if (!safeImg(ph)) continue;
    PHOTOS[id] = ph;
    el.onload = () => { if (tab === 'chat') window.scrollTo(0, document.body.scrollHeight); };
    el.src = ph;
  }
}
function dataUrlToBlob(d) {
  const i = d.indexOf(','), mime = d.slice(5, d.indexOf(';')), bin = atob(d.slice(i + 1));
  const u = new Uint8Array(bin.length);
  for (let k = 0; k < bin.length; k++) u[k] = bin.charCodeAt(k);
  return new Blob([u], { type: mime });
}
function photoSheet(src) {
  if (!safeImg(src)) return;
  openSheet('Foto', `
    <img class="photo-full" src="${src}" alt="Foto">
    <div class="btn-row"><button class="btn" id="phSave">In Fotos speichern</button></div>
    <p class="sub">Geht auch: lange aufs Bild drücken → „Zu Fotos hinzufügen".</p>
  `, () => {
    document.getElementById('phSave').onclick = async () => {
      const blob = dataUrlToBlob(src);
      const ext = blob.type === 'image/png' ? 'png' : blob.type === 'image/webp' ? 'webp' : 'jpg';
      const f = new File([blob], 'lager-foto-' + today() + '.' + ext, { type: blob.type });
      if (navigator.canShare && navigator.canShare({ files: [f] })) {
        try { await navigator.share({ files: [f] }); } catch (e) { }
      } else {
        const u = URL.createObjectURL(blob), a = document.createElement('a');
        a.href = u; a.download = f.name; document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(u); a.remove(); }, 800);
      }
    };
  });
}

function shrink(file, max, qual) {
  max = max || 700; qual = qual || 0.65;
  return new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const sc = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', qual));
      };
      im.onerror = () => res(''); im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

    ${o.needed_by ? `<div class="req-meta" style="margin-top:4px;color:var(--ink)">◷ ${esc(terminText(o))}</div>` : ''}
    ${o.note ? `<div class="req-text" style="margin-top:10px">${esc(o.note)}</div>` : ''}
    ${o.status === 'offen' ? debtBox(runnerDebt(o.supplier_id), orderValue(o), false) : ''}
    <div class="eyebrow">Artikel</div>
    ${its.map(i => {
      const p = byId(S.products, i.product_id);
      const rest = i.qty - i.done_qty;
      return `<div class="card" style="margin-bottom:8px">
        <div class="row-title">${esc(p ? p.name : 'Gelöscht')}</div>
        <div class="row-sub" style="margin-bottom:9px">Bestellt ${nf.format(i.qty)} · übergeben ${nf.format(i.done_qty)} · dein Lager ${p ? nf.format(stockOf(p.id)) : '?'}</div>
        ${rest > 0 && p ? `<div class="field-2">
          <div class="field"><label>Jetzt geben</label><input id="gq_${i.id}" type="number" inputmode="numeric" step="1" value="${rest}"></div>
          <div class="field"><label>Preis je Stück</label><input id="gp_${i.id}" type="number" inputmode="decimal" step="0.01" value="${p.runner_price || p.sell_price || 0}"></div></div>
          <button class="btn btn-ghost" data-give="${i.id}">Übergeben</button>`
        : '<p class="sub" style="margin:0">Komplett übergeben.</p>'}
      </div>`;
    }).join('') || '<p class="sub">Keine Artikel.</p>'}
    <div class="btn-row"><button class="btn" id="oDone">Bestellung abschließen</button></div>
    <div class="btn-row"><button class="btn btn-danger" id="oDel">Bestellung löschen</button></div>
  `, () => {
    document.querySelectorAll('[data-give]').forEach(el => el.onclick = async () => {
      if (!online()) return;
      const i = byId(S.items, el.dataset.give);
      const p = byId(S.products, i.product_id);
      const qty = n2(document.getElementById('gq_' + i.id).value);
      const price = n2(document.getElementById('gp_' + i.id).value);
      if (qty <= 0) return toast('Anzahl eintragen');
      if (qty > stockOf(p.id)) return toast('So viel hast du nicht');
      try {
        const mv = await SB.insert('movements', { type: 'handout', product_id: p.id, qty,
          unit_price: price, cost_price: 0, date: today(), partner_id: o.supplier_id });
        S.movements.unshift(mv[0]);
        const up = await SB.update('order_items', i.id, { done_qty: +i.done_qty + qty });
        const ix = S.items.findIndex(x => x.id === i.id); if (ix >= 0) S.items[ix] = up[0];
        toast('Übergeben'); orderSheet(o); render();
      } catch (e) { fail(e); }
    });
    document.getElementById('oDone').onclick = async () => {
      if (!online()) return;
      try {
        const up = await SB.update('orders', o.id, { status: 'erledigt' });
        const ix = S.orders.findIndex(x => x.id === o.id); if (ix >= 0) S.orders[ix] = up[0];
        closeSheet(); toast('Abgeschlossen'); render();
      } catch (e) { fail(e); }
    };
    document.getElementById('oDel').onclick = async () => {
      if (!online()) return;
      if (!confirm('Bestellung löschen?')) return;
      try {
        await SB.remove('orders', o.id);
        S.orders = S.orders.filter(x => x.id !== o.id);
        S.items = S.items.filter(x => x.order_id !== o.id);
        closeSheet(); toast('Gelöscht'); render();
      } catch (e) { fail(e); }
    };
  });
}

/* ----- Läufer-Karte ----- */
function runnerSheet(r) {
  if (!r) return;
  const d = runnerDebtOwed(r.id);
  const gut = runnerCredit(r.id);
  const list = runnerStockList(r.id).map(x => Object.assign({}, x, { p: byId(S.products, x.pid) })).filter(x => x.p);
  const verk = S.movements.filter(m => m.partner_id === r.id && m.type === 'runner_sale');
  const stk = verk.reduce((s, m) => s + +m.qty, 0);
  const gew = verk.reduce((s, m) => s + soldProfit(m), 0);
  openSheet(r.name, `
    <div class="kpis">
      <div class="kpi wide"><div class="lab">${d > 0.005 ? 'Schuldet dir' : gut > 0.005 ? 'Du schuldest ihm' : 'Alles bezahlt'}</div>
        <div class="val ${d > 0.005 ? 'neg' : gut > 0.005 ? 'pos' : 'pos'}">${money(gut > 0.005 ? gut : d)}</div></div>
      <div class="kpi"><div class="lab">Hat verkauft</div><div class="val">${nf.format(stk)}</div></div>
      <div class="kpi"><div class="lab">Dein Gewinn</div><div class="val ${gew >= 0 ? 'pos' : 'neg'}">${money(gew)}</div></div>
    </div>
    <div class="field" style="margin-top:14px"><label>Ort, den er abdeckt</label>
      <input id="rArea" value="${esc(r.area || '')}" placeholder="z. B. Flohmarkt Landshut"></div>
    <div class="btn-row"><button class="btn btn-ghost" id="rSaveArea">Ort speichern</button></div>
    ${r.active === false
      ? '<div class="btn-row"><button class="btn" id="rToggle" style="background:var(--pos)">Zugang freigeben</button></div><p class="sub">Solange er gesperrt ist, sieht er in der App nichts.</p>'
      : '<div class="btn-row"><button class="btn btn-ghost" id="rToggle">Zugang sperren</button></div>'}
    <div class="btn-row"><button class="btn" id="rPay">Zahlung eintragen</button></div>
    <div class="btn-row"><button class="btn btn-ghost" id="rEditDebt">Schulden bearbeiten</button></div>
    <p class="sub">Schulden verschwinden erst, wenn du hier eine Zahlung einträgst.</p>
    <div class="eyebrow">Was er gerade hat</div>
    <div class="stack">${list.length ? list.map(x => `
      <div class="row"><div class="row-main"><div class="row-title">${esc(x.p.name)}</div>
        <div class="row-sub">${money(x.price)} je Stück · Wert ${money(x.qty * x.price)}</div></div>
        <div class="qtybox"><span class="n">${nf.format(x.qty)}</span>
          <button class="sellbtn plusminus" data-back="${x.pid}">↩</button></div></div>`).join('')
      : '<p class="sub">Hat gerade nichts.</p>'}</div>
    <p class="sub">Mit ↩ nimmst du Ware zurück ins Lager.</p>
    <div class="eyebrow">Letzte Vorgänge</div>
    <div class="card">${ledger(r.id)}</div>
    <div class="btn-row"><button class="btn btn-danger" id="rDel">Läufer entfernen</button></div>
  `, () => {
    document.getElementById('rSaveArea').onclick = async () => {
      if (!online()) return;
      try {
        const up = await SB.update('profiles', r.id, { area: document.getElementById('rArea').value.trim() });
        const i = S.partners.findIndex(x => x.id === r.id); if (i >= 0) S.partners[i] = up[0];
        toast('Ort gespeichert'); render();
      } catch (e) { fail(e); }
    };
    document.getElementById('rPay').onclick = () => paySheet(r);
    document.getElementById('rEditDebt').onclick = () => debtEditSheet(r);
    document.getElementById('rToggle').onclick = async () => {
      if (!online()) return;
      const frei = r.active === false;
      if (!frei && !confirm(r.name + ' sperren? Er kann sich noch anmelden, sieht aber nichts mehr.')) return;
      try {
        const up = await SB.update('profiles', r.id, { active: frei });
        const i = S.partners.findIndex(x => x.id === r.id); if (i >= 0) S.partners[i] = up[0];
        toast(frei ? 'Freigegeben' : 'Gesperrt'); runnerSheet(up[0]); render();
      } catch (e) { fail(e); }
    };
    document.querySelectorAll('[data-back]').forEach(el => el.onclick = () => backSheet(r, el.dataset.back));
    document.getElementById('rDel').onclick = async () => {
      if (!online()) return;
      if (!confirm(r.name + ' komplett entfernen? Der Zugang wird gelöscht — er ist danach ausgeloggt und kommt nicht mehr rein.')) return;
      try {
        await SB.rpc('admin_remove_user', { target_id: r.id });
        S.partners = S.partners.filter(x => x.id !== r.id);
        closeSheet(); toast('Entfernt und ausgeloggt'); render();
      } catch (e) { fail(e); }
    };
  });
}
function ledger(sid) {
  const rows = [
    ...S.movements.filter(m => m.partner_id === sid).map(m => ({
      date: m.date,
      t: m.type === 'handout' ? 'Ware gegeben' : m.type === 'return' ? 'Zurückgenommen'
        : m.type === 'gift' ? 'Verschenkt' : 'Hat verkauft',
      s: nf.format(m.qty) + ' × ' + ((byId(S.products, m.product_id) || {}).name || '—'),
      v: m.type === 'handout' ? '+' + money(m.unit_price * m.qty)
        : m.type === 'return' ? '−' + money(m.unit_price * m.qty) : '',
      c: m.type === 'handout' ? 'neg' : m.type === 'return' ? 'pos' : 'dim'
    })),
    ...S.payments.filter(p => p.partner_id === sid).map(p => {
      if (p.direction === 'adjust') {
        const up = +p.amount >= 0;
        return { date: p.date, t: 'Korrektur', s: p.note || '',
          v: (up ? '+' : '−') + money(Math.abs(p.amount)), c: up ? 'neg' : 'pos', id: p.id };
      }
      return { date: p.date, t: 'Hat bezahlt', s: p.note || '', v: '−' + money(p.amount), c: 'pos', id: p.id };
    })
  ].sort((a, b) => String(b.date).localeCompare(String(a.date))).slice(0, 25);
  if (!rows.length) return '<div class="dim" style="font-size:14px">Noch nichts passiert.</div>';
  return rows.map(x => `<div class="ledger" ${x.id ? `data-pay="${x.id}"` : ''}>
    <div class="lm"><div>${esc(x.t)}</div><div class="ld">${deDate(x.date)}${x.s ? ' · ' + esc(x.s) : ''}</div></div>
    <div class="lv ${x.c}">${x.v}</div></div>`).join('');
}
function debtEditSheet(r) {
  const current = runnerDebt(r.id);
  const gut = current < -0.005;
  openSheet('Schulden bearbeiten · ' + r.name, `
    <p class="sub" style="margin-top:0">${gut
      ? `Gerade hat <b>er ${money(-current)} gut</b> bei dir — er hat mehr bezahlt oder zurückgegeben, als er schuldete. Trag 0 ein, wenn ihr das verrechnet habt.`
      : `Gerade steht die Schuld bei <b>${money(current)}</b>. Trag ein, was stattdessen stimmt — den Unterschied gleicht die App im Hintergrund aus.`}</p>
    <div class="field"><label>Richtiger Betrag an Schulden</label>
      <input id="dbNew" type="number" inputmode="decimal" step="0.01" value="${Math.max(0, current).toFixed(2)}"></div>
    <div class="field"><label>Grund (optional)</label>
      <input id="dbNote" placeholder="z. B. Kulanz, Tippfehler korrigiert"></div>
    <div class="btn-row"><button class="btn" id="dbGo">Speichern</button></div>
  `, () => {
    document.getElementById('dbGo').onclick = async () => {
      if (!online()) return;
      const target = n2(document.getElementById('dbNew').value);
      const diff = target - current;
      if (Math.abs(diff) < 0.005) { closeSheet(); return; }
      try {
        const rows = await SB.insert('payments', {
          partner_id: r.id, amount: diff, direction: 'adjust',
          date: today(), note: document.getElementById('dbNote').value.trim() || 'Korrektur'
        });
        S.payments.push(rows[0]);
        closeSheet(); toast('Schulden angepasst'); runnerSheet(r); render();
      } catch (e) { fail(e); }
    };
  });
}
function paySheet(r) {

      if (!online()) return;

      if (a <= 0) return toast('Betrag eintragen');

function backSheet(r, pid) {

  if (!x || !p) return;
  openSheet('Zurück ins Lager', `
    <p class="sub" style="margin-top:0">${esc(r.name)} hat ${nf.format(x.qty)} × ${esc(p.name)}.</p>
    <div class="field"><label>Wieviel kommt zurück?</label>
      <input id="bkQty" type="number" inputmode="numeric" step="1" value="${x.qty}"></div>

    <div class="btn-row"><button class="btn" id="bkGo">Zurücknehmen</button></div>
  `, () => {
    document.getElementById('bkGo').onclick = async () => {
